 id:'n1',kind:'narrative',title:'The Repair Table',tag:'Real-life narrative',text:`On the first Saturday of April, Maya stood outside the neighbourhood repair café holding a toaster that had stopped working. She had promised her grandfather she would fix it, although she knew almost nothing about electrical appliances. Through the window she could see volunteers bent over bicycles, lamps and radios. Maya considered going home.\n\nInside, a volunteer named Mrs. Chen examined the toaster but did not reach for a screwdriver. Instead, she asked Maya to describe what had happened. “It worked yesterday, but today the lever will not stay down,” Maya explained. Mrs. Chen showed her how to unplug the device, examine the cord and look for crumbs around the lever. The two discovered that a small piece of plastic was blocking the mechanism.\n\nTwenty minutes later, the toaster worked. Maya offered Mrs. Chen five dollars, but the volunteer pointed to a sign: REPAIRS ARE FREE; CURIOSITY IS REQUIRED. Maya laughed and asked whether she could come back the following week. Mrs. Chen handed her a volunteer form.\n\nOn her way home, Maya noticed the toaster was no lighter than before. Yet the walk felt easier.`,

 id:'n2',kind:'narrative',title:'The Last Bus',tag:'Real-life narrative',text:`Eli had spent months preparing for the regional chess final. By the time the championship ended, the sky was dark and the next bus was already approaching the stop. His teammate Noor ran toward it, but Eli stayed beside a younger player who was searching frantically for her transit card.\n\n“You go,” the younger student said. “I can call someone.” Eli watched the bus doors close. He had missed the quickest route home and would have to wait forty minutes. He took a slow breath, then helped search the pockets of her backpack. The card was eventually found inside a library book.\n\nAs they waited, Eli asked the younger player about her matches. She admitted that after losing her first game, she had considered leaving. Eli told her about losing every match at his first tournament. “I almost didn't come back,” he said. “But nobody improves by leaving before the next game.”\n\nA week later, Eli opened the club's email and found a message from the player. She had joined a school chess team. At the bottom she wrote, “Thanks for staying.” Eli printed the message and put it beside the silver medal he had won that night.`,

 id:'n3',kind:'narrative',title:'The Flooded Archive',tag:'Real-life narrative',text:`When an overnight storm flooded the community centre basement, Sana worried most about a box of photographs from the town's centennial celebration. Her grandmother had helped organize the event decades earlier, and the photographs were scheduled to appear in a school exhibition.\n\nSana arrived to find the floor covered in muddy water. The box had been moved onto a table by a caretaker, but several photographs were damp. A librarian explained that drying them too quickly could cause damage. Sana wanted to use a hair dryer, then stopped herself and listened. Together they placed each picture on clean paper in a cool room.\n\nFor three afternoons, Sana returned to help catalogue the images. Some had dates on the back. Others showed unfamiliar people standing outside businesses that no longer existed. She began asking older residents to identify them. One woman recognized her own father in a photograph of the first winter festival.\n\nThe exhibition opened a week late. Instead of organizing photographs strictly by year, Sana displayed them with short stories contributed by residents. Visitors lingered longer than she expected. Her grandmother, looking at the walls, said, “You saved more than pictures.”`,

 id:'n4',kind:'narrative',title:'The Prototype That Stopped',tag:'Real-life narrative',text:`For the school innovation fair, Jonah designed a robot that would sort plastic bottles from paper. In the classroom, the machine performed flawlessly. It rolled toward a bin, detected a bottle and lifted it with a small mechanical arm. Jonah rehearsed his demonstration until he could explain every wire.\n\nOn fair day, the robot stopped after moving only a few centimetres. Jonah restarted the program twice. He felt his face grow warm as visitors gathered. His partner Aisha noticed that a cable had become trapped under a wheel during transport. The robot would move again if they untangled it, but the repair would take several minutes.\n\n“We could pretend it's the final stage of the presentation,” Jonah whispered. Aisha shook her head. “Or we could explain what happened.” They told the visitors about the cable, then described how they would redesign the frame to protect it. A visiting engineer asked thoughtful questions about their plan.\n\nThe team did not win the best-demonstration prize, but it earned a design-process award. Jonah kept the damaged cable in a notebook. At the next meeting, he began with the problem instead of hiding it.`,

 id:'n5',kind:'narrative',title:'A Different Kind of Map',tag:'Real-life narrative',text:`On the first day of a summer volunteer project, Leila was given a map of the park and asked to check whether the walking paths were accessible. She had used the park for years and thought she knew every corner. Her first checklist contained only one note: the path beside the pond was cracked.\n\nThe next day, Leila walked with Ben, a volunteer who used a wheelchair. Ben stopped at a gate that seemed wide enough until he tried to turn through it. At another point, he showed Leila how a steep slope could be difficult even when the surface was smooth. Near the playground, a bench blocked the shortest route to a water fountain.\n\nLeila opened her old map and began marking obstacles. By the end of their walk, the page was crowded with coloured circles. “I thought the park was accessible,” she admitted. Ben replied, “It may be, depending on how you move through it.”\n\nWhen Leila presented the revised map to the parks committee, she suggested that future inspections include residents with different mobility needs. Her report began with a simple sentence: “A map is only useful when it reflects the people using it.”`,

 id:'i1',kind:'information',title:'Why Cities Plant Shade Trees',tag:'Information paragraph',text:`In summer, streets lined with asphalt and concrete can feel much hotter than nearby parks. Dark surfaces absorb sunlight during the day and release stored heat slowly. This is one reason some urban areas experience a “heat island” effect, in which built-up neighbourhoods remain warmer than surrounding green spaces.\n\nPlanting shade trees can help in several ways. Their leaves block some sunlight from reaching sidewalks and buildings. Water released through leaves can also cool the surrounding air. When trees shade homes, residents may need less energy for cooling on hot days. Trees can provide habitats for birds and help manage rainfall too.\n\nHowever, planting a tree is not the same as maintaining one. Young trees need watering, enough space for roots and protection from damage. Communities also need to consider suitable species and the placement of trees near sidewalks, roads and electrical wires.\n\nUrban trees are therefore more than decoration. With thoughtful planning and long-term care, they can make public spaces more comfortable and resilient.`,

 id:'i5',kind:'information',title:'How Rain Gardens Work',tag:'Information paragraph',text:`During heavy rain, water can flow quickly across rooftops, roads and parking lots. If too much reaches storm drains at once, some neighbourhoods experience localized flooding. A rain garden is a shallow planted area designed to collect runoff temporarily and allow it to soak into the ground.\n\nRain gardens often contain native plants that tolerate periods of both wet and dry conditions. Their roots help maintain soil structure, while layers of soil and gravel encourage water to move below the surface. They are not intended to remain full of water like ponds.\n\nLocation matters. A rain garden must be placed where it can receive runoff without damaging building foundations. Designers also consider underground utilities, soil conditions and the amount of rainwater expected from nearby surfaces.\n\nRain gardens cannot prevent every flood, but they can form part of a larger approach to managing stormwater. Along with maintained drains and other green spaces, they help communities respond to intense rainfall.`,

const LESSONS=[
{day:1,id:'d1l1',name:'What the OSSLT actually tests',mins:9,skill:'format',lead:'Know the map before entering the maze.',steps:[['The real blueprint','The test has Session A (~65 min) and Session B (~75 min). There are 35 scored selected-response and 2 scored open-response items. An official test can also contain unscored field-test items.'],['Six task families','Real-life narrative (7 scored selected-response); information paragraph (6); news report (5 plus a ~100-word written response); dialogue (5); writing selected-response (12); opinion essay (~500 words).'],['A result is not a percentage','EQAO reports a scale score from 200 to 400. A scale score of 300 means successful. Practice percentages here measure only your own training accuracy, not your expected EQAO scale score.'],['The three reading skills','Explicit = what is stated. Implicit = what must be inferred from clues. Connections = what text ideas mean in a broader relevant situation.'],['The three writing skills','Develop a main idea with supporting details; organize information logically; use spelling, grammar and punctuation clearly.']],trap:'Do not treat the number 300 as “75%.” The scale is statistical, not a raw percentage.',example:'Question: “Which detail is explicitly stated?” Find the exact line. Do not substitute a reasonable guess.',focus:['format','explicit','main idea']},
{day:1,id:'d1l2',name:'Explicit answers: find, verify, answer',mins:9,skill:'explicit',lead:'Read what is there, not what could be there.',steps:[['Scan the question first','Circle mentally the target: who, what, where, when, how many, why. This makes reading purposeful.'],['Find the anchor','Return to the exact sentence or paragraph where the answer appears. Match meaning, not identical wording.'],['Check qualifiers','Words such as “some,” “may,” “most,” “only,” “before,” and “after” decide whether an answer is supported.'],['Eliminate attractive mistakes','An option can be realistic but unmentioned. Another may combine one true detail with one false detail. Both are wrong.']],trap:'“Always” and “never” often overstate a passage that says “sometimes,” but do not reject them automatically.',example:'Text: “Registration is recommended because only 24 seats are available.” Answer: capacity is limited, not that registration is legally required.',focus:['explicit','evidence']},
{day:1,id:'d1l3',name:'Evidence versus assumptions',mins:8,skill:'evidence',lead:'Prove your choice with a line.',steps:[['Evidence is observable','The text says what someone did, said or experienced. A reader’s outside beliefs are not evidence unless the prompt specifically requests a connection.'],['Separate fact and opinion','Facts can be checked. Opinions make judgments (“best,” “most exciting,” “should”). A quotation can be a fact about what someone said while the quoted claim itself remains an opinion.'],['The evidence test','For each answer choice, ask: can I point to a detail that directly supports it? If not, eliminate it.'],['Best answer, not merely possible','More than one option can sound plausible. Choose the one supported most strongly by the passage, especially for inference.']],trap:'A vivid answer choice is not necessarily correct. Strong supporting evidence beats dramatic wording.',example:'“Sixty students attended” = checkable. “The event was the greatest ever” = opinion.',focus:['fact-opinion','explicit','evidence']},
{day:1,id:'d1l4',name:'Baseline: learn your question types',mins:8,skill:'format',lead:'Get comfortable with how the site asks questions.',steps:[['Single selection','Pick one strongest answer, then check your reasoning against the explanation.'],['Multi-selection and checklists','Choose all requested answers. Read whether the question asks for two, three or all that apply.'],['Drop-down, fill and ordering','Write or select the precise form. Organize ideas according to sequence, cause and effect, or paragraph logic.'],['Use feedback as a map','Correct answers are not enough. Track what skill caused an error and retry related questions in the Mistake Lab.']],trap:'Do not rush past explanations after getting a question right by luck.',example:'If a prompt asks for TWO details, one correct choice is incomplete.',focus:['organization','explicit','tense']},
{day:2,id:'d2l1',name:'Make inferences like a detective',mins:10,skill:'inference',lead:'Inference = text clues + sensible reasoning.',steps:[['Local inferences','Combine details in one sentence or paragraph to understand a feeling, motivation or unstated fact.'],['Global inferences','Look across the whole selection to infer a central theme, overall purpose or change in character.'],['The bridge method','Write a mental bridge: “Because the text says X, it suggests Y.” The inference must not require an invented event.'],['Watch strength','A statement that is probably true is not the same as one that must be true; select the best-supported answer.']],trap:'Never invent a character’s thoughts, diagnoses or future actions.',example:'A student rehearses repeatedly and checks the clock: nervousness or concern about timing is supported; “hates speaking” is not proven.',focus:['inference','character','theme']},
{day:2,id:'d2l2',name:'Main idea, theme and purpose',mins:10,skill:'main idea',lead:'Three similar questions, three different jobs.',steps:[['Main idea','What is most of the selection about? A strong main idea covers the whole text without becoming vague.'],['Theme','The broader insight a narrative communicates about people or life. “A chess player” is a topic; “support matters more than winning” is a theme.'],['Author’s purpose','Why was it written? Inform, explain, persuade, entertain or reflect—sometimes in combination.'],['The one-sentence test','Try: “This text mainly shows that ...” Then see which option captures the greatest portion of the passage.']],trap:'A true detail from paragraph one is often too narrow to be the main idea.',example:'Story: a team openly fixes a failed robot. Theme: learning from failure builds better solutions.',focus:['main idea','theme','purpose']},
{day:2,id:'d2l3',name:'Vocabulary in context & tone',mins:9,skill:'vocabulary',lead:'Do not pick a definition before reading the sentence.',steps:[['Replace the word','Read the sentence with each possible meaning. The right one preserves the local meaning.'],['Use contrast clues','Words like however, although and instead often signal a shift that narrows the meaning.'],['Tone is an attitude','Neutral, hopeful, skeptical, concerned, admiring, critical and humorous describe how the writer sounds.'],['Do not overread','One negative word does not make the whole text furious; judge its overall style.']],trap:'The most common dictionary meaning is not always the meaning used here.',example:'“A resilient community recovered after the storm.” Resilient means able to recover, not resistant to all change.',focus:['vocabulary','tone','inference']},
{day:2,id:'d2l4',name:'Narrative lab: motivation & change',mins:11,skill:'character',lead:'Characters are revealed through choices.',steps:[['Track the sequence','Identify the initial situation, challenge, decision, consequence and resolution.'],['Look for turning points','A choice or new piece of information often changes a character’s perspective.'],['Ask why','A character’s action can reflect fear, generosity, curiosity or responsibility, but only when details support it.'],['Study the ending','A meaningful object, repeated image or contrast can symbolize growth.']],trap:'Do not confuse what a character says with what the whole narrative endorses.',example:'Keeping a thank-you note beside a medal suggests personal impact matters as much as the award.',focus:['character','theme','structure']},
{day:3,id:'d3l1',name:'Information paragraphs without overload',mins:10,skill:'main idea',lead:'Turn dense prose into a simple map.',steps:[['Label each paragraph','Use 2–4 words: problem, benefits, limits, solution, conclusion.'],['Notice text structure','Cause-effect: because/as a result; compare-contrast: whereas/however; sequence: first/then; problem-solution: challenge/response.'],['Read for precise claims','A writer may say something “can” help, not that it “will” solve every issue.'],['Find the controlling idea','The best summary includes the main claim plus the essential conditions or qualifications.']],trap:'Do not choose a summary that ignores a paragraph discussing limitations.',example:'Rain gardens can absorb some runoff, but they need careful placement and do not prevent all floods.',focus:['main idea','structure','explicit']},
{day:3,id:'d3l2',name:'News reports: 5W + H',mins:9,skill:'news',lead:'Scan news like a reporter.',steps:[['Who / What / Where / When','The opening often carries the most important facts. Identify the event, people, place and time.'],['Why / How','Later details add causes, methods, outcomes and context.'],['Quotes have jobs','An interview quotation may show a participant’s experience or explain why an event matters.'],['Distinguish fact from prediction','“Plans to expand” is not “expanded.” A proposal is not a confirmed outcome.']],trap:'Do not turn a future plan into an accomplished fact.',example:'“Will review feedback in three months” means the final decision has not yet been made.',focus:['news','explicit','inference']},
{day:3,id:'d3l3',name:'The 100-word response',mins:12,skill:'short response',lead:'Answer the question, prove it, explain it.',steps:[['Decode the command','“Explain how” requires a mechanism or relationship; “Describe why” requires a reason with support.'],['Make a direct claim','Begin with a sentence that answers the question rather than repeating the prompt word for word.'],['Use two accurate details','Select two details from the news report that actually relate to your claim. Avoid inventing quotations.'],['Explain each detail','Say how the evidence proves the point; do not leave evidence hanging.'],['Aim for clarity around 100 words','The framework presents a 100-word response. Prioritize relevant, complete development over padding.']],trap:'A 100-word answer that repeats itself is weaker than a concise, fully supported response.',example:'Claim: The weekend program improves access. Detail: it is free. Explain: students can participate without paying registration fees.',focus:['short response','evidence','organization']},
{day:3,id:'d3l4',name:'Fast evidence selection',mins:9,skill:'evidence',lead:'Find details that do actual work.',steps:[['Match evidence to the question','For “How does this improve access?” use details about cost, schedules or accessibility—not a participant’s favourite colour.'],['Choose quality over quantity','One precise detail with explanation can outperform three unrelated details.'],['Paraphrase fairly','You can explain text in your own words as long as the meaning is preserved.'],['Watch mixed claims','“All participants found the program useful” is unsupported if only one participant is quoted.']],trap:'Do not give a quote a broader meaning than its speaker intended.',example:'A survey of 180 students describes respondents, not every teenager in the city.',focus:['evidence','explicit','inference']},
{day:4,id:'d4l1',name:'Dialogue: read between the lines',mins:10,skill:'dialogue',lead:'What a speaker wants is not always directly stated.',steps:[['Track each speaker','Write down the goal, concern and suggestion of each person.'],['Watch turns','An objection may be followed by compromise, which often answers the question about the outcome.'],['Infer from language','“I spent hours making these graphs” suggests effort and reluctance to cut work.'],['Separate views','One speaker’s concern is not the group’s final decision.']],trap:'Do not attribute a suggestion to the wrong speaker.',example:'“Can we ask students first?” points to consultation, not opposition to all events.',focus:['dialogue','inference','character']},
{day:4,id:'d4l2',name:'Structure, sequence & purpose',mins:9,skill:'structure',lead:'How information is arranged changes its meaning.',steps:[['Chronology','Look for dates, before, after, later, finally. Events can be reordered in answer choices.'],['Cause and effect','Identify what caused an outcome; do not reverse the direction.'],['Compare and contrast','Ask which two things are compared and on what basis.'],['Paragraph function','A paragraph may introduce a problem, illustrate a claim, address a limitation or conclude.']],trap:'“After” does not mean “because.” Sequence alone does not prove causation.',example:'A library plans expansion after reviewing feedback: review happens first; expansion remains conditional.',focus:['structure','organization','news']},
{day:4,id:'d4l3',name:'Multi-select, drag-drop & drop-down',mins:9,skill:'format',lead:'Accuracy is also following the format.',steps:[['Count the requested answers','When asked for two supporting details, select exactly two if the question specifies two.'],['Evaluate every checkbox independently','An option is correct only if it satisfies the prompt—not because it appears with a correct choice.'],['Order by logic','For sequences, find the first event and the final outcome, then place the middle steps.'],['Use drop-down context','Read the complete sentence after selecting the option; agreement and transitions depend on context.']],trap:'A multi-selection response with an extra unsupported choice can be marked wrong.',example:'Sequence: survey need → design a trial → collect feedback → decide whether to expand.',focus:['format','organization','explicit']},
{day:4,id:'d4l4',name:'Reading speed with accuracy',mins:10,skill:'strategy',lead:'Skimming is selective attention, not skipping evidence.',steps:[['First pass: 45-second overview','Identify the text type, title, subject and main development.'],['Question-driven second pass','Locate a likely paragraph for each question. Look at qualifiers and pronouns.'],['Mark difficult items','Do not spend several minutes on one multiple-choice question while leaving easier ones empty.'],['Review high-value errors','Use remaining time to revisit guesses and check text support.']],trap:'Reading faster without checking evidence often costs more time in corrections.',example:'For “Why did the character leave?” reread the turning point, not every description.',focus:['strategy','explicit','inference']},
{day:5,id:'d5l1',name:'Opinion essays: choose a defensible stance',mins:11,skill:'thesis',lead:'Clarity beats fancy vocabulary.',steps:[['Answer the actual prompt','Take a clear position. You may acknowledge complexity while remaining decisive.'],['Choose 2–3 different reasons','Make them distinct: learning, community impact, practical access—not three versions of the same idea.'],['Plan examples','For each reason, prepare a realistic example you can fully explain. Personal or hypothetical examples are fine if presented honestly.'],['Avoid sweeping absolutes','“Often” and “can” may be more defensible than “always” and “everyone.”']],trap:'An essay that discusses both sides without a clear position can lose focus.',example:'“School clubs deserve more support because they build practical skills, friendships and belonging.”',focus:['thesis','argument','evidence']},
{day:5,id:'d5l2',name:'The five-paragraph structure',mins:12,skill:'organization',lead:'A safe structure you can adapt.',steps:[['Introduction','Context (1–2 sentences) → clear opinion → roadmap of main reasons. Avoid an enormous hook.'],['Body paragraph 1','Topic sentence → specific example → detailed explanation → link to argument.'],['Body paragraph 2','Develop a different reason; do not rephrase paragraph 1.'],['Body paragraph 3','Develop a third reason OR a nuanced reason + response to a counterargument.'],['Conclusion','Restate your position in fresh language, synthesize your reasons, finish with significance.'],['Length','The framework describes a 500-word opinion essay. You should write developed paragraphs rather than using length alone as a quality signal.']],trap:'Five paragraphs are a reliable template, not a strict EQAO requirement for every response.',example:'Intro ~60–90 words; 3 body paragraphs ~100–130 each; conclusion ~50–80 (flexible planning).',focus:['organization','thesis','transitions']},
{day:5,id:'d5l3',name:'PEEL without sounding robotic',mins:10,skill:'evidence',lead:'Point → Evidence → Explain → Link.',steps:[['Point','State the reason this paragraph proves.'],['Evidence','Give a concrete example: a study, situation or plausible school scenario. Never invent a statistic as a real fact.'],['Explain','This is the high-value step: show WHY the example supports your point.'],['Link','Connect the paragraph back to the overall opinion while transitioning naturally.']],trap:'Evidence without analysis is a list, not an argument.',example:'Point: Clubs teach leadership. Example: Students organize a fundraiser. Explanation: They must divide tasks, solve disagreements and meet deadlines.',focus:['evidence','argument','organization']},
{day:5,id:'d5l4',name:'A+ essay model: read like an examiner',mins:12,skill:'revision',lead:'A polished example is a guide, not a script to memorize.',steps:[['Focus','Every paragraph answers the exact question.'],['Development','The model does more than state a reason. It shows an example and explains its relevance.'],['Organization','Transitions and topic sentences make progression obvious.'],['Conventions','Clear, natural sentences are better than awkward attempts to sound sophisticated.'],['Revision','Ask: “Which sentence adds a new idea? Which only repeats something?”']],trap:'There is no single “perfect essay” that works for every prompt.',example:'Compare the weak claim “Clubs are good” with “Clubs create a place for students to practise organizing real projects.”',focus:['revision','organization','thesis']},
{day:6,id:'d6l1',name:'Sentence basics: complete thoughts',mins:10,skill:'sentence',lead:'Fix fragments, run-ons and fused ideas.',steps:[['A complete sentence','Usually has a subject, a finite verb and a complete thought.'],['Fragment','“Although the workshop was useful.” is incomplete because “although” begins a dependent clause.'],['Comma splice','“The rain stopped, we went outside.” incorrectly joins two independent clauses with only a comma.'],['Three safe fixes','Use a period; a semicolon; or comma + coordinating conjunction such as “and,” “but,” or “so.”']],trap:'A long sentence is not automatically a run-on; structure matters more than length.',example:'“The rain stopped, so we went outside.”',focus:['sentence','punctuation','clarity']},
{day:6,id:'d6l2',name:'Tenses & verb agreement',mins:10,skill:'tense',lead:'Make the timeline make sense.',steps:[['Simple present','Habits and general truths: “She practises daily.”'],['Simple past','Completed actions: “She practised yesterday.”'],['Future','Plans/predictions: “She will practise tomorrow.”'],['Present perfect','Past action linked to now: “She has practised all week.”'],['Past perfect','Earlier of two past events: “She had left before I arrived.”'],['Agreement','“Each student is,” “the students are,” “the group is.” Match the verb to the head noun, not a nearby plural noun.']],trap:'Do not change tense mid-story unless the time frame genuinely changes.',example:'Wrong: “Yesterday she walks home and finished her homework.” Right: “Yesterday she walked home and finished her homework.”',focus:['tense','agreement','grammar']},
{day:6,id:'d6l3',name:'Punctuation, clarity & transitions',mins:11,skill:'punctuation',lead:'A small set of rules fixes a large share of errors.',steps:[['Commas','After an introductory dependent clause; between list items; between independent clauses joined with FANBOYS (when appropriate).'],['Apostrophes','Contractions: “it’s = it is.” Possession: “student’s,” “students’,” “children’s.”'],['Pronouns','Ensure “he,” “she,” “they” and “it” clearly refer to the intended noun.'],['Transitions','Addition: furthermore. Contrast: however. Cause: therefore. Example: for instance. Sequence: finally.'],['Conciseness','Replace “due to the fact that” with “because.” Replace vague praise with precise details.']],trap:'Transition words are not interchangeable. “However” does not show cause and effect.',example:'“The project was delayed; however, the team continued planning.”',focus:['punctuation','apostrophes','transitions']},
{day:6,id:'d6l4',name:'Revision sprint: highest-impact edits',mins:9,skill:'revision',lead:'Check meaning before tiny spelling details.',steps:[['Pass 1: Task','Did you actually answer the question? Is the position or main claim clear?'],['Pass 2: Development','Does each important point have an example and an explanation?'],['Pass 3: Organization','Are there sensible paragraph breaks, topic sentences and clear transitions?'],['Pass 4: Conventions','Read for missing verbs, tense changes, run-ons, unclear pronouns, punctuation and spelling.'],['Pass 5: Final check','Remove repeated phrases and unsupported absolutes, then ensure you have not left anything blank.']],trap:'Perfect commas will not rescue an essay that never answers the question.',example:'Weak: “It is good. It helps. It is good.” Better: “The program builds confidence by allowing students to practise skills with feedback.”',focus:['revision','clarity','organization']},
{day:7,id:'d7l1',name:'Session A strategy',mins:9,skill:'strategy',lead:'Protect accuracy through 65 focused minutes.',steps:[['Plan reading time','Scan the selection, answer questions with evidence, and mark uncertain responses.'],['Approach the written response','Budget time to identify the prompt, gather two relevant details, write a direct explanation and revise.'],['Do not assume every question is worth one point','Scored selected-response items can have different raw point values. Every question deserves attention.'],['Use built-in supports','The official platform offers tools such as highlighting, zoom, line reader, notes and text-to-speech. Explore them in the official practice test.']],trap:'Our simulator’s question arrangement is a study approximation; EQAO may present the actual sections differently.',example:'If stuck, eliminate unsupported options, mark for review and continue.',focus:['strategy','format','short response']},
{day:7,id:'d7l2',name:'Session B strategy',mins:9,skill:'strategy',lead:'Budget attention for the opinion essay.',steps:[['Choose a stance quickly','Planning is useful, but excessive planning steals writing time.'],['Outline before typing','List an opinion, 2–3 reasons and one example for each.'],['Develop, do not inflate','Explanation and relevance matter more than long introductions or difficult vocabulary.'],['Leave revision time','Scan each paragraph for relevance and then proofread common grammar issues.']],trap:'This practice environment cannot automatically assign an official EQAO writing score.',example:'A practical personal pacing target is ~5 minutes outline, substantial drafting time and a final check—adapt to your speed.',focus:['strategy','thesis','revision']},
{day:7,id:'d7l3',name:'Review your personal error map',mins:9,skill:'strategy',lead:'Target patterns instead of rereading everything.',steps:[['Sort by skill','Missed evidence? Revisit explicit and inference drills. Missed sentence logic? Revisit grammar and organization.'],['Error notebook','Record “I chose X because...” and “The correct answer is Y because...” to stop repeating the same trap.'],['Retest without hints','When you understand the explanation, retry a similar question independently.'],['Writing review','Compare your response with the checklist and model, not a fictional automatic 90% grade.']],trap:'Repeating only your favourite easy drills inflates practice accuracy without building readiness.',example:'If “however” versus “therefore” keeps causing errors, drill transitions until you can explain the difference.',focus:['strategy','revision','evidence']},
{day:7,id:'d7l4',name:'Final readiness checklist',mins:9,skill:'format',lead:'Walk into the test with a repeatable process.',steps:[['Before the test','Confirm your school’s scheduled date and permitted accommodations. Arrive prepared to follow school instructions.'],['Reading','Locate evidence, identify the exact skill, eliminate unsupported claims and watch qualifiers.'],['Writing','Answer directly, support with specifics, explain, organize and proofread.'],['Technical','Practice using the official EQAO platform and permitted built-in tools.'],['Mindset','A difficult question does not determine the whole outcome. Move forward and return when possible.']],trap:'The OSSLT is a graduation literacy requirement; it does not automatically award scholarships or a 90% course mark.',example:'The goal is to demonstrate clear Grade 9-level literacy, not memorize facts about Ontario politics.',focus:['format','strategy','revision']}
];

const MODELS={
 short:{title:'Sample: news-report response',prompt:'Explain how the free library makerspace could benefit local teenagers.',weak:'The makerspace is good because it is nice and useful. The students can use it. The library did a good job. There will be more stuff and kids will like it.',strong:`The new makerspace could help local teenagers develop practical skills and explore creative interests without paying for expensive equipment. According to the report, the Saturday program provides free design activities and supervised workshops. This means students who might not have access to these tools at home can still participate. The project also encourages students to learn from mistakes. For example, a volunteer explains that designs do not always work on the first attempt. By providing a supportive space for experimentation, the library can help young people build confidence, solve problems and connect with others who share their interests.`},
 essay:{title:'Sample: developed opinion essay',prompt:'Should students be encouraged to volunteer in their communities?',weak:`Volunteering is good. First, it is good for students. Also, the community likes volunteering. Next, volunteering is helpful. In conclusion, students should volunteer because it is good.`,strong:`Students learn important lessons in classrooms, but some skills are best developed through real experiences. Volunteering gives young people opportunities to work with others, solve practical problems and contribute to places they care about. For these reasons, students should be encouraged to volunteer in their communities, provided that schools respect their schedules and individual circumstances.\n\nFirst, volunteering helps students develop useful skills. For example, a teenager who assists at a community event may need to greet visitors, follow a schedule and respond when plans change. These responsibilities encourage communication and problem-solving in situations that have real consequences. Such experiences can also help students become more confident when applying for jobs or taking on leadership roles.\n\nSecond, volunteering connects students with people outside their usual social groups. A student who helps at a food bank might work alongside adults, younger children and residents with different backgrounds. By listening to others and completing shared tasks, the student can gain a more realistic understanding of local needs. These relationships can make a community feel less anonymous and more supportive.\n\nThird, volunteering allows teenagers to see that their actions can make a difference. Consider a group that organizes a neighbourhood cleanup. At first, removing litter may seem like a small task. However, when residents notice and begin caring for the area too, the students can see how an individual effort may encourage wider participation. This sense of responsibility often matters more than receiving recognition.\n\nSome people argue that busy students do not have enough time to volunteer. This is a fair concern because schoolwork, family responsibilities and paid employment can already fill their schedules. That is why volunteering should be encouraged through flexible opportunities rather than treated as a competition over hours. A short, meaningful commitment may be more valuable than a long activity completed only to impress others.\n\nOverall, encouraging students to volunteer benefits both young people and their communities. By developing practical skills, building connections and seeing the impact of their choices, students gain experiences that textbooks alone cannot provide. The best volunteer programs respect students’ time while giving them a genuine opportunity to contribute.`}
};

function seededRandom(seed){let a=seed|0; return ()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}};
function shuffle(a,r=Math.random){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function generatedQuestion(seed){
 const r=seededRandom(seed), pick=a=>a[Math.floor(r()*a.length)];
 const kind=seed%10;
 const sub=pick(GEN_SUBJECTS), verb=pick(GEN_VERBS), obj=pick(GEN_OBJECTS), plural=pick([0,1]), who=sub[plural], v=plural?verb[0]:verb[1];
 let x;
 if(kind===0){
  const target=`${who.charAt(0).toUpperCase()+who.slice(1)} ${v} ${obj} every week.`;
  const wrong1=`${who.charAt(0).toUpperCase()+who.slice(1)} ${plural?verb[1]:verb[0]} ${obj} every week.`;
  const wrong2=`${who.charAt(0).toUpperCase()+who.slice(1)} ${verb[3]} ${obj} every week.`;
  x=q('Choose the sentence with correct agreement. [New scenario]',[target,wrong1,wrong2,`${who.charAt(0).toUpperCase()+who.slice(1)} are ${verb[0]} ${obj} every week.`],0,'The verb must agree with the singular/plural subject.','agreement');
 }else if(kind===1){
   const time=pick(['yesterday','last week','last month','three days ago']);
   const lead=who.charAt(0).toUpperCase()+who.slice(1);
   x=q(`Choose the correct past tense. (Time: ${time})`,[`${lead} ${verb[2]} ${obj} ${time}.`,`${lead} ${verb[0]} ${obj} ${time}.`,`${lead} will ${verb[0]} ${obj} ${time}.`,`${lead} ${verb[3]} ${obj} ${time}.`],0,`The time marker “${time}” points to a completed past action; use “${verb[2]}.”`,'tense');
 }else if(kind===2){
   const lead=who.charAt(0).toUpperCase()+who.slice(1);
   x=q('Choose the grammatically correct present continuous sentence.',[`${lead} ${plural?'are':'is'} ${verb[3]} ${obj} now.`,`${lead} ${plural?'is':'are'} ${verb[3]} ${obj} now.`,`${lead} ${plural?'are':'is'} ${verb[0]} ${obj} now.`,`${lead} ${verb[3]} ${obj} now.`],0,'Present continuous requires the matching form of “be” + verb-ing.','tense');
 }else if(kind===3){
  const set=pick(HOMOPHONE_SETS), h=pick(set); x=q('Choose the word that completes this sentence: '+h.s,h.opts,h.opts.indexOf(h.a),h.ex,'homophones');
 }else if(kind===4){
  const tr=pick(GEN_TRANSITIONS), categories={However:'contrast',Nevertheless:'contrast','In contrast':'contrast',Therefore:'result','As a result':'result','For example':'example',Furthermore:'addition',Meanwhile:'time'},opts=shuffle(GEN_TRANSITIONS.filter(t=>categories[t.a]!==categories[tr.a]),r).slice(0,3).map(t=>t.a);let all=shuffle([tr.a,...opts],r);
  x=q(`${tr.arr[0]} ___, ${tr.arr[1].charAt(0).toLowerCase()+tr.arr[1].slice(1)}`,all,all.indexOf(tr.a),tr.ex,'transitions');
 }else if(kind===5){
   const s=pick(GEN_SCENARIOS);

 }else if(kind===6){
   const s=pick(GEN_SCENARIOS);

 }else if(kind===7){
  const s=pick(GEN_SCENARIOS), good=`${s[0][0].toUpperCase()+s[0].slice(1)} offers a practical benefit: ${s[2]}.`;
  x=q('Select BOTH elements of a strong opinion paragraph.',shuffle(['A focused point','A specific example with explanation','An unrelated story','Repeating the same sentence'],r),[], 'A point and relevant developed support build an effective paragraph.','organization','multi');
  x.correct=x.options.map((v,i)=>['A focused point','A specific example with explanation'].includes(v)?i:null).filter(v=>v!==null);
 }else if(kind===8){
  const s=pick(GEN_SCENARIOS);
  const isTrue=seed%20===8;
  x=q(isTrue?`True or false: A paragraph arguing for ${s[0]} is stronger when it explains how examples support the claim.`:`True or false: A paragraph arguing for ${s[0]} is stronger if it adds unrelated details rather than explaining its evidence.`,['True','False'],isTrue?0:1,isTrue?'Explanation connects evidence to the point instead of simply listing facts.':'Unrelated facts weaken an argument. Explain specific evidence that actually supports the claim.','argument','tf');
 }else{
  const s=pick(GEN_SCENARIOS);
  x=q(`Place the parts of a paragraph about ${s[0]} in a logical order.`,[
    `Point: ${s[0][0].toUpperCase()+s[0].slice(1)} can help the community.`,
    `Evidence: For example, ${s[1]}.`,
    `Explanation: This matters because ${s[2]}.`,
    `Link: Overall, the activity offers a meaningful local benefit.`
  ],[0,1,2,3],'A clear paragraph moves from point to evidence, explanation and link.','organization','order');
  // Option labels are shuffled by the quiz renderer when generating order questions.
 }
 x.id='gen-'+seed; x.generated=true;return x;
}

IONAL BUT RECOMMENDED</span></div><div class="mini-boss"><div><h3>Day ${day} checkpoint: 10 questions</h3><p>Finish with at least 70% to clear this boss. The questions remix the day's topics.</p></div><button class="btn" data-act="startBoss" data-id="${day}">${S.bossDone[day]?'Boss cleared ✓ · Replay':'Fight the boss ⚔'} →</button></div><div class="section-title"><h2>Want more repetitions?</h2></div><div class="btnrow"><button class="btn btn-soft" data-act="drillDay" data-id="${day}">Start 12 extra questions ↗</button><button class="btn btn-outline" data-go="writer">Practise a written response</button></div>`}

function renderWriter(){let tabs=WRITING_TABS.map(([id,t])=>`<button class="tab ${S.writerTab===id?'active':''}" data-act="writerTab" data-id="${id}">${t}</button>`).join('');let body='';if(['short','essay'].includes(S.writerTab)){
 const short=S.writerTab==='short',p=PASSAGE_MAP[S.newsPrompt]||PASSAGES.find(x=>x.kind==='news'),prompt=short?p.prompt:ESSAY_PROMPTS[S.essayPrompt],draft=getDraft(),target=short?100:500,checked=writingAdvice(draft,S.writerTab);
 body=`<div class="writer-layout"><aside class="card writing-guide"><div class="eyebrow">${short?'READ → EXPLAIN':'PLAN → ARGUE'}</div><h2 style="margin:12px 0">${short?'News response':'Opinion essay'}</h2><label class="mini semibold" for="writingPromptPicker">Choose a different prompt</label><select class="selectfield" id="writingPromptPicker" data-input="writerprompt" style="width:100%;margin:8px 0 20px">${(short?PASSAGES.filter(x=>x.kind==='news'):ESSAY_PROMPTS).map((item,i)=>`<option value="${short?item.id:i}" ${(short?item.id===S.newsPrompt:i===S.essayPrompt)?'selected':''}>${esc(short?item.title:item.slice(0,76))}</option>`).join('')}</select><div class="outline-box"><div class="eyebrow" style="margin-bottom:9px">YOUR PROMPT</div><p style="font-size:16px;color:var(--ink);font-weight:850;margin-bottom:0">${esc(prompt)}</p></div><div class="section-title" style="margin-top:20px"><h3>Planning framework</h3></div><ol style="padding-left:20px;color:var(--muted);font-size:12px;line-height:1.8">${(short?['Answer the exact question in one clear sentence.','Select two relevant, accurate details from the report.','Explain how each detail supports your answer.','Check clarity and grammar.']:['Choose agree/disagree and write a clear position.','List 2–3 DIFFERENT reasons.','Find an example for each reason; explain why it matters.','Write a short introduction, developed body and meaningful conclusion.','Revise focus, development, organization and conventions.']).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${short?`<details class="accordion"><summary>Read the news report</summary><div><strong>${esc(p.title)}</strong><p style="white-space:pre-line;margin-top:12px">${esc(p.text)}</p></div></details>`:''}<div class="banner warn" style="margin-top:17px">${short?'Practise around 100 words and use ONLY details actually contained in the report.':'500 words is the task’s published target. Different essays can still be strong at somewhat different lengths.'}</div></aside>
 <article class="card writing-workspace"><div class="writing-top"><div><span class="eyebrow">AUTOSAVED LOCALLY</span><h3 style="margin:6px 0 0">Your draft</h3></div><div class="wordcount" id="wordcount">${countWords(draft)} / ~${target} words</div></div><textarea id="writerText" data-input="writer" spellcheck="true" placeholder="${short?'Start with a direct answer to the question, then use details from the news report...':'Start with your opinion and a clear reason. Develop the argument in paragraphs...'}" aria-label="Your practice written response">${esc(draft)}</textarea><div class="progress" style="margin:8px 0 14px"><i id="writerMeter" style="width:${Math.min(100,pct(countWords(draft),target))}%"></i></div><div class="btnrow"><button class="btn btn-primary" data-act="reviewWriting">🔎 Review my draft</button><button class="btn btn-outline" data-act="downloadWriting">↓ Export .txt</button><button class="btn btn-soft" data-act="copyWriting">Copy text</button><button class="btn btn-outline btn-sm" data-act="clearWriting">Clear draft</button></div><div id="writerFeedback" style="margin-top:20px">${transient.writingAdvice?renderWritingFeedback(draft,S.writerTab):'<div class="banner">Your writing stays on this device. When you finish a draft, click <strong>Review my draft</strong> for structural and word-count checks, then use the self-check rubric below.</div>'}</div><div class="section-title"><h3>Self-assessment checklist</h3><span class="tag">MANUAL CHECK</span></div>${writingChecks(S.writerTab)}</article></div>`;
 }else if(S.writerTab==='models')body=renderWritingModels();else if(S.writerTab==='rubric')body=renderRubric();else body=renderBuilder();
 return `${pageHead('WHERE WRITING BECOMES A SUPERPOWER','Writing Studio','Draft, revise, compare examples and practise under realistic conditions. No fake automatic essay grades—just specific guidance and EQAO-aligned self-assessment.',`<span class="tag">AUTOSAVE ON</span>`)}<div class="tabrow">${tabs}</div>${body}`}
function renderWritingFeedback(t,mode){const notes=writingAdvice(t,mode);return `<div class="writer-coach"><h3 style="margin-bottom:5px">Writing coach: structure check</h3><p class="mini" style="margin-bottom:12px">These automated signals are NOT an essay score. They cannot judge whether your reasoning or evidence is correct.</p>${notes.map(x=>`<div class="coach-row"><span class="symbol" style="color:${x.ok?'#299466':'#be863c'}">${x.ok?'✓':'◇'}</span><span>${esc(x.text)}</span></div>`).join('')}</div>`}
function renderWritingModels(){return `<div class="banner" style="margin-bottom:20px">These are <strong>original illustrative models</strong>, not official EQAO-scored student submissions. Study why the stronger version develops its ideas; do not memorize entire responses.</div>${['short','essay'].map(k=>`<div class="section-title"><h2>${esc(MODELS[k].title)}</h2><span class="tag">COMPARE & LEARN</span></div><div class="card pad" style="margin-bottom:26px"><div class="eyebrow">PROMPT</div><h3 style="margin-top:6px">${esc(MODELS[k].prompt)}</h3><div class="model-columns"><div class="model-box"><strong>◌ Underdeveloped draft</strong>${esc(MODELS[k].weak)}</div><div class="model-box good"><strong>✓ Developed model</strong>${esc(MODELS[k].strong)}</div></div><div class="banner" style="margin-top:16px">Look for these differences: <strong>clear response → concrete evidence → reasoning → logical development → polished communication.</strong></div></div>`).join('')}`}
function renderRubric(){return `<div class="grid2"><div class="card pad"><div class="eyebrow">OPINION ESSAY</div><h2 style="margin:8px 0 14px">What human scoring looks for</h2>${[['Topic development','A clear opinion; thoughtful reasons; specific, relevant details; enough explanation.'],['Organization','A sensible structure, consistent focus, topic sentences and connections between paragraphs.'],['Conventions','Grammar, spelling, capitalization, punctuation and sentence structure that communicate clearly.']].map(([h,t])=>`<div class="rubricitem"><h4>${h}</h4><p>${t}</p></div>`).join('')}<div class="banner warn" style="margin-top:16px">EQAO's official scorers use formal scoring guides. This summary is instructional, not a reproduction of a proprietary scoring algorithm.</div></div><div class="card pad"><div class="eyebrow">NEWS-REPORT OPEN RESPONSE</div><h2 style="margin:8px 0 14px">A good 100-word answer</h2>${[['Responds directly','A clear answer addresses the prompt as written.'],['Uses text evidence','Specific details from the news report are accurate and relevant.'],['Explains the evidence','The writer shows how the details support the answer rather than listing them.'],['Is easy to follow','Logical order, complete sentences and readable conventions.']].map(([h,t])=>`<div class="rubricitem"><h4>${h}</h4><p>${t}</p></div>`).join('')}<button class="btn btn-violet" style="margin-top:19px" data-act="writerTab" data-id="short">Practise a response →</button></div></div><div class="section-title"><h2>Five passes before submitting</h2></div><div class="grid3">${[['1','Task','Did I answer the exact question?'],['2','Reasons','Are my main points distinct?'],['3','Evidence','Does each important point have support?'],['4','Explanation','Did I show why the examples matter?'],['5','Conventions','Did I proofread sentences and punctuation?']].map(([n,h,t])=>`<div class="mini-card"><span class="eyebrow">PASS ${n}</span><h3 style="margin:8px 0">${h}</h3><p class="mini mb0">${t}</p></div>`).join('')}</div>`}
const REPAIRS=[
{bad:'Because the students were late.',good:'Because the students were late, they missed the opening announcement.',why:'“Because” begins a dependent clause; add a complete main clause.'},
{bad:'The team practised, they improved.',good:'The team practised, and they improved.',why:'Use a coordinating conjunction after the comma or separate the sentences.'},
{bad:'Their going to display they’re projects over there.',good:'They’re going to display their projects over there.',why:'They’re = they are; their = possession; there = place.'},
{bad:'Yesterday, she walk to school and finishes her homework.',good:'Yesterday, she walked to school and finished her homework.',why:'Keep two completed past actions in the simple past.'},
{bad:'The program was good and nice and very good.',good:'The program gave students useful opportunities to practise teamwork.',why:'Replace vague repetition with specific details.'},
{bad:'The students went outside however it started raining.',good:'The students went outside; however, it started raining.',why:'Use a semicolon and comma to connect independent clauses with “however.”'},
{bad:'The backpack lost it’s strap.',good:'The backpack lost its strap.',why:'Its is possessive; it’s means it is or it has.'},
{bad:'Each of the students are prepared.',good:'Each of the students is prepared.',why:'“Each” is a singular subject.'},
{bad:'The report, was written by the volunteer.',good:'The volunteer wrote the report.',why:'Avoid a comma between subject and verb; active voice is clearer.'},
{bad:'Walking into the room, the posters impressed Nina.',good:'Walking into the room, Nina noticed the impressive posters.',why:'The opening modifier must refer to the person doing the walking.'}
];
function renderBuilder(){let i=(S.builderIdx||0)%REPAIRS.length,x=REPAIRS[i];return `<div class="grid2"><div class="card pad"><div class="eyebrow">SENTENCE SURGEON · CASE ${i+1} / ${REPAIRS.length}</div><h2 style="margin:9px 0">Repair this sentence</h2><p class="mini">Type a clearer, grammatically correct revision. There are usually several valid ways to fix it.</p><div class="outline-box" style="margin:17px 0"><strong>${esc(x.bad)}</strong></div><textarea id="repairText" class="inputfield" style="min-height:125px;resize:vertical" placeholder="Write your improved sentence..."></textarea><div class="btnrow" style="margin-top:14px"><button class="btn btn-violet" data-act="revealRepair">Reveal a model revision</button><button class="btn btn-soft" data-act="nextRepair">Next case →</button></div>${transient.repairRevealed?`<div class="feedback good"><strong>One clear revision:</strong><p>${esc(x.good)}</p><p style="margin-top:8px"><strong>Why it works:</strong> ${esc(x.why)}</p><small>Compare the meaning and grammar yourself. The tool cannot accurately grade every possible rewrite.</small></div>`:''}</div><div class="card pad"><div class="eyebrow">ORGANIZE A PARAGRAPH</div><h2 style="margin:9px 0">Build the logical order</h2><p class="mini">An effective argument moves from a point to evidence and explanation. Play a four-step ordering puzzle.</p><div class="mini-card" style="margin:20px 0"><strong>POINT</strong> → <strong>EVIDENCE</strong> → <strong>EXPLAIN</strong> → <strong>LINK</strong><p class="mini" style="margin-top:12px;margin-bottom:0">This structure is a guide, not a rigid formula for every essay.</p></div><button class="btn btn-primary" data-act="startOrder">Start ordering challenge →</button></div></div>`}

function buildExam(variant){let types={};for(let kind of ['narrative','information','news','dialogue']){const arr=PASSAGES.filter(p=>p.kind===kind);types[kind]=arr[variant%arr.length]}
 let wr=shuffle(WRITING_BANK.map((x,i)=>({...x,id:'w'+i,kind:'writing'})),seededRandom(variant*4411+298)).slice(0,12);
 const from=p=>p.questions.map((x,i)=>({...x,id:p.id+'q'+i,passageId:p.id,kind:p.kind}));
 let A=[...from(types.narrative),...from(types.information),...from(types.news),...wr.slice(0,6),{id:'short-'+variant,type:'written',kind:'short',skill:'short response',passageId:types.news.id,prompt:types.news.prompt,wordTarget:100}];
 let B=[{id:'essay-'+variant,type:'written',kind:'essay',skill:'thesis',prompt:ESSAY_PROMPTS[(variant*4)%ESSAY_PROMPTS.length],wordTarget:500},...from(types.dialogue),...wr.slice(6,12)];
 return {A,B}
}
function startExam(){let variant=+document.getElementById('examVariant')?.value||0,timed=document.getElementById('examTimed')?.checked!==false;S.exam={variant,items:buildExam(variant),answers:{A:{},B:{}},flags:{A:{},B:{}},phase:'A',i:0,timed,deadline:timed?Date.now()+65*60*1000:0,started:Date.now(),completedAt:null,wasTimedOut:{A:false,B:false}};S.view='exam';transient.examWarn=false;render()}
function getExamQ(){if(!S.exam||!['A','B'].includes(S.exam.phase))return null;return S.exam.items[S.exam.phase][S.exam.i]}
function getExamAnswer(){if(!S.exam)return undefined;return S.exam.answers[S.exam.phase]?.[S.exam.i]}
function examAnswered(q,v){if(q.type==='written')return countWords(v)>0;if(q.type==='multi'||q.type==='order')return Array.isArray(v)&&v.length>0;return v!==undefined&&v!==null&&String(v)!==''}
function answeredCount(phase){let e=S.exam;if(!e)return 0;return e.items[phase].filter((q,i)=>examAnswered(q,e.answers[phase]?.[i])).length}
function examSelect(i){const q=getExamQ();if(!q)return;let e=S.exam,phase=e.phase,old=e.answers[phase][e.i];if(q.type==='multi'){let s=Array.isArray(old)?old.slice():[];e.answers[phase][e.i]=s.includes(i)?s.filter(x=>x!==i):[...s,i]}else e.answers[phase][e.i]=i;save();render(false)}
function examMove(delta){let e=S.exam;if(!e)return;e.i=Math.max(0,Math.min(e.items[e.phase].length-1,e.i+delta));transient.examWarn=false;render()}
function examJump(i){let e=S.exam;if(!e)return;e.i=Math.max(0,Math.min(e.items[e.phase].length-1,i));transient.examWarn=false;render()}
function finishExamSession(expired=false){let e=S.exam;if(!e||!['A','B'].includes(e.phase))return;let phase=e.phase,remaining=e.items[phase].length-answeredCount(phase);if(!expired&&remaining>0&&!transient.examWarn){transient.examWarn=true;render(false);toast(`${remaining} unanswered item${pl(remaining)}. Submit again to continue.`);return}
 if(expired)e.wasTimedOut[phase]=true;transient.examWarn=false;if(phase==='A'){e.phase='intermission';e.i=0;S.view='examphase'}else{e.phase='complete';e.completedAt=Date.now();S.examHistory.unshift(computeExamSummary(e));S.examHistory=S.examHistory.slice(0,12);award(150,'Completed a full mock exam');S.view='examresults'}render()}
function startSessionB(){if(!S.exam||S.exam.phase!=='intermission')return;S.exam.phase='B';S.exam.i=0;S.exam.deadline=S.exam.timed?Date.now()+75*60*1000:0;S.view='exam';render()}
function computeExamSummary(e){let selected=0,hits=0,byType={},wr=[];for(const phase of ['A','B']){e.items[phase].forEach((q,i)=>{const a=e.answers[phase]?.[i];if(q.type==='written'){wr.push({type:q.kind,prompt:q.prompt,words:countWords(a||''),text:a||''});return}selected++;const good=examAnswered(q,a)&&answerCorrect(q,a);if(good)hits++;let k=q.kind||'writing';if(!byType[k])byType[k]={hits:0,total:0};byType[k].total++;if(good)byType[k].hits++})}
 return {variant:e.variant,when:e.completedAt||Date.now(),selected,hits,byType,written:wr,timed:e.timed,timedOut:e.wasTimedOut}
}
function renderSimulator(){let last=S.examHistory[0],current=S.exam&&['A','B','intermission'].includes(S.exam.phase);return `${pageHead('YOUR FULL-LENGTH TRAINING GROUND','OSSLT Exam Simulator','Two sessions, 35 selected-response items and two written tasks. Optional real-time countdowns: Session A ~65 min, Session B ~75 min. No videos, no simulated official EQAO score.',`<span class="kicker">37 SCORED-STYLE TASKS</span>`)}<div class="exam-splash"><div class="eyebrow" style="color:#b8f36a">TWO SESSIONS • FULL FOCUS</div><h2 style="margin-top:9px">Time to show what you know.</h2><p style="max-width:660px">Our mock uses original passages and a representative arrangement: 25 items in A (including the news response) and 12 in B (including the opinion essay). The actual exam may present material differently and may contain unscored field-test items.</p><div class="grid2" style="max-width:580px;margin:24px 0"><div class="mini-card" style="background:#ffffff16;border-color:#ffffff26"><strong style="color:white;font-size:22px">65 min</strong><p style="color:#ddd7ee;font-size:12px;margin-top:7px">Session A · 25 questions · reading, editing & news response</p></div><div class="mini-card" style="background:#ffffff16;border-color:#ffffff26"><strong style="color:white;font-size:22px">75 min</strong><p style="color:#ddd7ee;font-size:12px;margin-top:7px">Session B · 12 questions · opinion essay, dialogue & editing</p></div></div>${current?`<button class="btn btn-lg" data-act="resumeExam">Resume in-progress exam →</button><button class="btn btn-outline btn-lg" style="color:#fff;border-color:#ffffff4d;margin-left:8px" data-act="restartExam">Discard and start new</button>`:`<div class="btnrow"><label style="font-size:12px;color:#ede6ff">Version <select id="examVariant" class="selectfield" style="margin-left:6px"><option value="0">Mock 1</option><option value="1">Mock 2</option><option value="2">Mock 3</option><option value="3">Mock 4</option><option value="4">Mock 5</option></select></label><label class="checkbox-line" style="border-color:#ffffff25;background:#ffffff12;color:#fff;margin:0"><input type="checkbox" id="examTimed" checked> Timed mode</label><button class="btn btn-lg" data-act="startExam">Begin Session A →</button></div>`}</div><div class="section-title"><h2>What gets assessed?</h2></div><div class="grid3">${[['01','23 reading responses','Narrative (7), information (6), news (5) and dialogue (5).'],['02','12 writing selections','Sentence construction, organization, grammar and conventions.'],['03','2 written responses','A ~100-word news response and a ~500-word opinion essay.']].map(([n,t,d])=>`<div class="card pad"><div class="eyebrow">${n}</div><h3 style="margin:10px 0 7px">${t}</h3><p class="mini mb0">${d}</p></div>`).join('')}</div>${last?`<div class="section-title"><h2>Your latest mock</h2><button class="linkbtn" data-go="examresults">Review latest result →</button></div><div class="card pad"><div class="btnrow" style="justify-content:space-between"><div><strong style="font-size:28px">${pct(last.hits,last.selected)}%</strong><p class="mini mb0">Practice selected-response accuracy · ${new Date(last.when).toLocaleDateString('en-CA')}</p></div><button class="btn btn-soft" data-go="examresults">See breakdown →</button></div></div>`:''}<div class="banner warn" style="margin-top:23px"><strong>Important:</strong> Writing responses are not automatically graded. An official OSSLT outcome uses a scaled statistical scoring procedure; a selected-response accuracy percentage here does not predict a pass or a particular scale score.</div>`}
function renderExam(){let e=S.exam;if(!e)return renderSimulator();if(e.phase==='intermission'){S.view='examphase';return renderExamPhase()}if(e.phase==='complete'){S.view='examresults';return renderExamResults()}let phase=e.phase,items=e.items[phase],q=items[e.i],answer=getExamAnswer(),passage=PASSAGE_MAP[q.passageId],remaining=e.timed?Math.max(0,Math.ceil((e.deadline-Date.now())/1000)):0,mm=Math.floor(remaining/60),ss=String(remaining%60).padStart(2,'0'),unanswered=items.length-answeredCount(phase);return `${pageHead('MOCK EXAM · SESSION '+phase,`Session ${phase}: ${phase==='A'?'Reading & writing':'Opinion + literacy'}`,'Your answers save locally as you go. Review flagged questions before submitting; feedback is shown only after both sessions.',`<span class="pillstat">${phase==='A'?'65':'75'} MIN SESSION</span>`)}<div class="exam-shell"><div><div class="quiz-header"><span class="tag">QUESTION ${e.i+1} / ${items.length}</span><span class="mini muted">${esc(q.kind==='essay'?'Opinion essay':q.kind==='short'?'News response':q.kind==='writing'?'Writing selected response':PASSAGE_MAP[q.passageId]?.tag||'Reading')}</span></div><div class="quiz-layout ${passage?'with-passage':''}">${passage?renderPassage(passage):''}<article class="card exam-question"><div class="question-number">${q.type==='written'?'WRITTEN OPEN RESPONSE':`SELECTED RESPONSE · ${esc(label(q.skill))}`}</div><h2 style="font-size:22px;line-height:1.42;margin:13px 0 22px">${esc(q.prompt)}</h2>${q.type==='written'?`<textarea class="exam-writer" data-input="examwrite" spellcheck="true" placeholder="Write your ${q.kind==='essay'?'developed opinion essay':'direct, evidence-based answer'} here...">${esc(answer||'')}</textarea><div class="mini muted" id="examWordcount" style="margin-top:9px">${countWords(answer||'')} words · roughly ${q.wordTarget} expected</div>`:renderQWidget(q,answer,false,'exam')}<div class="exam-navigator"><button class="btn btn-outline" data-act="examPrev" ${e.i===0?'disabled':''}>← Previous</button><button class="btn btn-soft" data-act="examFlag">${e.flags[phase][e.i]?'⚑ Flagged':'⚐ Mark for review'}</button><button class="btn btn-primary" data-act="examNext" ${e.i===items.length-1?'disabled':''}>Next →</button></div></article></div></div><aside class="card exam-sidebar"><div class="eyebrow">SESSION ${phase} TIMER</div><div class="timer ${remaining<300&&e.timed?'near':''}" id="timer-live">${e.timed?`${mm}:${ss}`:'UNTIMED'}</div><p class="mini">${answeredCount(phase)} answered · ${unanswered} left</p>${progressBar(answeredCount(phase),items.length)}<div class="section-title" style="margin-top:20px"><h3>Navigate questions</h3></div><div class="exam-grid">${items.map((item,i)=>`<button class="exam-index ${i===e.i?'current':''} ${examAnswered(item,e.answers[phase][i])&&i!==e.i?'answered':''} ${e.flags[phase][i]?'flagged':''}" data-act="examJump" data-id="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div><p class="tiny muted" style="margin:12px 0 16px">Green = answered; orange underline = marked for review.</p>${transient.examWarn?`<div class="banner warn" style="margin:0 0 12px">${unanswered} question${pl(unanswered)} unanswered. Click submit again to continue anyway.</div>`:''}<button class="btn btn-primary btn-block" data-act="examSubmit">Submit Session ${phase} →</button><button class="linkbtn" data-act="examExit" style="margin-top:13px;width:100%;text-align:center">Save & exit exam</button></aside></div>`}
function renderExamPhase(){if(!S.exam)return renderSimulator();let A=S.exam.items.A,a=answeredCount('A');return `${pageHead('HALFWAY THERE','Session A submitted','You have completed the first of two practice sessions. You can take a break before starting Session B; the next timer begins only when you press Start.')}<div class="card result-hero" style="max-width:700px;margin:auto"><div style="font-size:56px">✧</div><h2>Session A is captured.</h2><p>${a} of ${A.length} questions answered. Official-style scoring is reserved until both sessions are complete.</p><div class="btnrow" style="justify-content:center"><button class="btn btn-lg" data-act="beginB">Begin Session B · 75 min →</button><button class="btn btn-outline" data-go="dashboard">Take a break</button></div></div>`}
function renderExamResults(){let e=S.exam,summary=e?.phase==='complete'?computeExamSummary(e):S.examHistory[0];if(!summary)return `${pageHead('EXAM HISTORY','No completed mock yet','Take a full practice exam to receive your performance breakdown.')}<button class="btn" data-go="simulator">Start a mock</button>`;let p=pct(summary.hits,summary.selected);return `${pageHead('YOUR MOCK REPORT','Your exam breakdown','The reading and grammar items are checked automatically. The two written pieces require self-review or teacher feedback; this is not an official OSSLT score.',`<button class="btn btn-outline" data-go="simulator">← More mock exams</button>`)}<div class="grid2"><div class="card result-hero"><div class="result-circle" style="--deg:${p}%"><div class="inside"><strong>${p}%</strong><small>practice</small></div></div><h2>${p>=90?'Excellent selected-response work!':p>=70?'A useful starting point.':'Target the weaker skills next.'}</h2><p>${summary.hits} of ${summary.selected} selected responses correct. Writing not scored.</p><div class="banner warn" style="text-align:left;margin:17px 0">The scale used by EQAO is not a direct conversion from this percentage. Even perfect selected-response performance here does not replace evaluating the two written responses.</div><div class="btnrow" style="justify-content:center"><button class="btn btn-violet" data-go="mistakes">Review problem areas →</button><button class="btn btn-outline" data-go="writer">Improve writing →</button></div></div><div class="card pad"><h2>Performance by task</h2><div class="results-list">${Object.entries(summary.byType).map(([type,v])=>`<div style="margin:16px 0"><div class="progressbar-label"><span>${esc(type==='narrative'?'Real-life narrative':type==='information'?'Information paragraph':type==='news'?'News report':type==='dialogue'?'Dialogue':'Writing selected-response')}</span><strong>${v.hits}/${v.total} · ${pct(v.hits,v.total)}%</strong></div>${progressBar(v.hits,v.total)}</div>`).join('')}</div><div class="section-title"><h3>Open-response drafts</h3></div>${summary.written.map(w=>`<div class="mini-card" style="margin:10px 0"><strong>${w.type==='essay'?'Opinion essay':'News response'}</strong><p class="mini" style="margin:5px 0">${esc(w.prompt)}</p><span class="tag">${w.words} words · self review needed</span></div>`).join('')}<button class="btn btn-soft" data-act="exportExam">Export report & drafts ↓</button></div></div>${e?.phase==='complete'?`<div class="section-title"><h2>Review each selected response</h2></div><div class="card pad">${['A','B'].map(phase=>`<h3>Session ${phase}</h3>${e.items[phase].map((q,i)=>q.type==='written'?'':`<details class="accordion"><summary><span style="color:${answerCorrect(q,e.answers[phase][i])?'#299466':'#cb5577'}">${answerCorrect(q,e.answers[phase][i])?'✓':'✗'}</span> ${esc(q.prompt.slice(0,110))}</summary><div><strong>Correct answer:</strong> ${esc(correctText(q))}<p>${esc(q.why)}</p></div></details>`).join('')}`).join('')}</div>`:''}`}
