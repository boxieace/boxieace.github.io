olor:#c55e72">You selected:</strong> ${esc(m.chosen||'No answer')}<br><strong style="color:#2c9870">Correct:</strong> ${esc(m.right)}<br><strong>Why:</strong> ${esc(m.why)}</small></div>`).join(''):`<div style="text-align:center;padding:35px 10px"><div style="font-size:45px">◎</div><h3>No mistakes logged yet</h3><p>Start some practice questions and the site will build your personal error map.</p><button class="btn" data-go="drills">Start practice →</button></div>`}</div>`}
function coachingReply(question){let x=question.toLowerCase();
 const bank=[
 [/scholarship|university|grade|credit|percent|90%|pass|300|400/,`The OSSLT is an Ontario graduation literacy requirement, not a scholarship application or a Grade 10 English course mark. EQAO reports a score from 200–400, with 300 needed for “successful.” That 300 is not a raw 75%. Aim for high accuracy in practice, but the two written responses also matter.`],
 [/session|part a|part b|section|minutes|time|format|question/,`There are two test sessions: A is designed for about 65 minutes and B for about 75 minutes. The operational test has 35 selected-response questions and two written tasks. Reading text types: real-life narrative, information paragraph, news report and dialogue. Try the Exam Simulator to practise the complete process.`],
 [/inferen|implicit|clue|guess/,`Inference rule: combine TEXT CLUE + REASONABLE CONCLUSION. Ask: “Which words make this inference more likely than the other answers?” Never invent a person's private thoughts or facts outside the text.`],
 [/explicit|locate|fact|evidence|detail|quote/,`Explicit reading questions are about information the text actually states. Highlight key nouns in the question, find the corresponding sentence and verify qualifiers such as “some,” “only” and “before.” A believable extra fact is still unsupported.`],
 [/main idea|theme|purpose/,`Main idea = what the whole passage explains. Theme = broader insight a narrative suggests about life or people. Purpose = why the author wrote it. Avoid choosing a true detail that covers only one paragraph.`],
 [/news|100.words|short.response|100 word/,`For the news-report written response (~100 words): 1) directly answer the question, 2) give a relevant detail from the article, 3) explain it, 4) add another detail with explanation, 5) check clarity. Do not invent names, dates or numbers.`],
 [/essay|500.words|opinion|paragraph|thesis|argument/,`For an opinion essay (~500 words), take a clear position, give 2–3 distinct reasons and develop each with specific examples and explanation. A reliable approach is intro → 3 body paragraphs → conclusion, but exact paragraph count is not a rigid scoring rule. Use the Writing Studio and self-assessment checklist.`],
 [/grammar|tense|past|present|future|perfect|verb/,`Timeline guide: simple present = habits (“she walks”); simple past = completed actions (“she walked”); future = “will walk”; present perfect = “has walked”; past perfect = “had walked” before another past event. Keep tenses consistent unless the timeline changes.`],
 [/comma|punctuation|apostrophe|semicolon/,`Three high-value punctuation rules: (1) “Although it rained, we played.” — comma after introductory dependent clause. (2) “We trained, and we improved.” — comma + coordinating conjunction between two complete clauses. (3) “its” = possession; “it’s” = it is. Semicolons can link two complete, related sentences.`],
 [/run.on|fragment|sentence/,`A fragment lacks a complete thought, often because it begins “because/although/when” without a main clause. A comma splice joins two complete sentences with only a comma. Fix with a period, semicolon or a comma + “and/but/so.”`],
 [/however|therefore|transition|link/,`Transitions have different meanings. “However” signals contrast. “Therefore” or “as a result” signals a consequence. “For example” introduces evidence. “Furthermore” adds another point. Choose the relationship FIRST, then pick the transition.`],
 [/study|schedule|week|prepare|start/,`Follow the seven-day course in order: Day 1 format and explicit facts; Day 2 inference and narrative; Day 3 information and news; Day 4 dialogue and question formats; Day 5 opinion writing; Day 6 grammar and editing; Day 7 timed sessions and review. Drill your weakest skill for 10–20 additional minutes each day.`]
 ];for(let [rx,a] of bank)if(rx.test(x))return a;return `Here's the most useful general rule: identify whether this is a reading-evidence problem, an organization problem or a grammar problem. For reading, cite the exact supporting phrase. For writing, answer the question directly, support it with a specific example and explain why that example matters. You can also ask me a specific question about inference, 100-word responses, opinion essays, tenses or punctuation. This is a built-in offline coach, not a live AI tutor.`}
function renderCoach(){return `${pageHead('ASK • LEARN • TRY AGAIN','Study Coach','An offline, topic-based mini-coach for common OSSLT questions. It does not send your messages anywhere and is not a generative AI tutor.',`<span class="tag">OFFLINE</span>`)}<div class="coachchat"><div class="card"><div style="padding:16px 21px;border-bottom:1px solid var(--line)"><strong>◉ OSSLT Study Coach</strong><p class="mini mb0">Rule explanations, writing formulas and practice tips</p></div><div class="chat-stream" id="chatStream">${S.coachMessages.map(m=>`<div class="bubble ${m.role==='user'?'mine':''}">${esc(m.text)}</div>`).join('')}</div><div class="chat-input"><input id="coachInput" placeholder="Ask: How do I write an opinion essay?" autocomplete="off" aria-label="Ask the study coach"><button class="btn btn-primary" data-act="coachAsk">Send →</button></div></div><div class="section-title"><h3>Try a question</h3></div><div class="promptchips">${['How do I infer meaning?','What are Sessions A and B?','How do I write a 100-word response?','Give me an essay structure','Teach me past and present tense','What is the passing score?'].map(t=>`<button class="chip" data-act="coachQuick" data-id="${attr(t)}">${esc(t)}</button>`).join('')}</div></div>`}
const CHEATS=[
 ['1. Explicit vs implicit','Explicit asks what is directly stated. Implicit asks what is suggested through clues. For either, return to the source and verify your choice.'],
 ['2. Main idea vs theme','Main idea summarizes the whole selection. Theme is the broader insight often conveyed by a narrative. A small fact is not a central idea.'],
 ['3. Connections','Connect text ideas to a relevant wider situation while remaining consistent with the reading. Do not invent facts about the selection.'],
 ['4. News report 5W + H','Who did what, where, when, why and how? News openings often state the event; later paragraphs add cause, quotations, impact and limitations.'],
 ['5. Dialogue questions','Track each speaker’s proposal, reason, concern and final compromise. Avoid confusing an opening opinion with the final decision.'],
 ['6. Author purpose','Inform = convey facts; explain = show how/why; persuade = influence opinion or action; entertain = engage with a story. Texts may combine purposes.'],
 ['7. 100-word response','Direct claim; detail from source; explain how it supports the claim; second detail; explain and conclude. Do not copy an irrelevant paragraph.'],
 ['8. Opinion essay (~500 words)','Position; 2–3 clear reasons; specific examples; explanation; logical paragraphs; meaningful conclusion. Development and communication outweigh flashy vocabulary.'],
 ['9. Topic sentence','The first sentence of a body paragraph should state the point the paragraph will prove, not a random detail.'],
 ['10. PEEL reasoning','Point → Evidence/Example → Explain → Link. The “Explain” stage makes the example demonstrate your claim.'],
 ['11. Fragments','Because/although/when clauses are dependent: “Although it was late.” is a fragment. Add a main clause: “Although it was late, we continued.”'],
 ['12. Run-ons and comma splices','Two independent clauses require a period, semicolon or coordinating conjunction (often comma + and/but/so). “It rained, we left” is a comma splice.'],
 ['13. Subject–verb agreement','One student is; many students are; each student is; the group is. The head noun controls agreement: “The box of pencils is ...”'],
 ['14. Verb tenses','Present: walks. Past: walked. Future: will walk. Present perfect: has walked. Past perfect: had walked. Present continuous: is walking. Keep the timeline consistent.'],
 ['15. Commas','Use after opening dependent clauses; between list items; before a coordinating conjunction linking two independent clauses; and around nonessential clauses. Do not divide a subject from its verb.'],
 ['16. Semicolons and colons','Semicolon joins closely related complete clauses: “It rained; we stayed inside.” Colon introduces material after a complete clause: “We packed three things: ...”'],
 ['17. Apostrophes','It’s = it is; its = possessive. One student’s project; several students’ projects; children’s projects.'],
 ['18. There / their / they’re','There = location/existence; their = belonging to them; they’re = they are.'],
 ['19. Your / you’re; than / then','Your = possession; you’re = you are. Than = comparison; then = sequence.'],
 ['20. Affect / effect; fewer / less','Affect is usually a verb (influence); effect is usually a noun (result). Fewer refers to countable things; less to uncountable quantities.'],
 ['21. Pronoun clarity','Ensure “she,” “they,” and “it” refer to clear nouns. “When Taylor met Sam, they were excited” may be ambiguous.'],
 ['22. Parallel structure','Items in a list should match grammatically: “reading, swimming and drawing” rather than “reading, swimming and to draw.”'],
 ['23. Transitions','Addition: furthermore. Contrast: however. Cause: therefore. Example: for instance. Time: then/finally. Select the relationship before the word.'],
 ['24. Concision','Avoid “due to the fact that” (use “because”). Replace “good and nice” with a specific benefit and relevant example.'],
 ['25. Fact vs opinion','A factual statement is verifiable (“The centre opened Tuesday”). An opinion expresses a judgment (“It is the best centre”).'],
 ['26. Evidence quality','Specific accurate evidence beats a vague generalization. A convincing-sounding claim is not automatically supported.'],
 ['27. Counterarguments','Represent a competing concern fairly (“Some worry ...”). Answer it respectfully with logic, not insults.'],
 ['28. Reading tools','The real EQAO test platform may include highlighting, line reader, text-to-speech, notes, zoom and contrast. Use the official practice test to become familiar.'],
 ['29. Test strategy','Read the whole question; identify the skill; find evidence; eliminate unsupported options; flag and return to difficult questions.'],
 ['30. Writing revision order','Task → Main idea → Evidence/development → Organization → Sentence clarity → Grammar/punctuation. Do not spend all revision time on commas alone.'],
 ['31. OSSLT score','Official results use a 200–400 scale score and a successful outcome at 300. This is not the same thing as 75% of raw marks.'],
 ['32. Ontario graduation and scholarships','The literacy requirement can be met through successful OSSLT completion or eligible completion of the OSSLC. Passing the OSSLT does not automatically grant a scholarship or boost a course grade. Check scholarship eligibility separately.']
];
function renderResources(){return `${pageHead('MASTER THE RULES','Your OSSLT Toolbox','32 concise rule cards, authentic EQAO references, reading strategies and writing guidance. Save this page as your just-in-time reference.',`<a class="btn btn-primary" href="https://www.eqao.com/the-assessments/osslt/" target="_blank" rel="noopener">Official EQAO site ↗</a>`)}<div class="grid3"><div class="card statcard"><div class="number">2</div><div class="label">Official scored sessions · ~65 + ~75 min</div></div><div class="card statcard"><div class="number">35 + 2</div><div class="label">Selected-response + written responses</div></div><div class="card statcard"><div class="number">300</div><div class="label">Official successful scale score (not %)</div></div></div><div class="section-title"><h2>Trusted EQAO resources</h2></div><div class="grid2">${OFFICIAL_LINKS.map((x,i)=>`<a class="resource" href="${attr(x.url)}" target="_blank" rel="noopener noreferrer"><div class="resourceicon">${['↗','▣','▤','?'][i]}</div><div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p></div><span class="external">↗</span></a>`).join('')}</div><div class="banner" style="margin-top:20px"><strong>2026–2027 scheduling:</strong> EQAO lists a fall window of November 3–30, 2026, and a spring window of March 30–April 19, 2027. Your school selects the specific days within these windows. Always confirm the current schedule on the official site.</div><div class="section-title"><h2>The complete literacy cheat sheet</h2><button class="linkbtn" data-act="printPage">Print this page ↗</button></div><div class="grid2">${CHEATS.map(([k,v])=>`<details class="accordion"><summary>${esc(k)}</summary><div>${esc(v)}</div></details>`).join('')}</div><div class="section-title"><h2>Know what is *not* part of the test</h2></div><div class="card pad"><p style="color:var(--ink)">The OSSLT tests reading and writing skills aligned with Ontario curriculum expectations through Grade 9. It is <strong>not</strong> a test of memorizing Ontario history, science facts, scholarship rules or university admission requirements. It also does not require you to write an old-format fictional news article from scratch: the current operational framework uses a short response connected to a news report plus an opinion essay.</p><p class="mini mb0">Information verified against EQAO’s published framework and 2026–27 OSSLT overview. If the format changes later, consult the official links above.</p></div>`}
function renderSettings(){return `${pageHead('MAKE IT YOURS','Settings & data','Accessibility options, optional sound, and local progress backups. Nothing requires an account.')}<div class="grid2"><div class="card pad"><h2>Appearance & accessibility</h2>${[['dark','Dark theme','Use a dark workspace with bright text.'],['contrast','High contrast','Increase the contrast of borders and backgrounds.'],['big','Larger text','Increase the text size throughout the site.'],['motion','Reduce animation','Disable decorative motion and transitions.'],['sound','Sound effects','Play subtle tones after checking practice answers.']].map(([k,h,d])=>`<label class="checkbox-line" style="justify-content:space-between;align-items:center"><span><strong style="display:block">${h}</strong><span class="mini muted">${d}</span></span><input type="checkbox" data-setting="${k}" ${S.settings[k]?'checked':''}></label>`).join('')}</div><div class="card pad"><h2>Your private study data</h2><p class="mini">Your progress is stored in your browser's localStorage. It can disappear if you clear browser data or use another device. Export a backup if it matters.</p><div class="btnrow"><button class="btn btn-primary" data-act="exportData">↓ Export progress JSON</button><label class="btn btn-outline" style="cursor:pointer">↑ Import backup<input type="file" id="importData" accept=".json,application/json" style="display:none"></label></div><div style="height:1px;background:var(--line);margin:22px 0"></div><h3>Reset learning progress</h3><p class="mini">Deletes local lessons, writing drafts, XP, exam records and mistake history from this browser. This cannot be undone unless you have a backup.</p><button class="btn btn-danger" data-act="resetData">Reset everything</button></div></div>`}

function nav(go,id){transient.menu=false;if(go==='day')S.day=Number(id)||getCurrentDay();if(go==='lesson'){S.lessonId=id||getNextLesson().id;S.lessonStep=0}if(go==='writer'&&!['essay','short','builder','models','rubric'].includes(S.writerTab))S.writerTab='essay';if(go==='examresults'&&S.exam?.phase!=='complete'&&S.examHistory.length===0)go='simulator';S.view=go;transient.hint=false;transient.writingAdvice=null;render()}

function download(name,text,mime='text/plain'){let b=new Blob([text],{type:mime}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000)}
function sendExamReport(){let e=S.exam,summary=e?.phase==='complete'?computeExamSummary(e):S.examHistory[0];if(!summary)return;let content=`U FOR TWO BEATS — OSSLT MOCK REPORT\nSelected-response practice: ${summary.hits}/${summary.selected} (${pct(summary.hits,summary.selected)}%)\nPractice-only; no official EQAO scaled prediction.\n\nBY TYPE\n${Object.entries(summary.byType).map(([k,v])=>`${k}: ${v.hits}/${v.total}`).join('\n')}\n\nWRITTEN RESPONSES (NOT SCORED)\n${summary.written.map(x=>`\n${x.type.toUpperCase()} — ${x.words} words\nPrompt: ${x.prompt}\n${x.text}`).join('\n')}`;download('OSSLT_mock_report.txt',content)}

function handleAction(act,el){let id=el.dataset.id;
 switch(act){
 case 'menu':transient.menu=!transient.menu;render(false);break;
 case 'sound':S.settings.sound=!S.settings.sound;render(false);if(S.settings.sound)beep();break;
 case 'startBoss':{let day=Number(id)||getCurrentDay();startQuiz('boss','day'+day,10,String(day));break}
 case 'drillDay':startQuiz('drill','day'+id,12);break;
 case 'lessonNext':{let l=LESSONS.find(x=>x.id===S.lessonId);S.lessonStep=Math.min(l.steps.length,S.lessonStep+1);render();break}
 case 'lessonPrev':S.lessonStep=Math.max(0,S.lessonStep-1);render();break;
 case 'startLessonQuiz':startLessonQuiz(id);break;
 case 'startDrill':startQuiz('drill',id||'adaptive',12);break;
 case 'drillMistakes':startQuiz('drill','errors',12);break;
 case 'marathon':startQuiz('drill','reading',30);break;
 case 'lightning':startQuiz('lightning','adaptive',20);break;
 case 'hint':transient.hint=!transient.hint;render(false);break;
 case 'quizSelect':{let z=S.quiz;if(!z||z.answers[z.i]!==undefined)return;let n=Number(id),q=z.items[z.i];if(q.type==='multi'){transient.selection=transient.selection.includes(n)?transient.selection.filter(x=>x!==n):[...transient.selection,n]}else transient.selection=[n];render(false);break}
 case 'orderMove':{let i=Number(id),dir=Number(el.dataset.dir),to=i+dir;if(to<0||to>=transient.order.length)return;[transient.order[i],transient.order[to]]=[transient.order[to],transient.order[i]];render(false);break}
 case 'quizCheck':quizAnswer();break;
 case 'quizNext':nextQuiz();break;
 case 'repeatQuiz':{let r=S.quizResult;if(!r)return;if(r.mode==='lesson')startLessonQuiz(r.source);else if(r.mode==='boss')startQuiz('boss','day'+r.source,10,r.source);else startQuiz('drill',r.target||'adaptive',r.total);break}
 case 'exitQuiz':{let z=S.quiz;S.quiz=null;S.view=z?.mode==='lesson'||z?.mode==='boss'?'day':'drills';if(z?.mode==='lesson')S.day=LESSONS.find(x=>x.id===z.source)?.day||1;else if(z?.mode==='boss')S.day=Number(z.source)||1;render();break}
 case 'writerTab':S.writerTab=id;transient.writingAdvice=null;transient.repairRevealed=false;render();break;
 case 'reviewWriting':transient.writingAdvice=true;render(false);document.getElementById('writerFeedback')?.scrollIntoView({behavior:'smooth',block:'nearest'});break;
 case 'downloadWriting':download(`OSSLT_${S.writerTab==='essay'?'opinion_essay':'news_response'}_${getWriterKey()}.txt`,getDraft());toast('Draft exported to a text file.');break;
 case 'copyWriting':{let s=getDraft();if(!s.trim()){toast('Write a draft before copying.');return}if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>toast('Draft copied.')).catch(()=>toast('Clipboard unavailable; select and copy the text directly.'));else toast('Clipboard unavailable; select and copy the text directly.');break}
 case 'clearWriting':{if(!window.confirm('Clear this draft? This cannot be undone unless you have a backup.'))return;S.drafts[S.writerTab][getWriterKey()]='';transient.writingAdvice=null;render();break}
 case 'revealRepair':transient.repairRevealed=true;render(false);break;
 case 'nextRepair':S.builderIdx=((S.builderIdx||0)+1)%REPAIRS.length;transient.repairRevealed=false;render(false);break;
 case 'startOrder':startQuiz('drill','organization',12);break;
 case 'startExam':startExam();break;
 case 'resumeExam':{if(!S.exam)return;let e=S.exam;if(e.paused){e.deadline=e.timed?Date.now()+Math.max(1000,e.pausedRemaining||1000):0;e.paused=false}S.view=e.phase==='intermission'?'examphase':'exam';render();break}
 case 'restartExam':{if(!window.confirm('Discard the unfinished mock and start over? Answers from this attempt will be lost.'))return;S.exam=null;render();break}
 case 'examSelect':examSelect(Number(id));break;
 case 'examPrev':examMove(-1);break;
 case 'examNext':examMove(1);break;
 case 'examJump':examJump(Number(id));break;
 case 'examFlag':{let e=S.exam;if(!e)return;e.flags[e.phase][e.i]=!e.flags[e.phase][e.i];render(false);break}
 case 'examSubmit':finishExamSession();break;
 case 'examExit':{let e=S.exam;if(e?.timed&&e.deadline){e.pausedRemaining=Math.max(0,e.deadline-Date.now());e.deadline=0;e.paused=true}S.view='simulator';render();toast('Mock saved locally. Return to resume your session.');break}
 case 'beginB':startSessionB();break;
 case 'exportExam':sendExamReport();break;
 case 'coachAsk':coachAsk(document.getElementById('coachInput')?.value);break;
 case 'coachQuick':coachAsk(id);break;
 case 'markSelection':{let s=window.getSelection(),range=s?.rangeCount?s.getRangeAt(0):null,root=document.getElementById('passageCopy');if(!range||!s.toString().trim()||!root?.contains(range.commonAncestorContainer)){toast('Select some passage text first.');return}let a=range.startContainer.nodeType===3?range.startContainer.parentElement:range.startContainer,b=range.endContainer.nodeType===3?range.endContainer.parentElement:range.endContainer;if(a.closest('p')!==b.closest('p')){toast('Highlight one paragraph at a time.');return}try{const m=document.createElement('mark');m.appendChild(range.extractContents());range.insertNode(m);s.removeAllRanges()}catch(_){toast('Try selecting a shorter span of text.')}break}
 case 'clearMarks':{let root=document.getElementById('passageCopy');root?.querySelectorAll('mark').forEach(m=>{m.replaceWith(...m.childNodes)});root?.normalize();break}
 case 'speakPassage':{let p=PASSAGE_MAP[id];if(!p||!('speechSynthesis'in window)){toast('This browser does not provide a text-to-speech voice.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(p.title+'. '+p.text.replace(/\n+/g,' '));u.lang='en-CA';u.rate=.95;speechSynthesis.speak(u);toast('Reading aloud. Use Stop to end audio.');break}
 case 'stopSpeaking':if('speechSynthesis'in window)speechSynthesis.cancel();break;
 case 'printPage':window.print();break;
 case 'exportData':download('U4TwoBeats_OSSLT_progress.json',JSON.stringify({app:'U4TwoBeats OSSLT Quest',version:3,exportedAt:new Date().toISOString(),data:S},null,2),'application/json');toast('Progress backup exported.');break;
 case 'resetData':{if(!window.confirm('Permanently erase ALL local course progress, scores, essays and mock records?'))return;S=INITIAL();transient={hint:false,selection:[],order:[],quizDraft:'',menu:false,writingAdvice:null};save();render();toast('Local learning progress reset.');break}
 default:console.warn('Unknown action',act)
 }
}

document.addEventListener('click',e=>{let node=e.target.closest('[data-go],[data-act]');if(!node)return;e.preventDefault();if(node.dataset.go){nav(node.dataset.go,node.dataset.id);return}handleAction(node.dataset.act,node)});
document.addEventListener('input',e=>{
 const t=e.target,kind=t.dataset.input;
 if(kind==='writer'){
  S.drafts[S.writerTab]??={};S.drafts[S.writerTab][getWriterKey()]=t.value;let target=S.writerTab==='short'?100:500,n=countWords(t.value),meter=document.getElementById('writerMeter'),wc=document.getElementById('wordcount');if(wc)wc.textContent=n+' / ~'+target+' words';if(meter)meter.style.width=Math.min(100,pct(n,target))+'%';if(transient.writingAdvice){const f=document.getElementById('writerFeedback');if(f)f.innerHTML=renderWritingFeedback(t.value,S.writerTab)}save();return
 }
 if(kind==='writerprompt'){if(S.writerTab==='short')S.newsPrompt=t.value;else S.essayPrompt=+t.value;transient.writingAdvice=null;render(false);return}
 if(kind==='quizblank'){transient.quizDraft=t.value;return}
 if(kind==='quizselect'){transient.selection=t.value!==''?[Number(t.value)]:[];return}
 if(kind==='examwrite'||kind==='examblank'||kind==='examselect'){
  let x=S.exam;if(!x||!['A','B'].includes(x.phase))return;x.answers[x.phase][x.i]=kind==='examselect'?t.value===''?undefined:Number(t.value):t.value;let wc=document.getElementById('examWordcount');if(wc)wc.textContent=countWords(t.value)+' words · roughly '+getExamQ().wordTarget+' expected';save();return
 }
});
document.addEventListener('change',e=>{
 const t=e.target;if(t.dataset.check!==undefined){let key=S.writerTab+':'+getWriterKey();S.reviewChecks[key]??={};S.reviewChecks[key][t.dataset.check]=t.checked;save();return}
 if(t.dataset.setting){S.settings[t.dataset.setting]=t.checked;render(false);return}
 if(t.id==='importData'&&t.files?.[0]){let f=t.files[0];if(f.size>5*1024*1024){toast('Backup file is too large.');return}f.text().then(raw=>{const parsed=JSON.parse(raw),data=parsed.data;if(parsed.app!=='U4TwoBeats OSSLT Quest'||!data||typeof data!=='object'||typeof data.lessonDone!=='object')throw Error('Not a valid U For Two Beats backup');if(!window.confirm('Import this backup and replace your current local progress?'))return;S={...INITIAL(),...data,settings:{...INITIAL().settings,...data.settings}};save();render();toast('Backup restored.')}).catch(e=>toast('Could not import backup: '+e.message))}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){if(e.target.id==='coachInput'){e.preventDefault();coachAsk(e.target.value)}else if(e.target.id==='blankAnswer'&&S.view==='quiz'){e.preventDefault();quizAnswer()}}if(e.key==='Escape'&&transient.menu){transient.menu=false;render(false)}});
function clockTick(){
 if(S.view==='quiz'&&S.quiz?.mode==='lightning'){
  const seconds=Math.max(0,Math.ceil((S.quiz.deadline-Date.now())/1000)),el=document.getElementById('timer-live');if(el)el.textContent=seconds+'s';if(seconds===0&&S.quiz){finishQuiz();toast('Time! Lightning round complete.')}return
 }
 const e=S.exam;if(!e||!['A','B'].includes(e.phase)||!e.timed||e.paused||!e.deadline)return;
 const sec=Math.max(0,Math.ceil((e.deadline-Date.now())/1000)),el=document.getElementById('timer-live');if(el)el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(el)el.classList.toggle('near',sec<300);if(sec===0){finishExamSession(true);toast('The session timer ended. Your answers were saved.')}}
setInterval(clockTick,1000);
if(S.view==='lesson'){const l=LESSONS.find(x=>x.id===S.lessonId)||LESSONS[0];S.lessonStep=Math.min(S.lessonStep,l.steps.length)}
if(S.view==='quiz'&&!S.quiz)S.view='dashboard';
if(S.view==='quiz'&&S.quiz)initQuestion();
if(S.view==='exam'&&!S.exam)S.view='simulator';
render(false);

</script>
</body>
</html>
