q('l11','5.1','Compared with y = x², what does y = 3x² do?',['Widens; opens up','Narrows; opens up','Narrows; opens down','Shifts right 3'],1,'Because |a| = 3 > 1, all y-values triple. The graph stretches vertically and becomes narrower. Since a > 0, it opens upward.','Stretching vertically makes the parabola look NARROWER, not wider.','Magnitude of a',1);

q('l115','5.1','A transformed graph contains (1, −5) and has vertex (0,0). Which equation is correct?',['y = −5x²','y = 5x²','y = −x² − 5','y = (x − 5)²'],0,'With vertex at origin, use y = ax². Substitute −5 = a(1)², hence a = −5.','Do not turn the y-coordinate into a vertical shift.','Find a',2);
q('l116','5.1','What is the table of y-values for x = −2, −1, 0, 1, 2 under y = −x²?',['4, 1, 0, 1, 4','−4, −1, 0, −1, −4','−2, −1, 0, 1, 2','−4, 1, 0, 1, −4'],1,'Square each x, then apply the outside minus: −4, −1, 0, −1, −4.','Reflection is after squaring, not inside the exponent.','Parent table',2);
q('l117','5.1','Two graphs are y = 4x² and y = ¼x². Which is narrower?',['¼x²','They are the same','4x²','Cannot tell from equations'],2,'4 has a greater absolute value than ¼, giving a larger vertical stretch and a narrower graph.','Larger |a| makes a graph narrower.','Graph width',1);
q('l118','5.1','Which value of a produces the SAME width as y = 2x², but opens downward?',['a = −2','a = −½','a = ½','a = 2'],0,'To preserve width, keep |a| = 2. To flip, change its sign to −2.','Same width means same absolute value, not same sign.','Sign + magnitude',2);
// ——— Lesson 5.2: h and k translations, vertex, AOS, optimal ———
q('l21','5.2','What happens to y = x² in y = x² + 6?',['Right 6','Left 6','Up 6','Down 6'],2,'Adding +6 OUTSIDE the square increases every y-value by 6, so move up six units.','Outside controls vertical shift, not horizontal shift.','k shift',1);
q('l22','5.2','Which equation shifts y = x² down 4 units?',['y = x² + 4','y = (x − 4)²','y = (x + 4)²','y = x² − 4'],3,'Subtracting 4 after the square gives k = −4, so the vertex becomes (0, −4).','Inside the brackets would be a horizontal move.','k shift',1);
q('l23','5.2','What is the vertex of y = (x − 3)² + 5?',['(−3, 5)','(3, 5)','(3, −5)','(−3, −5)'],1,'Compare to (x − h)² + k. Here h = 3 and k = 5, so vertex is (3,5).','For h, use the sign OPPOSITE what appears inside the bracket.','h sign',1);
q('l24','5.2','What is the axis of symmetry of y = (x + 7)²?',['x = 7','y = −7','x = −7','y = 7'],2,'x + 7 means h = −7, and the vertical axis is the LINE x = h = −7.','Axis of symmetry is x = ..., not the coordinate pair or a y = line.','Axis',2);
q('l25','5.2','y = x² − 3 has what minimum value?',['0','−3','3','No minimum'],1,'The parabola opens up (a = 1), so its vertex y-coordinate k = −3 is the minimum value.','The minimum is the k value, not the h value.','Optimal value',2);
q('l26','5.2','y = (x + 4)² moves the parent graph which way?',['Left 4','Right 4','Up 4','Down 4'],0,'x + 4 = x − (−4), so h = −4: left four units.','Inside the bracket looks backwards: plus means LEFT.','h sign',1);
q('l27','5.2','What is h in y = (x − 9)² + 2?',['−9','9','2','−2'],1,'In x − h, the actual h is +9.','h is the x-coordinate of the vertex, not the visible sign alone.','h sign',1);
q('l28','5.2','Which gives a translation LEFT 2 and DOWN 1?',['y = (x − 2)² − 1','y = (x + 2)² + 1','y = (x + 2)² − 1','y = (x − 2)² + 1'],2,'Left two gives (x + 2)². Down one means −1 outside.','Write h = −2, k = −1 first, then substitute (x−h)²+k.','Translation',2);
q('l29','5.2','Which point is the translated image of (1,1) after right 3, down 4?',['(−2,5)','(4,−3)','(4,5)','(−2,−3)'],1,'New point: x = 1 + 3 = 4, y = 1 − 4 = −3.','Apply horizontal and vertical shifts to different coordinates.','Point translation',2);
q('l210','5.2','What is the vertex of y = (x + 2)² − 1, exactly as in your worksheet?',['(2,−1)','(−2,1)','(−2,−1)','(2,1)'],2,'h = −2 and k = −1, so vertex (−2,−1). Axis of symmetry: x = −2.','Don’t lose the negative sign on h.','Worksheet example',1);
q('l211','5.2','Which graph matches y = (x + 2)² − 1?',['Graph A','Graph B','Graph C','Graph D'],0,'The vertex must be (−2,−1), the parabola opens upward, and a = 1 means normal width.','Read vertex first, then width/direction.','Graph match',3,{type:'choices',plots:[{a:1,h:-2,k:-1},{a:1,h:2,k:-1},{a:-1,h:-2,k:-1},{a:1,h:-2,k:1}]});
q('l212','5.2','The vertex is (−5, 3), with normal width and opening up. Equation?',['y = (x − 5)² + 3','y = (x + 5)² + 3','y = (x + 3)² − 5','y = −(x + 5)² + 3'],1,'Plug h = −5, k = 3, a = 1 into y = a(x − h)² + k, giving (x + 5)² + 3.','In a vertex pair, h is x and k is y.','Write equation',2);
q('l213','5.2','For y = −(x − 4)² + 8, what is the maximum value?',['4','−4','8','−8'],2,'a is negative, so the graph opens downward and the vertex y-coordinate k = 8 is its maximum.','The maximum is a y-value; axis is x = 4.','Optimal value',2);
q('l214','5.2','The point (0,0) on y = x² is shifted by h = 3 and k = −2. New vertex?',['(−3,2)','(3,−2)','(3,2)','(−3,−2)'],1,'The vertex maps from (0,0) to (h,k) = (3,−2).','The vertex movement itself follows h directly; the bracket sign reverses only in the written equation.','Vertex',2);
q('l215','5.2','Which of the following is a purely VERTICAL translation?',['y = (x + 5)²','y = (x − 3)²','y = x² − 5','y = −5x²'],2,'Only a +k or −k OUTSIDE the square moves the graph vertically without changing width or x-position.','−5 multiplying x² is a stretch/reflection, not a translation.','k shift',2);
q('l216','5.2','For y = (x − 2)² + 4, which points share the same y-value?',['x = 0 and 4','x = 1 and 4','x = −1 and 1','x = 0 and 2'],0,'Axis is x = 2. Values equally far from 2, such as 0 and 4, have equal y-values.','Parabolas are symmetric about x = h, not automatically about the y-axis.','Symmetry',3);
q('l217','5.2','What is the horizontal shift from y = x² to y = (x − (−6))²?',['Right 6','Left 6','Down 6','None'],1,'x − (−6) = x + 6, so h = −6 and the graph shifts left 6.','Double negatives are a common multiple-choice trap.','h sign',3);
q('l218','5.2','The graph y = (x + 3)² + 1 has axis of symmetry and minimum value:',['x = 3, min 1','x = −3, min −1','x = −3, min 1','x = 1, min −3'],2,'Vertex (−3,1). With a = 1 > 0, minimum is k = 1; axis is x = h = −3.','Distinguish x = h from y = k.','Features',3);
// ——— Lesson 5.3: a/h/k and the mapping rule ———
q('l31','5.3','Identify a, h, k for y = −2(x − 3)² + 1.',['a=2, h=−3, k=1','a=−2, h=3, k=1','a=−2, h=−3, k=1','a=−2, h=3, k=−1'],1,'a = −2, h = +3, k = +1. Negative a: reflect and stretch by 2; right 3; up 1.','Inside x−3 gives h=+3; keep the leading negative with a.','Parameters',1);
q('l32','5.3','Which is the GENERAL mapping rule for y = a(x − h)² + k?',['(x,y) → (ax+h, y+k)','(x,y) → (x−h, ay−k)','(x,y) → (x+h, ay+k)','(x,y) → (x+h, y/a+k)'],2,'Only x gets +h; the OLD y gets multiplied by a, THEN shifted +k.','a changes the y-coordinate for this quadratic form, not the x-coordinate.','Mapping rule',1);
q('l33','5.3','Under y = −2(x − 3)² + 1, where does parent point (1,1) map?',['(4,−1)','(−2,−1)','(4,3)','(1,−1)'],0,'x′ = 1 + 3 = 4; y′ = −2(1) + 1 = −1, so (4, −1).','Do not square y again; y is already the parent point’s output.','Map a point',2);
q('l34','5.3','What is the image of parent vertex (0,0) under (x,y) → (x+4, −3y−2)?',['(−4,−2)','(4,−2)','(4,2)','(−4,2)'],1,'Substitute (0,0): (0+4, −3×0−2) = (4,−2).','The map directly outputs the transformed vertex.','Map vertex',2);
q('l35','5.3','For a = −3, what TWO vertical changes happen?',['Compression by 3 and translation down 3','Stretch by 3 and reflection in x-axis','Reflection in y-axis and stretch','Translation left 3 and flip'],1,'Magnitude |−3| = 3 stretches vertically; the negative sign reflects across the x-axis.','The reflection here is across the X-axis, so y-values change sign.','a transformations',2);
q('l36','5.3','Your worksheet example y = −3(x + 2)² − 4 has what mapping rule?',['(x,y) → (x+2, −3y−4)','(x,y) → (x−2, −3y−4)','(x,y) → (x−2, 3y−4)','(x,y) → (x−2, −3y+4)'],1,'h = −2, a = −3, k = −4. Hence (x−2,−3y−4).','If the equation says x+2, map x−2.','Worksheet map',2);
q('l37','5.3','For y = −3(x + 2)² − 4, where does (−2,4) on the parent graph go?',['(−4,−16)','(0,−16)','(−4,8)','(−2,−16)'],0,'x′ = −2 − 2 = −4. y′ = −3(4) − 4 = −16.','Multiply parent y first, THEN add k; do not square y.','Map a point',3);
q('l38','5.3','What is the mapping rule for y = 2.5(x − 4)² + 2?',['(x+4,2.5y+2)','(x−4,2.5y+2)','(x+4,y+2.5)','(x+4,−2.5y+2)'],0,'h = 4, a = 2.5, k = 2. So x′ = x + 4; y′ = 2.5y + 2.','Your 5.3 page 4 uses these exact parameters.','Worksheet map',2);
q('l39','5.3','Under y = 2.5(x − 4)² + 2, where does parent point (1,1) map?',['(−3,4.5)','(5,3.5)','(5,4.5)','(4,2.5)'],2,'x′ = 1+4=5; y′ = 2.5(1)+2=4.5.','h changes x, a and k change y.','Map a point',2);
q('l310','5.3','Which is the vertex and axis of y = −3(x + 2)² − 4?',['(2,−4), x=2','(−2,−4), x=−2','(−2,4), x=−2','(−3,−4), x=−3'],1,'h = −2 and k = −4, so vertex (−2,−4). The axis is x = −2.','a does not determine the x-position of the vertex.','Vertex',2);
q('l311','5.3','Which graph matches y = −2(x − 3)² + 1?',['Graph A','Graph B','Graph C','Graph D'],3,'Vertex (3,1), opens DOWN with narrow width because a = −2.','Check the vertex, opening, and width separately.','Graph match',3,{type:'choices',plots:[{a:-.5,h:3,k:1},{a:-2,h:-3,k:1},{a:2,h:3,k:1},{a:-2,h:3,k:1}]});
q('l312','5.3','Map (2,4) using (x,y) → (x−1, −½y+3).',['(1,1)','(3,1)','(1,5)','(1,−5)'],0,'x′=2−1=1. y′=−½(4)+3=−2+3=1.','Do not add 3 before multiplying by −½.','Map a point',3);
q('l313','5.3','Which is the correctly transformed table for parent x = −1, 0, 1 under (x,y) → (x+2, 2y−1)?',['(1,1),(2,−1),(3,1)','(−3,1),(−2,−1),(−1,1)','(1,−3),(2,−1),(3,−3)','(1,2),(2,−1),(3,2)'],0,'Parent y values: 1,0,1. New x: 1,2,3. New y: 2(1)−1=1, 2(0)−1=−1, 1.','First create the parent y = x² table; then apply the mapping rule.','Mapping table',3);
q('l314','5.3','What is the IMAGE of parent point (−1,1) under y = −½(x + 3)² + 2?',['(2,1.5)','(−4,1.5)','(−4,2.5)','(2,−1.5)'],1,'h=−3: x′=−1−3=−4. y′=−½(1)+2=1.5.','A compression factor of ½ combines with reflection because a is negative.','Map a point',3);
q('l315','5.3','For y = 2(x − 3)² − 4, which row describes ALL transformations?',['Right 3, down 4, stretch 2','Left 3, down 4, stretch 2','Right 3, up 4, stretch 2','Right 3, down 4, compression 2'],0,'a=2 -> stretch; h=3 -> right 3; k=−4 -> down 4. No reflection.','Do not label |a| = 2 as compression.','All parameters',2);
q('l316','5.3','A parent point (0,0) maps to (−2,5). Which pair (h,k) must the quadratic have?',['h=2,k=−5','h=−2,k=5','h=−2,k=−5','h=5,k=−2'],1,'Mapping of vertex: (0,0) → (h,k). Therefore h=−2 and k=+5.','The image of the origin is the vertex.','Reverse mapping',2);
q('l317','5.3','How does y = −½(x−4)² + 2 differ from y = (x−4)²+2?',['It moves left','It reflects and becomes wider','It shifts down','It reflects and becomes narrower'],1,'Only a changes: a=−½ reflects across x-axis and compresses vertically; the graph looks wider. Vertex is unchanged.','Compare equations one parameter at a time.','Compare graphs',3);
q('l318','5.3','For y = −2(x+1)²+3, which of these is on the graph?',['(−1,3)','(1,3)','(−1,−3)','(0,5)'],0,'The vertex occurs when x+1=0, so x=−1 and y=3.','The squared term is zero at the vertex.','Read vertex',2);
// ——— Lesson 5.4: use vertex and another point to solve for a; exact bakery and bridge ———
q('l41','5.4','A quadratic has vertex (4, −12). Which describes ALL possible parabolas with that vertex?',['y = a(x + 4)² − 12','y = a(x − 4)² − 12, a ≠ 0','y = a(x − 12)² + 4','y = 4x² − 12'],1,'In vertex form y = a(x − h)²+k, use h=4,k=−12. Any NONZERO a gives that vertex.','The vertex does not determine a by itself.','Vertex model',2);
q('l42','5.4','The vertex is (2, −6) and the parabola passes through (0, −4). Which equation should you substitute into?',['−4 = a(0−2)²−6','0 = a(−4−2)²−6','−6 = a(2−0)²−4','−4 = a(2−0)²+6'],0,'Start y = a(x−2)²−6. Substitute the OTHER point x=0,y=−4: −4 = a(0−2)²−6.','Do not swap x and y. Do not plug the vertex into the a-solving step.','Substitution setup',3);
q('l43','5.4','Solve for a: 15 = a(13−4)² − 12.',['a = 3','a = ⅓','a = 27','a = 9'],1,'Add 12: 27 = a×81. Divide by 81: a = 27/81 = 1/3.','Square 13−4 = 9 BEFORE dividing.','Solve a',2);
q('l44','5.4','Your worksheet vertex (4,−12) and point (13,15) produce:',['y = ⅓(x−4)²−12','y = 3(x−4)²−12','y = ⅓(x+4)²−12','y = ⅓(x−4)²+12'],0,'h=4,k=−12. 15 = 81a−12, so 27=81a and a=1/3.','The exact answer uses 1/3, not 3.','Worksheet model',2);
q('l45','5.4','The parabola y = ⅓(x−4)²−12 has which vertical transformation?',['Stretch by 3','Reflection in x-axis','Compression by ⅓','Up 12'],2,'a=1/3 is positive and between 0 and 1, so it compresses vertically and looks wider.','A positive fraction less than 1 is compression.','Transformation',2);
q('l46','5.4','Bakery graph: vertex (1.75,400), another point (0.75,300). Find a.',['−100','100','−200','−1'],0,'300 = a(0.75−1.75)²+400 → 300 = a(−1)²+400 → a = −100.','(−1)² = +1, so a must be negative because 300 < 400.','Bakery',2);
q('l47','5.4','Which is your exact bakery profit model?',['P(x)=100(x−1.75)²+400','P(x)=−100(x+1.75)²+400','P(x)=−100(x−1.75)²+400','P(x)=−100(x−1.75)²−400'],2,'Use vertex (1.75,400) and a=−100: P(x)=−100(x−1.75)²+400.','Profit has a maximum at 400, so a < 0.','Bakery',2);
q('l48','5.4','In the bakery model, what does vertex (1.75,400) mean?',['Minimum price is $400','Maximum profit $400 at $1.75 per loaf','Maximum price $400','Profit is $1.75 at 400 loaves'],1,'Graph x-axis is price per loaf ($), y-axis is profit ($). The maximum is $400 when a loaf costs $1.75.','Interpret AXES and units; do not swap x/y meanings.','Interpret model',2);
q('l49','5.4','A suspension bridge spans 1516 m. Axis of symmetry at x=0. What are the two tower x-coordinates?',['−1516 and +1516','0 and 1516','−758 and +758','−379 and +379'],2,'The total span is 1516. Half-span = 1516/2 = 758. Towers lie at x = ±758 m.','When the origin is in the centre, divide the TOTAL span by 2.','Bridge',2);
q('l410','5.4','For the bridge, the minimum cable height is 2 m at the centre. What is the vertex?',['(2,0)','(0,50)','(758,2)','(0,2)'],3,'Origin is horizontally at the centre; y is height above road. The lowest cable is at (0,2).','The 50 m is tower height, not the minimum cable height.','Bridge',2);
q('l411','5.4','Using tower point (758,50) and vertex (0,2), which equation finds a?',['50 = a(758)²+2','2 = a(758)²+50','50 = a(1516)²+2','758 = a(50)²+2'],0,'Start y = ax²+2. Plug in the tower coordinates x=758, y=50: 50 = 758²a+2.','Use half-span for x, full tower height for y.','Bridge solve',3);
q('l412','5.4','Which is the accurate bridge quadratic model?',['y = 48x² + 2','y = (48/574564)x² + 2','y = (2/758)x² + 50','y = −(48/574564)x² + 2'],1,'a=(50−2)/758² = 48/574564 ≈0.0000835. The cable curves upward away from its lowest point.','Check the SIGN of a: minimum at centre means opens upward.','Bridge solve',3);
q('l413','5.4','A parabola has vertex (−1,5) and passes through (1,−3). Find a.',['−2','2','−8','−½'],0,'−3 = a(1+1)²+5 → −8 = 4a → a=−2.','x−(−1) is x+1.','Solve a',2);
q('l414','5.4','Find a when vertex = (3,2) and point = (5,10).',['1','2','4','8'],1,'10 = a(5−3)²+2 → 8=4a → a=2.','Distance from vertex is 2, and squared distance is 4.','Solve a',2);
q('l415','5.4','Which graph fits vertex (0,2) and point (2,3)?',['Graph A','Graph B','Graph C','Graph D'],1,'3 = a(2)²+2 → a=1/4. So use a wide upward parabola with vertex (0,2).','Compare the given second point to a candidate graph.','Graph match',3,{type:'choices',plots:[{a:1,h:0,k:2},{a:.25,h:0,k:2},{a:-.25,h:0,k:2},{a:.25,h:2,k:0}]});
q('l416','5.4','Why can’t we determine a from the vertex alone?',['a is always 1','The vertex gives h and k but not width or opening','a equals k','The vertex gives only the x-intercept'],1,'Every nonzero a in y = a(x−h)²+k shares the same vertex (h,k). One other non-vertex point is needed to solve a.','Avoid assuming normal width just because h,k are known.','Concept',2);
q('l417','5.4','A quadratic has vertex (−3,4) and passes through (−1,0). Equation?',['y = (x+3)²+4','y = −(x+3)²+4','y = −(x−3)²+4','y = −4(x+3)²+4'],1,'0 = a(−1+3)²+4 → 0=4a+4 → a=−1. So y=−(x+3)²+4.','The second point must produce zero when substituted.','Solve a',3);
q('l418','5.4','What is the mapping rule for y = ⅓(x−4)²−12?',['(x−4,⅓y−12)','(x+4,3y−12)','(x+4,⅓y−12)','(x+4,⅓y+12)'],2,'Use (x,y)→(x+h,ay+k) with h=4,a=1/3,k=−12.','This repeats the skills from lesson 5.3, as your worksheet asks.','Mapping recap',2);
// ——— Lesson 5.5: factored / vertex / standard applications and all three real worksheets ———
q('l51','5.5','Which form directly shows the x-intercepts (zeros)?',['Vertex y=a(x−h)²+k','Standard y=ax²+bx+c','Factored y=a(x−r)(x−s)','All three directly show zeros'],2,'Factored form gives zeros r and s because each bracket can equal 0.','The standard-form c value is the y-intercept, not a zero.','Choose form',1);
q('l52','5.5','For y = −2(x−1)(x−7), what are the zeros?',['−1 and −7','1 and 7','−1 and 7','2 and 8'],1,'Set each factor to zero: x−1=0 → x=1; x−7=0 → x=7.','Read the OPPOSITE sign in each factor.','Factored zeros',1);
q('l53','5.5','The zeros are x = −4 and x = 6. What is the x-coordinate of the vertex?',['x = 2','x = −2','x = 1','x = 5'],2,'The axis is halfway between the zeros: (−4+6)/2 = 1.','Average the ROOTS, not their absolute values.','Vertex from zeros',2);
q('l54','5.5','What is the y-intercept of y = 3x² − 8x + 5?',['−8','3','5','0'],2,'In standard form y=ax²+bx+c, the y-intercept is c, so point (0,5).','b does not give the y-intercept.','Choose form',1);
q('l55','5.5','Which statement is true for R(x)=−½(x−52)(x+20)?',['Its zeros are −52 and 20','Its vertex x-value is 16','It opens up','Its y-intercept is −20'],1,'Zeros x=52 and x=−20. Average: (52−20)/2=16. Leading a=−1/2 means opens down.','The signs in brackets are reversed to find zeros.','Revenue',2);
q('l56','5.5','Coffee starts at $2.60 and 200 mugs. Every $0.05 price decrease sells 10 more. If x is NUMBER of $0.05 decreases, price is:',['2.60−0.05x','2.60−10x','2.60+0.05x','200+10x'],0,'Each decrease is $0.05, so reduce price by $0.05x.','Do not mix quantity change (10) with dollar price change (0.05).','Revenue model',2);
q('l57','5.5','Same coffee problem: quantity sold after x decreases is:',['200−10x','2.60−0.05x','200+10x','200+x/10'],2,'Each decrease adds 10 customers/mugs, so quantity = 200+10x.','Revenue is price × quantity, and these are different expressions.','Revenue model',1);
q('l58','5.5','Which revenue function matches the coffee worksheet?',['R=(2.60+0.05x)(200+10x)','R=(2.60−0.05x)(200+10x)','R=(2.60−0.05x)(200−10x)','R=(2.60−10x)(200+0.05x)'],1,'Revenue = (price)(quantity) = (2.60−0.05x)(200+10x).','If price falls, quantity rises — their signs differ.','Revenue model',2);
q('l59','5.5','Expand R=(2.60−0.05x)(200+10x) into STANDARD form.',['−0.5x²+16x+520','−0.5x²+26x+520','0.5x²+16x+520','−0.05x²+16x+520'],0,'Products: 2.60×200=520; 2.60×10x=26x; −0.05x×200=−10x; −0.05x×10x=−0.5x². Combine: 16x.','Do not forget the −10x term, or the extra 10 in the x² product.','Expansion',3);
q('l510','5.5','What is the maximum coffee revenue?',['$520 at x=0','$648 at x=16','$648 at x=52','$1.80 at x=16'],1,'Zeros −20,52 → vertex x=16. Price = 2.60−0.05(16)=$1.80; mugs=200+10(16)=360; revenue = $1.80×360=$648.','The question asks for REVENUE, not price or number of mugs.','Revenue maximize',3);
q('l511','5.5','For the smoke jumper, why is a = −4.9?',['Because −0.5 × 9.8 = −4.9','Because −0.5 × 9.8 = −4.4','Because 9.8² = −4.9','Because the initial height is −4.9'],0,'The worksheet gives a=−0.5g, with g=9.8. Multiply: −0.5(9.8)=−4.9.','A common handwriting error was −4.4; check this multiplication.','Free fall',1);
q('l512','5.5','What height model matches the jumper starting at 554 m, with vertex at t = 0?',['H=4.9t²+554','H=−4.9(t−554)²','H=−4.9t²+554','H=−9.8t+554'],2,'Use H=a(t−0)²+554 with a=−4.9, giving H=−4.9t²+554.','554 is starting HEIGHT k, not time h.','Free fall',2);
q('l513','5.5','The parachute opens at a height of 300 m. Which equation should you solve?',['0=−4.9t²+554','300=−4.9t²+554','554=−4.9t²+300','300=−4.9t+554'],1,'Set the HEIGHT equal to 300, because that is when the parachute opens.','Solving H=0 answers a different question: hitting the ground without a chute.','Interpret word problem',3);
q('l514','5.5','Solve 300 = −4.9t² + 554. Approximate the POSITIVE solution.',['5.18 s','7.20 s','51.84 s','−7.20 s'],1,'−254=−4.9t² → t²=254/4.9≈51.84 → t≈√51.84≈7.20 s.','Do not forget the square root or keep a negative time.','Free fall',3);
q('l515','5.5','A height equation gives t = ±7.2 s. In this jumper context, which time is meaningful?',['Both','Only −7.2 s','Only +7.2 s','Neither'],2,'t means seconds AFTER exiting the airplane. Negative time is outside the physical domain.','Always apply context after solving quadratic equations.','Physical domain',2);
q('l516','5.5','Underpass: centre of arch is (0,0); it reaches (15,−10.8). Which model is correct?',['y=−0.048x²','y=−0.72x²','y=0.048x²','y=−10.8x²'],0,'Use y=ax²: −10.8=a(15)²=225a → a=−10.8/225=−0.048.','Use half of the 30 m total width: x=15, not x=30.','Underpass model',3);
q('l517','5.5','A 5 m wide truck drives CENTRED through the arch. Where must you check the arch height?',['x=0 only','x=5 and x=−5','x=±2.5','x=±15'],2,'Half the truck width is 5/2=2.5 m, so its two top corners are at x=−2.5 and +2.5.','Checking only the centre can incorrectly say an over-wide truck fits.','Underpass',3);
q('l518','5.5','For y=−0.048x², what is y at x=2.5 m?',['−0.30','−0.12','+0.30','−3.00'],0,'2.5²=6.25; −0.048×6.25=−0.30 m relative to arch top.','This is not yet the clearance above the road; the road is at −10.8.','Underpass',3);
q('l519','5.5','The underpass road is y=−10.8, and arch is y=−0.30 at the truck edge. What is the arch height ABOVE ROAD?',['0.30 m','10.50 m','11.10 m','10.80 m'],1,'Arch height relative to road: −0.30−(−10.8)=10.5 m.','Subtract coordinates; do not interpret −0.30 as a negative physical height.','Underpass',3);
q('l520','5.5','Truck is 7.5 m tall; arch height at its corners is 10.5 m. Decision?',['Fits with 3.0 m spare','Does not fit by 3.0 m','Fits with 10.5 m spare','Only the centre fits'],0,'Clearance = 10.5−7.5 = 3.0 m. Since this is positive, the centred truck fits.','Compare the upper corners, not the centre height alone.','Underpass',3);
q('l521','5.5','Which is the VERTEX form of R=−0.5x²+16x+520?',['R=−0.5(x+16)²+648','R=−0.5(x−16)²+648','R=−0.5(x−16)²+520','R=+0.5(x−16)²+648'],1,'Vertex x = −b/(2a) = −16/(−1)=16; R(16)=648. Therefore −0.5(x−16)²+648.','The maximum is 648, not the y-intercept 520.','Change forms',3);
q('l522','5.5','Which factored form is equivalent to R=−0.5x²+16x+520?',['−0.5(x−52)(x+20)','−0.5(x+52)(x−20)','+0.5(x−52)(x+20)','−0.5(x−16)(x+648)'],0,'The zeros are 52 and −20 and leading coefficient is −0.5, so −0.5(x−52)(x+20).','The x-intercepts are NOT the vertex coordinates.','Change forms',3);
q('l523','5.5','What price per mug gives maximum revenue in the coffee problem?',['$2.60','$1.80','$0.80','$6.48'],1,'At x=16 price decreases: $2.60−16($0.05)=$1.80 per mug. Revenue is $648.','Clearly separate price per mug from total revenue.','Revenue context',2);
q('l524','5.5','What is the y-intercept of R=−0.5x²+16x+520 in context?',['$520 revenue at x=0 decreases','$520 price per mug','520 extra mugs per decrease','The maximum revenue'],0,'R(0)=520 is the original $2.60×200 mugs. x=0 means zero $0.05 decreases.','The y-intercept is a starting value, not necessarily a maximum.','Context',2);
q('l525','5.5','Which underpass information is unnecessary for testing the INNER 5 m by 7.5 m truck?',['30 m underside width','10.8 m interior height','40 m upper width and 2 m concrete thickness','Truck height 7.5 m'],2,'Only the interior parabolic opening and truck dimensions matter. Upper surface width and thickness do not affect the inner clearance in this model.','Word problems sometimes give distractor numbers.','Extra information',3);
q('l526','5.5','Why can’t a negative answer for the jumper time be used?',['Parabolas never have negative x','Time before the exit is outside the defined situation','The quadratic formula is incorrect','Gravity cannot be negative'],1,'Our variable is seconds AFTER leaving the airplane, so physical t≥0. The algebraic model may have an additional negative root.','Reject answers based on the DOMAIN, not just because they look strange.','Physical domain',2);
q('l527','5.5','What equivalent UNDERPASS model gives height above the road, rather than y below the top?',['H=10.8+0.048x²','H=−10.8−0.048x²','H=10.8−0.048x²','H=−0.048x²'],2,'Shift y=−0.048x² upward by 10.8 m because road level becomes H=0. Thus H(x)=10.8−0.048x².','Same parabola, different origin.','Model coordinates',3);
q('l528','5.5','Factored-form zeros are −20 and 52, but x counts PRICE DECREASES. Which restriction is most realistic?',['All real x, including negatives','Only x ≥ 0; also price/quantity must remain meaningful','Only x < −20','Only x = 16'],1,'Because x counts the number of $0.05 decreases, x cannot be negative and should be whole. Also x ≤ 52 if a nonnegative price is required.','Mathematical roots may include values outside the scenario.','Domain',3);
// ——— MC distractor clinic: deliberately tricky NEW questions used in battle mode and mocks ———
q('xt01','5.1','Two quadratics have coefficients a = −0.3 and a = −3. Which is wider?',['a=−3','a=−0.3','Same width','Not enough information'],1,'Width is determined by |a|. Since 0.3 < 3, the −0.3 parabola is wider. Both open down.','Sign tells direction, not width.','Trap: magnitude',3);
q('xt02','5.1','The point (−3,−18) lies on y = ax². Find a.',['−6','2','−2','6'],2,'−18=a(−3)²=9a, so a=−18/9=−2.','Square first: (−3)² is +9.','Trap: squaring',3);
q('xt03','5.1','Which transformation does y = −x² NOT contain?',['Reflection in the x-axis','Downward opening','A vertical translation','Unchanged width'],2,'The minus affects the opening; no +k means no vertical shift.','A negative sign in front is reflection, not a translation down.','Trap: reflection',3);
q('xt04','5.1','A parabola goes through (2,−1) and has vertex (0,0). Which equation?',['y=−¼x²','y=¼x²','y=−2x²','y=−4x²'],0,'−1=a(2²)=4a, so a=−1/4. It opens down and looks wide.','Divide by four, not two.','Trap: solve a',3);
q('xt05','5.1','Which ordering goes widest → narrowest?',['y=4x², y=x², y=¼x²','y=x², y=¼x², y=4x²','y=¼x², y=x², y=4x²','All have equal width'],2,'Smaller nonzero |a| means wider: ¼, then 1, then 4.','Think of vertical stretching, not horizontal stretching.','Trap: width',3);
q('xt06','5.2','What is the vertex of y = (x − (−5))² − (−2)?',['(−5,2)','(5,−2)','(−5,−2)','(5,2)'],0,'Simplify: (x+5)²+2, so vertex (−5,2).','Watch BOTH double negatives.','Trap: double negative',3);
q('xt07','5.2','Which equation moves y = x² right 2 and up 5?',['(x+2)²+5','(x−2)²−5','(x−2)²+5','(x+5)²−2'],2,'Right 2 gives x−2; up 5 gives +5 outside.','An x+2 bracket moves LEFT, not right.','Trap: horizontal sign',3);
q('xt08','5.2','The vertex of y=−(x+3)²−4 is (−3,−4). What is the axis of symmetry?',['x=−3','y=−4','x=3','y=3'],0,'Axis of symmetry is a vertical line x=h, so x=−3.','Do not confuse vertex y-coordinate with the axis.','Trap: axis',3);
q('xt09','5.2','What is the minimum value of y = −(x−1)²+5?',['5','1','−5','There is no minimum over all real x'],3,'a<0 means the graph opens down and has a MAXIMUM of 5. It decreases without bound, so no minimum.','Minimum vs maximum depends on sign of a.','Trap: optimal',3);
q('xt10','5.2','After shifting y=x² left 4, which point replaces (2,4)?',['(6,4)','(−2,4)','(2,0)','(−2,0)'],1,'Apply the translation to x only: new point (2−4,4)=(−2,4).','A horizontal translation keeps y unchanged.','Trap: points',3);
q('xt11','5.3','Mapping (x,y) → (x−3,−2y+5): where does (−2,4) go?',['(1,−3)','(−5,−3)','(−5,13)','(1,13)'],1,'x′=−2−3=−5; y′=−2(4)+5=−3.','The coefficient multiplies original y BEFORE adding k.','Trap: map order',4);
q('xt12','5.3','Which equation corresponds to mapping (x,y) → (x+2,−3y+1) from y=x²?',['y=−3(x−2)²+1','y=−3(x+2)²+1','y=3(x−2)²+1','y=−3(x−2)²−1'],0,'h=2, a=−3, k=1, so y=−3(x−2)²+1.','Mapping has +h, but the equation contains (x−h).','Trap: reverse mapping',4);
q('xt13','5.3','The parent point (0,0) maps to (−4,2), while (1,1) maps to (−3,−1). Find a.',['3','−1','−3','−4'],2,'h=−4,k=2. From y′=a(1)+2=−1, so a=−3.','Do not use the x-coordinate difference to solve for a.','Trap: reverse mapping',4);
q('xt14','5.3','Which point is NOT on y=−2(x−1)²+3?',['(1,3)','(0,1)','(2,1)','(3,1)'],3,'For x=3, y=−2(2²)+3=−5, not 1. The other three check out.','Symmetry gives equal y at x=0 and x=2, not x=3.','Trap: symmetry',4);
q('xt15','5.3','Which has vertex (4,−2) but opens UP, wide?',['y=−½(x−4)²−2','y=½(x+4)²−2','y=½(x−4)²−2','y=2(x−4)²−2'],2,'Vertex (4,−2) requires x−4 and −2; upward wide requires 0<a<1, e.g. a=½.','This combines three common answer-choice traps in one question.','Trap: all parameters',4);
q('xt16','5.4','If y=a(x−2)²+5 goes through (2,5), what is a?',['a=5','a=0','a=1','Cannot determine a'],3,'The point (2,5) is the VERTEX, so it gives 5=a(0)²+5; any nonzero a works.','You need a point OTHER than the vertex to find a.','Trap: missing data',4);
q('xt17','5.4','Vertex (1,8) and point (4,−10): a = ?',['−2','2','−6','−18'],0,'−10 = a(4−1)²+8 → −18=9a → a=−2.','Subtract 8 before dividing by 9.','Trap: solve a',3);
q('xt18','5.4','A parabola has maximum 30 when x=−2, and passes through (0,22). Equation?',['y=2(x+2)²+30','y=−2(x−2)²+30','y=−2(x+2)²+30','y=−8(x+2)²+30'],2,'Vertex (−2,30), so 22=a(0+2)²+30 → −8=4a → a=−2.','The maximum makes a negative, and h = −2 gives x+2.','Trap: context to vertex',4);
q('xt19','5.4','Bakery: which coordinate is the vertex in the profit-vs-price graph?',['($400,$1.75)','($1.75,$400)','($300,$0.75)','($1.75,$300)'],1,'x is price, y is daily profit, so vertex is ($1.75,$400).','Do not reverse coordinates just because profit amount is larger.','Trap: units',3);
q('xt20','5.4','For the bridge model y=ax²+2, why must a be positive?',['It reaches a maximum at the centre','The vertex is a minimum cable height','The bridge is 1516 m long','The towers have the same height'],1,'The cable is LOWEST at the centre and higher at each tower, so the parabola opens UP.','Use geometry to check the algebraic sign.','Trap: physical graph',3);
q('xt21','5.5','Revenue R(x)=−0.5x²+16x+520. What is the axis of symmetry?',['x=−16','x=16','y=648','x=52'],1,'x=−b/(2a)=−16/(−1)=16.','Axis is an x = line, not the maximum y-value.','Trap: axis',3);
q('xt22','5.5','Coffee: 16 price decreases means how many mugs are sold?',['216','160','360','648'],2,'Quantity = 200+10(16)=360 mugs.','Do not confuse amount sold with revenue or number of decreases.','Trap: units',3);
q('xt23','5.5','Smoke jumper: solving −4.9t²+554=0 gives about 10.63 s. Why is that NOT the free-fall duration?',['The formula should use +4.9','The chute opens at 300 m, before hitting the ground','We have to double it','All answers over 10 s are invalid'],1,'The actual problem stops free fall at 300 m. Solving H=0 predicts ground impact without accounting for the parachute.','Always re-read the trigger height.','Trap: wrong event',4);
q('xt24','5.5','A tunnel is 24 m wide, 8 m tall, vertex at its top (0,0). Which equation models the roof underside?',['y=−(1/18)x²','y=−(1/72)x²','y=(1/18)x²','y=−(1/3)x²'],0,'Base point (12,−8). −8=a(12²)=144a, so a=−8/144=−1/18.','Use HALF-width 12, then square it.','Trap: arch',4);
q('xt25','5.5','A tunnel has model H(x)=8−x²/18. An 8 m wide truck is centred. Height of tunnel at its top CORNERS?',['8 m','7.11 m','6 m','4.44 m'],1,'Truck half-width is 4. H(4)=8−16/18≈7.11 m.','The tunnel is only 8 m high in the centre, not at its edges.','Trap: edge check',4);
q('xt26','5.5','Which has vertex (1,4), x-intercepts at −1 and 3, and opens down?',['y=−(x+1)(x−3)','y=(x+1)(x−3)','y=−(x−1)(x−3)','y=−(x+1)(x+3)'],0,'Zeros −1 and 3 → factors (x+1)(x−3). At midpoint x=1, the product = (2)(−2)=−4. Multiply by −1 gives vertex y=4.','Use the other feature to determine a, not only zeros.','Trap: compare forms',4);
q('xt27','5.5','The quadratic y=−0.5(x−4)²+9 has maximum:',['9 when x=4','4 when y=9','9 when x=−4','No maximum'],0,'Vertex (4,9), downward opening because a<0. So maximum y=9 at x=4.','Max value is the y-coordinate, x-value gives WHERE it happens.','Trap: interpret',3);
q('xt28','5.5','Why can the theoretical left root x=−20 of the coffee revenue model be unrealistic?',['Because x represents a count of price DECREASES','Because all quadratics have two real zeros','Because it makes revenue too high','Because the parabola opens down'],0,'You defined x as the number of $0.05 price decreases. A negative x would mean price INCREASES, outside that definition.','A mathematically valid x-intercept is not always physically allowed.','Trap: domain',4);
q('xt29','5.5','Which relation is the SAME parabola as y=−0.5(x−16)²+648?',['y=−0.5x²+16x+520','y=−0.5x²−16x+520','y=−0.5x²+16x+648','y=+0.5x²+16x+520'],0,'Expand: (x−16)²=x²−32x+256; ×−0.5 = −0.5x²+16x−128; +648 gives +520.','The y-intercept is NOT the vertex height.','Trap: convert forms',4);
q('xt30','5.5','Which choice best demonstrates a sensible FINAL answer to the underpass problem?',['a = −0.048','x=2.5','Yes, the centred truck fits, with 3.0 m of clearance at its top corners.','The parabola has a vertex at (0,0).'],2,'Real-life applications need an interpreted yes/no answer, relevant condition, and correct units.','In word problems, an equation alone often does not answer the original question.','Trap: final interpretation',3);

function makeMappingTable(a,h,k){let rows=[-2,-1,0,1,2].map(x=>{const y=x*x;const yy=a*y+k;return `<tr><td>${x}</td><td>${y}</td><td><strong>${fmt(x+h)}</strong></td><td><strong>${fmt(yy)}</strong></td></tr>`}).join('');return `<div class="mt-12"><div class="muted tiny" style="font-weight:800">PARENT → TRANSFORMED</div><table class="coord-table"><thead><tr><th>x</th><th>y = x²</th><th>x + h</th><th>ay + k</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
function fmt(n){return Math.abs(n-Math.round(n))<1e-8?String(Math.round(n)):Number(n.toFixed(3)).toString();}

function modal(content){$('#modal').innerHTML=`<div class="modal-inner" role="dialog" aria-modal="true"><button class="btn btn-outline btn-small" style="float:right" data-action="close-modal" aria-label="Close">✕</button>${content}</div>`;}
function closeModal(){$('#modal').innerHTML='';}
function showGuide(){modal(`<span class="eyebrow">WELCOME TO QUADRATIC QUEST</span><h2 class="mt-12">How to get the most out of your 3 days</h2><p><b>Step 1:</b> Open Lesson 5.1, play the actual teaching segment, then click the 5-question recall review. Repeat for each video.</p><p><b>Step 2:</b> Use the worksheet walkthroughs. Reveal their steps one at a time and redo the algebra yourself before reading the next step.</p><p><b>Step 3:</b> Score at least <b>7/8</b> on each checkpoint. In the Graph Playground, practise moving a, h and k.</p><p><b>Step 4:</b> Do one timed mock on the final day. Every mistake goes into your vault, where two consecutive correct redos clear it.</p><p>Videos are streamed from YouTube; the rest of the website works offline. Your progress stays in this browser’s local storage. Switching devices or clearing site data does not sync it.</p><div class="flex mt-16"><button class="btn btn-primary" data-action="close-modal">Got it ✓</button><button class="btn btn-outline" data-action="toggle-sound">Sound effects: ${S.settings.sound?'ON':'OFF'}</button></div>`);}
function showSubmit(){modal(`<span class="eyebrow">SUBMIT ASSESSMENT?</span><h2 class="mt-12">Are you sure you're finished?</h2><p>Unanswered questions count as incorrect. You can still flag answers and revisit questions before submitting.</p><div class="flex mt-22"><button class="btn btn-primary" data-action="confirm-submit">Submit and see results</button><button class="btn btn-outline" data-action="close-modal">Keep working</button></div>`);}
function showQuit(){modal(`<span class="eyebrow">LEAVE QUIZ?</span><h2 class="mt-12">Your current answers will not be graded.</h2><p>Completed reviews and test scores remain saved. This unfinished round is discarded if you leave.</p><div class="flex mt-22"><button class="btn btn-primary" data-action="confirm-quit">Leave quiz</button><button class="btn btn-outline" data-action="close-modal">Keep working</button></div>`);}
function handleAction(action,t){switch(action){
 case 'toggle-menu':$('#sidebar').classList.toggle('open');break;
 case 'show-help':showGuide();break;
 case 'close-modal':closeModal();break;
 case 'toggle-sound':S.settings.sound=!S.settings.sound;save();showGuide();break;
 case 'start-review':startVideoReview(t.dataset.lesson,t.dataset.video);break;
 case 'start-checkpoint':startCheckpoint(t.dataset.lesson);break;
 case 'start-diagnostic':startDiagnostic();break;
 case 'start-trap':startTrap();break;
 case 'start-mock':startMock();break;
 case 'start-lightning':startLightning();break;
 case 'start-mistakes':startMistakes();break;
 case 'single-mistake':startMistakes([t.dataset.id]);break;
 case 'choose':chooseOption(Number(t.dataset.choice));break;
 case 'quiz-next':moveQuiz(1);break;
 case 'quiz-prev':moveQuiz(-1);break;
 case 'jump-question':if(QUIZ){QUIZ.index=Number(t.dataset.index);render();}break;
 case 'quiz-submit':if(QUIZ){if(QUIZ.ids.some(id=>!isAnswered(id)))showSubmit();else finishQuiz(false);}break;
 case 'flag':if(QUIZ){let id=QUIZ.ids[QUIZ.index];QUIZ.flags[id]=!QUIZ.flags[id];render();}break;
 case 'quit-quiz':showQuit();break;
 case 'confirm-quit':QUIZ=null;closeModal();navigate('arena');break;
 case 'confirm-submit':closeModal();finishQuiz(false);break;
 case 'retry-last':if(lastResult){const r=lastResult;doQuiz(r.kind,r.ids,{lesson:r.sourceLesson,video:r.sourceVideo,title:r.title,timeLimit:r.timeLimit});}break;
 case 'retry-wrong':if(lastResult)startMistakes(lastResult.misses);break;
 case 'next-step':{const key=t.dataset.key,max=Number(t.dataset.max);stepIndex[key]=stepIndex[key]>=max?0:(stepIndex[key]||0)+1;render();break;}
 case 'lab-mode':lab.mode=t.dataset.mode;lab.feedback='';render();break;
 case 'lab-reset':lab.a=1;lab.h=0;lab.k=0;lab.feedback='';render();break;
 case 'lab-random':{const values=[-3,-2,-1,-.5,.5,1,1.5,2,3];lab.a=values[Math.floor(Math.random()*values.length)];lab.h=Math.floor(Math.random()*11)-5;lab.k=Math.floor(Math.random()*11)-5;render();break;}
 case 'lab-check':checkLab();break;
 case 'lab-new':newLabTarget();break;
 case 'lab-hint':{const t=LAB_TARGETS[lab.targetIndex];lab.feedback=`Hint: vertex is (${t.h}, ${t.k}). ${t.a<0?'It opens DOWN.':'It opens UP.'} Now compare its width with the parent y=x².`;const e=$('#labFeedback');if(e)e.textContent=lab.feedback;break;}
 case 'print':window.print();break;
 }}
document.addEventListener('click',e=>{const target=e.target.closest('[data-route],[data-action]');if(!target)return;if(target.disabled)return;if(target.dataset.route){navigate(target.dataset.route);return;}if(target.dataset.action)handleAction(target.dataset.action,target);});
document.addEventListener('input',e=>{if(['sliderA','sliderH','sliderK'].includes(e.target.id)){const id=e.target.id;let v=Number(e.target.value);if(id==='sliderA'&&v===0){v=.5;e.target.value='0.5';}if(id==='sliderA')lab.a=v;if(id==='sliderH')lab.h=v;if(id==='sliderK')lab.k=v;updateLab();}});
document.addEventListener('change',e=>{if(e.target.id==='labParent'){lab.showParent=e.target.checked;updateLab();}if(e.target.id==='arenaFilter'){arenaFilter=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();return;}if(route!=='quiz'||!QUIZ||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(['1','2','3','4'].includes(e.key)){const qid=QUIZ.ids[QUIZ.index];const original=QUIZ.order[qid][Number(e.key)-1];chooseOption(original);e.preventDefault();}if(e.key==='Enter'&&QUIZ.immediate&&isAnswered(QUIZ.ids[QUIZ.index])){moveQuiz(1);e.preventDefault();}});
// Place the mystery target path inside the graph renderer (visible only when mystery mode is active).
render();timerInterval=setInterval(updateTimerDisplay,1000);

</script>
</body>
</html>
