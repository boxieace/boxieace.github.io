nt-weight:780;font-size:12px}.step p{margin:0;color:#d8e4f0;font-size:13px;line-height:1.7}.solution{color:#9bdbba;font-weight:760;margin-top:14px;padding:12px 13px;background:#1c393b;border-radius:9px;font-size:13px}.answerreview{border:1px solid #334a65;border-radius:9px;padding:10px 11px;margin-top:12px;color:#acbbd0;font-size:12px;background:#152235}

  <div id="app"></div>
  <script>'use strict';
// Vertex Lab: a self-contained Ontario MPM2D practice website.
const MODULES = [
  {name:'Vertex form essentials',small:'Read a, h, k and key features',time:9,video:'Video 1 - Overview',href:'https://www.youtube.com/results?search_query=MPM2D+vertex+form+quadratic+transformations',linkText:'Find overview videos'},
  {name:'Transformations',small:'Stretches, reflections, shifts',time:12,video:'Video 2 - PeachPI Math',href:'https://www.youtube.com/results?search_query=PeachPI+Math+transformations+quadratic+functions',linkText:'Find PeachPI video'},
  {name:'Mapping rules',small:'Tables and transformed points',time:15,video:'Video 3 - Mapping rules',href:'https://www.youtube.com/results?search_query=Sherry+Coulter+Graphing+Quadratic+Functions+Mapping+Rule',linkText:'Find mapping-rule video'},
  {name:'Graphing vertex form',small:'Plot parabolas precisely',time:12,video:'Video 4 - Mario Math Tutoring',href:'https://www.youtube.com/results?search_query=Mario+Math+Tutoring+Graphing+Parabolas+Vertex+Form',linkText:'Find graphing video'},
  {name:'Graph to equation',small:'Recover a, h, and k',time:12,video:'Video 5 - E Math Academy',href:'https://www.youtube.com/results?search_query=How+to+Find+Vertex+Form+Parabola+from+Graph',linkText:'Find equation video'}
];
const QUESTIONS = [
  {id:'1.1',m:0,time:2,type:'fields',title:'Decode the parameters',prompt:'y = -3(x + 2)^2 - 4',desc:'Enter the numerical values for a, h, and k. Watch the sign inside the brackets.',fields:[{id:'a',label:'a (vertical factor)',answer:-3},{id:'h',label:'h (horizontal shift)',answer:-2},{id:'k',label:'k (vertical shift)',answer:-4}],hint:'Compare x + 2 to x - h. That means x - (-2).',steps:['Write the template: y = a(x - h)^2 + k.','The number multiplying the squared bracket is a = -3.','Since x + 2 = x - (-2), h = -2, not +2.','The final number is k = -4.'],answerText:'a = -3, h = -2, k = -4.'},
  {id:'1.2',m:0,time:2,type:'fields',title:'Vertex, symmetry, and optimal value',prompt:'y = 2(x - 4)^2 + 1',desc:'Fill in the features. For the axis and optimal value, enter numbers only.',fields:[{id:'vx',label:'Vertex x',answer:4},{id:'vy',label:'Vertex y',answer:1},{id:'axis',label:'Axis of symmetry: x =',answer:4},{id:'optimal',label:'Optimal value: y =',answer:1}],hint:'The vertex is always (h, k). The axis runs vertically through that vertex.',steps:['Compare the equation to y = a(x - h)^2 + k: h = 4 and k = 1.','The vertex is (h, k) = (4, 1).','The axis of symmetry is x = h = 4.','Because a = 2 is positive, the graph opens up. The optimal value is a minimum of y = 1.'],answerText:'Vertex (4, 1); axis x = 4; minimum y = 1.'},
  {id:'1.3',m:0,time:2,type:'fields',title:'Find the y-intercept',prompt:'y = -(x - 2)^2 + 5',desc:'What is the y-coordinate where the graph crosses the y-axis?',fields:[{id:'intercept',label:'y-intercept value',answer:1}],hint:'The y-axis is where x = 0. Substitute zero for every x.',steps:['The y-intercept occurs when x = 0.','Substitute: y = -(0 - 2)^2 + 5.','Simplify: y = -(4) + 5 = 1.','Therefore the y-intercept is (0, 1).'],answerText:'(0, 1)'},
  {id:'1.4',m:0,time:3,type:'choice',title:'Opening and maximum versus minimum',prompt:'y = -0.5(x + 3)^2 + 2',desc:'Select the one statement that is fully correct.',choices:['Opens upward; minimum y = 2; narrower than y = x^2','Opens downward; maximum y = 2; wider than y = x^2','Opens downward; minimum y = 2; narrower than y = x^2','Opens upward; maximum y = 2; wider than y = x^2'],correct:1,hint:'A negative a flips the graph downward. The size |a| = 0.5 is less than 1.',steps:['Read a = -0.5, h = -3, and k = 2.','Since a < 0, the parabola opens downward and is reflected in the x-axis.','Since 0 < |a| < 1, it is vertically compressed (visually wider).','The vertex is (-3, 2), so y = 2 is a maximum.'],answerText:'Opens downward; maximum y = 2; wider.'},

  {id:'2.1',m:1,time:2,type:'choice',title:'What does a = -1/4 actually do?',prompt:'y = -(1/4)x^2',desc:'Choose every effect described by the single best answer.',choices:['Vertical stretch by 4, then reflection in the y-axis','Reflection across the x-axis and vertical compression by a factor of 1/4','Vertical shift down 1/4 and no reflection','Horizontal compression by 1/4 and opens up'],correct:1,hint:'The negative sign reflects; the magnitude |a| controls vertical stretch or compression.',steps:['The negative sign means a < 0, so reflect the parent parabola in the x-axis.','The magnitude is |a| = 1/4, which lies between 0 and 1.','Multiply every parent y-value by -1/4. That is a vertical compression by 1/4 combined with a reflection.'],answerText:'Reflection in the x-axis + vertical compression by 1/4.'},
  {id:'2.2',m:1,time:2,type:'fields',title:'Translations and the hidden sign flip',prompt:'y = (x + 5)^2 - 2',desc:'Enter how far the graph moves horizontally and vertically. Left/down are negative.',fields:[{id:'h',label:'Horizontal shift h',answer:-5},{id:'k',label:'Vertical shift k',answer:-2}],hint:'Inside the parentheses has the opposite sign. Outside keeps its sign.',steps:['Rewrite x + 5 as x - (-5).','This means h = -5, or 5 units to the left.','The outside term k = -2 means 2 units down.','The vertex therefore moves from (0, 0) to (-5, -2).'],answerText:'Left 5; down 2. Vertex (-5, -2).'},
  {id:'2.3',m:1,time:2,type:'fields',title:'Turn a description into an equation',prompt:'Stretch vertically by 2; shift right 3 and up 2.',desc:'Write the entire transformed equation in vertex form. Example format: y=2(x-3)^2+2',fields:[{id:'eq',label:'Vertex-form equation',kind:'equation',answer:{a:2,h:3,k:2},placeholder:'y=...'}],hint:'Stretch gives a = 2. Right 3 means (x - 3). Up 2 means + 2.',steps:['Start from y = a(x - h)^2 + k.','The vertical stretch gives a = 2.','Right 3 means h = 3, so the bracket is (x - 3).','Up 2 means k = 2. Substitute the parameters.'],answerText:'y = 2(x - 3)^2 + 2'},
  {id:'2.4',m:1,time:3,type:'fields',title:'Combine all four transformations',prompt:'Reflect across the x-axis; compress vertically by 1/2; shift left 4; shift down 1.',desc:'Write the vertex-form equation. A fraction like -1/2 is accepted.',fields:[{id:'eq',label:'Vertex-form equation',kind:'equation',answer:{a:-.5,h:-4,k:-1},placeholder:'y=...'}],hint:'Reflection and compression combine to a = -1/2. Left 4 uses (x + 4).',steps:['Start with y = a(x - h)^2 + k.','Reflection in the x-axis makes a negative; compression by 1/2 gives a = -1/2.','Left 4 makes h = -4, so use (x + 4).','Down 1 gives k = -1. Put these together.'],answerText:'y = -1/2(x + 4)^2 - 1'},
  {id:'2.5',m:1,time:3,type:'choice',title:'Read the transformations visually',prompt:'Compare the blue parabola to the dashed parent graph y = x^2.',desc:'Use width, vertex location, and opening direction to decide.',chart:{a:.5,h:2,k:1,showParent:true},choices:['Narrower, 2 right, 1 up','Wider, 2 right, 1 up','Wider, 2 left, 1 down','Reflected across x-axis, 2 right, 1 up'],correct:1,hint:'The blue vertex has moved to (2, 1). Its arms spread farther apart than the parent.',steps:['Read the new vertex from the graph: (2, 1), which means right 2 and up 1.','The blue parabola still opens upward, so a is positive.','At the same vertical height from their vertices, the blue parabola is wider, so 0 < a < 1.','The graph represents a vertical compression (for this graph, a = 1/2).'],answerText:'Wider, shifted right 2 and up 1.'},

  {id:'3.1',m:2,time:2,type:'fields',title:'Build a specific mapping rule',prompt:'y = -3(x + 2)^2 - 4',desc:'Complete (x, y) -> (x + H, A*y + K) by entering the values H, A, and K.',fields:[{id:'H',label:'H: add to x',answer:-2},{id:'A',label:'A: multiply y by',answer:-3},{id:'K',label:'K: add to y',answer:-4}],hint:'Your teacher uses (x,y) -> (x+h, ay+k). Use h = -2, not +2.',steps:['Compare with y = a(x - h)^2 + k: a = -3, h = -2, k = -4.','Take the general rule (x, y) -> (x + h, ay + k).','Replace h with -2, a with -3, and k with -4.','The specific rule is (x, y) -> (x - 2, -3y - 4).'],answerText:'(x, y) -> (x - 2, -3y - 4)'},
  {id:'3.2',m:2,time:2,type:'fields',title:'Transform a parent point',prompt:'Rule: (x, y) -> (x - 3, 2y + 1). Parent point: (-1, 1).',desc:'Enter the transformed coordinates.',fields:[{id:'x',label:'New x',answer:-4},{id:'y',label:'New y',answer:3}],hint:'Change x and y independently. x: -1 - 3; y: 2(1) + 1.',steps:['The parent point is (x, y) = (-1, 1).','For the new x, compute x - 3 = -1 - 3 = -4.','For the new y, compute 2y + 1 = 2(1) + 1 = 3.','The new point is (-4, 3).'],answerText:'(-4, 3)'},
  {id:'3.3',m:2,time:4,type:'table',title:'Complete both tables of values',prompt:'y = -2(x + 1)^2 + 3',desc:'Apply the mapping rule to the five points of y = x^2. Complete every blank in the transformed table.',params:{a:-2,h:-1,k:3},baseXs:[-2,-1,0,1,2],hint:'Rule: (x, y) -> (x - 1, -2y + 3). Parent y-values are 4, 1, 0, 1, 4.',steps:['First identify a = -2, h = -1 and k = 3.','The mapping rule is (x, y) -> (x - 1, -2y + 3).','For parent x = -2 and y = 4: new x = -3, new y = -8 + 3 = -5.','Apply that same rule to all five parent points. The new x-values are -3, -2, -1, 0, 1; new y-values are -5, 1, 3, 1, -5.','Plot those five transformed coordinates on a grid, then connect them with a smooth parabola.'],answerText:'(-3,-5), (-2,1), (-1,3), (0,1), (1,-5)'},
  {id:'3.4',m:2,time:4,type:'plot',title:'Plot the five mapped points',prompt:'y = -(x - 1)^2 + 2',desc:'Click five transformed points on the grid using the parent x-values -2, -1, 0, 1, 2. Clicks snap to 0.5-unit increments.',params:{a:-1,h:1,k:2},baseXs:[-2,-1,0,1,2],hint:'Mapping rule: (x, y) -> (x + 1, -y + 2). Begin with parent (0, 0) which becomes (1, 2).',steps:['Identify a = -1, h = 1, and k = 2.','Use the rule (x, y) -> (x + 1, -y + 2).','Transform the parent points: (-2,4)->(-1,-2); (-1,1)->(0,1); (0,0)->(1,2); (1,1)->(2,1); (2,4)->(3,-2).','Plot the resulting five points and draw a smooth downward parabola, symmetric about x = 1.'],answerText:'(-1,-2), (0,1), (1,2), (2,1), (3,-2)'},
  {id:'3.5',m:2,time:3,type:'fields',title:'Reverse a mapping rule',prompt:'Rule: (x, y) -> (x + 1, -2y + 2). A transformed point is (3, -6).',desc:'Which parent point on y = x^2 generated it?',fields:[{id:'x',label:'Original x',answer:2},{id:'y',label:'Original y',answer:4}],hint:'Undo each operation: original x = 3 - 1; original y = (-6 - 2)/(-2).',steps:['Write x + 1 = 3 and solve x = 2.','Write -2y + 2 = -6, giving -2y = -8 and y = 4.','Check the parent relationship: 2^2 = 4, so the point lies on y = x^2.','The original point is (2, 4).'],answerText:'(2, 4)'},

  {id:'4.1',m:3,time:2,type:'fields',title:'Extract the graphing essentials',prompt:'y = 4(x - 1)^2 - 2',desc:'Find the vertex, axis, and minimum value. Use numbers only.',fields:[{id:'vx',label:'Vertex x',answer:1},{id:'vy',label:'Vertex y',answer:-2},{id:'axis',label:'Axis x =',answer:1},{id:'min',label:'Minimum y =',answer:-2}],hint:'The vertex is (h, k). Here a > 0, so the optimal value is a minimum.',steps:['Read a = 4, h = 1, and k = -2.','The vertex is (1, -2), and the axis is x = 1.','Since a = 4 > 0, the parabola opens upward and is vertically stretched by 4.','The minimum y-value is -2.'],answerText:'Vertex (1,-2), axis x=1, minimum y=-2.'},
  {id:'4.2',m:3,time:2,type:'choice',title:'Use your teacher\'s graphing order',prompt:'Your teacher asks you to graph using separate transformations, not a mapping rule.',desc:'Which order matches Lesson 5.3?',choices:['Translate first, reflect, then stretch/compress','Stretch/compress; reflect if needed; then shift horizontally and vertically','Shift vertically, then find y-intercept, then flip','Reflect in the y-axis, shift, then stretch'],correct:1,hint:'Lesson 5.3 lists the a transformations before the h and k translations.',steps:['Identify a, h, and k and state the related transformations.','Graph the vertical stretch or compression from the a-value.','Graph the vertical reflection if a is negative.','Apply horizontal and vertical translations from h and k. Mapping rules can combine the steps at once.'],answerText:'Stretch/compress, reflect, then translate.'},
  {id:'4.3',m:3,time:3,type:'plot',title:'Graph a stretched parabola',prompt:'y = 2(x + 1)^2 - 3',desc:'Plot the five new points from parent x-values -2, -1, 0, 1, 2. The dashed curve is y = x^2.',params:{a:2,h:-1,k:-3},baseXs:[-2,-1,0,1,2],hint:'Use (x, y) -> (x - 1, 2y - 3); the new vertex is (-1, -3).',steps:['Identify a = 2, h = -1 and k = -3.','Apply the mapping rule (x, y) -> (x - 1, 2y - 3).','For x = -2,-1,0,1,2, the parent y-values are 4,1,0,1,4.','The mapped points are (-3,5), (-2,-1), (-1,-3), (0,-1), (1,5).','Draw a smooth U-shaped graph through these points with axis x = -1.'],answerText:'(-3,5), (-2,-1), (-1,-3), (0,-1), (1,5)'},
  {id:'4.4',m:3,time:2,type:'fields',title:'Find the exact y-intercept',prompt:'y = -1/2(x - 4)^2 + 5',desc:'Supply the y-intercept as (x, y). Fractions and decimals are accepted.',fields:[{id:'x',label:'Intercept x',answer:0},{id:'y',label:'Intercept y',answer:-3}],hint:'At the y-axis, x = 0. Square (0 - 4) before multiplying by -1/2.',steps:['On the y-axis, x = 0.','Substitute: y = -1/2(0 - 4)^2 + 5.','Evaluate the squared bracket: (-4)^2 = 16.','Multiply and add: y = -8 + 5 = -3. The intercept is (0, -3).'],answerText:'(0, -3)'},
  {id:'4.5',m:3,time:3,type:'plot',title:'Graph a reflected and translated parabola',prompt:'y = -(x + 2)^2 + 3',desc:'Place five transformed points on the grid using the usual parent table.',params:{a:-1,h:-2,k:3},baseXs:[-2,-1,0,1,2],hint:'The vertex is (-2,3). The other points are symmetric around x = -2.',steps:['Read a = -1, h = -2, k = 3: reflect across x-axis, shift left 2, shift up 3.','Apply the mapping rule (x, y) -> (x - 2, -y + 3).','Parent values 4,1,0,1,4 become -1,2,3,2,-1.','The five points are (-4,-1), (-3,2), (-2,3), (-1,2), (0,-1). Connect with a smooth downward curve.'],answerText:'(-4,-1), (-3,2), (-2,3), (-1,2), (0,-1)'},

  {id:'5.1',m:4,time:2,type:'fields',title:'Read a, h, and k from the graph',prompt:'The dots mark the vertex V and a second point P. Read their coordinates using the grid.',desc:'Find the parameters of the graphed parabola.',chart:{a:-2,h:-1,k:3,mark:true},fields:[{id:'a',label:'a',answer:-2},{id:'h',label:'h',answer:-1},{id:'k',label:'k',answer:3}],hint:'Read vertex V = (-1, 3) and second point P = (0, 1). Put P into y = a(x + 1)^2 + 3.',steps:['Read the marked vertex from the grid: V = (-1, 3).','That fixes h = -1 and k = 3, so y = a(x + 1)^2 + 3.','Read the second marked point: P = (0, 1). Substitute: 1 = a(0 + 1)^2 + 3.','Subtract 3: a = -2. Thus y = -2(x + 1)^2 + 3.'],answerText:'a=-2, h=-1, k=3. Equation: y=-2(x+1)^2+3.'},
  {id:'5.2',m:4,time:3,type:'fields',title:'Vertex + one point determines a',prompt:'Vertex: (2, -1). Another point on the parabola: (4, 7).',desc:'Determine the a-value and write the whole equation.',fields:[{id:'a',label:'a-value',answer:2},{id:'eq',label:'Vertex-form equation',kind:'equation',answer:{a:2,h:2,k:-1},placeholder:'y=...'}],hint:'Start with y = a(x - 2)^2 - 1. Substitute x = 4 and y = 7.',steps:['The vertex gives h = 2 and k = -1. Write y = a(x - 2)^2 - 1.','Use the other point (4, 7): 7 = a(4 - 2)^2 - 1.','Simplify: 7 = 4a - 1, so 8 = 4a and a = 2.','Substitute back: y = 2(x - 2)^2 - 1.'],answerText:'a = 2; y = 2(x - 2)^2 - 1.'},
  {id:'5.3',m:4,time:3,type:'fields',title:'Find the equation from a graph',prompt:'Read the vertex V and point P from the plotted curve. Determine a and the equation.',desc:'This one is wider than the parent parabola. A decimal or fraction is fine.',chart:{a:.5,h:3,k:-1,mark:true,anchorX:1},fields:[{id:'a',label:'a-value',answer:.5},{id:'eq',label:'Vertex-form equation',kind:'equation',answer:{a:.5,h:3,k:-1},placeholder:'y=...'}],hint:'Read V = (3,-1) and P = (1,1). Substitute into 1 = a(1 - 3)^2 - 1.',steps:['Read the vertex: V = (3, -1), so h = 3 and k = -1.','Write y = a(x - 3)^2 - 1.','Use point P = (1, 1): 1 = a(1 - 3)^2 - 1 = 4a - 1.','Add 1: 2 = 4a, so a = 1/2. The equation is y = 1/2(x - 3)^2 - 1.'],answerText:'a = 1/2; y = 1/2(x - 3)^2 - 1.'},
  {id:'5.4',m:4,time:2,type:'choice',title:'Can two points alone give you the vertex?',prompt:'A parabola passes through (1, 2) and (3, 2). Nothing else is given.',desc:'Which conclusion is mathematically justified?',choices:['The vertex must be (2, 0).','The vertex must be (2, 2).','The symmetry axis is x = 2, but the vertex is not uniquely determined.','The axis of symmetry cannot be determined.'],correct:2,hint:'Two equal-height points are symmetric about their midpoint, but many parabolas can pass through both.',steps:['The points (1,2) and (3,2) have the same y-value, so their midpoint x-coordinate is (1 + 3)/2 = 2.','Any vertical-axis parabola through those points has symmetry axis x = 2.','But the vertex height is not fixed: y = (x - 2)^2 + 1 and y = 2(x - 2)^2 both pass through the two given points.','Therefore two arbitrary points cannot determine a unique parabola or its exact vertex.'],answerText:'Axis x = 2; vertex not uniquely determined.'},
  {id:'5.5',m:4,time:2,type:'fields',title:'Two symmetric points + known a',prompt:'a = 1. The parabola passes through (0, 5) and (4, 5).',desc:'Now there is enough information. Find the vertex and write the equation.',fields:[{id:'h',label:'Vertex x (h)',answer:2},{id:'k',label:'Vertex y (k)',answer:1},{id:'eq',label:'Vertex-form equation',kind:'equation',answer:{a:1,h:2,k:1},placeholder:'y=...'}],hint:'Equal y-values imply a vertical symmetry line halfway between x = 0 and x = 4.',steps:['The two points have the same y-value, so the symmetry axis is halfway between x = 0 and x = 4: h = 2.','Since a = 1, write y = (x - 2)^2 + k.','Insert (0, 5): 5 = (0 - 2)^2 + k = 4 + k, so k = 1.','The vertex is (2, 1) and the equation is y = (x - 2)^2 + 1.'],answerText:'Vertex (2,1); y = (x - 2)^2 + 1.'}

const STORAGE_KEY='vertex-lab-2026-v2';
function freshState(){return {started:false,mode:'intro',running:false,startTick:null,elapsedSec:0,current:0,drafts:{},results:{},hints:{}};}
let state=freshState();
try {const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); if(saved && typeof saved==='object')state={...freshState(),...saved};}catch(e){}
if(state.started && state.mode==='intro')state.mode='quiz';
if(!Number.isInteger(state.current)||state.current<0||state.current>=QUESTIONS.length)state.current=0;
const app=document.getElementById('app');
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function elapsed(){return Math.max(0,(state.elapsedSec||0)+(state.running && state.startTick?Math.floor((Date.now()-state.startTick)/1000):0));}
function formatTime(s){const m=Math.floor(Math.abs(s)/60),ss=Math.abs(s)%60;return `${s<0?'+':''}${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
function esc(str){return String(str===null||str===undefined?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fancy(str){return esc(str).replace(/\^2/g,'\u00b2').replace(/->/g,'\u2192').replace(/\*/g,'\u00d7');}
function expectedFields(q){if(q.type==='table'){return q.baseXs.flatMap((x,i)=>[{id:`x${i}`,answer:x+q.params.h},{id:`y${i}`,answer:q.params.a*x*x+q.params.k}]);}return q.fields||[];}
function parseNum(raw){if(raw===undefined||raw===null)return NaN;let t=String(raw).trim().toLowerCase().replace(/\u2212/g,'-').replace(/,/g,'.').replace(/^\s*[xy]\s*=\s*/,'').replace(/\s/g,'');if(!t)return NaN;if(/^[-+]?(\d*\.?\d+)\/([-+]?(\d*\.?\d+))$/.test(t)){let [n,d]=t.split('/');return +d?+n/+d:NaN;}return /^[-+]?(?:\d*\.?\d+)$/.test(t)?+t:NaN;}
function eqParse(raw){let s=String(raw||'').trim().toLowerCase().replace(/\u2212/g,'-').replace(/\u00b2/g,'^2').replace(/\s/g,'').replace(/^y=/,'').replace(/\*/g,'');s=s.replace(/^([+-]?)\((\d+\/\d+)\)\(/,'$1$2(');
const m=s.match(/^([+-]?(?:(?:\d+(?:\.\d+)?|\.\d+)(?:\/(?:\d+(?:\.\d+)?|\.\d+))?)?)\(x([+-](?:\d+(?:\.\d+)?|\.\d+))?\)\^2([+-](?:\d+(?:\.\d+)?|\.\d+))?$/);
if(!m)return null;let a=m[1]===''||m[1]==='+'?1:m[1]==='-'?-1:parseNum(m[1]);let h=m[2]?-Number(m[2]):0;let k=m[3]?Number(m[3]):0;return [a,h,k].every(Number.isFinite)?{a,h,k}:null;}
function isEqual(a,b){return Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)<.00001;}
function isCorrectField(f,raw){if(f.kind==='equation'){let x=eqParse(raw);return !!x && ['a','h','k'].every(k=>isEqual(x[k],f.answer[k]));}return isEqual(parseNum(raw),f.answer);}
function draftFor(q){return state.drafts[q.id]||(state.drafts[q.id]={});}
function targetPoints(q){return (q.baseXs||[-2,-1,0,1,2]).map(x=>[x+q.params.h,q.params.a*x*x+q.params.k]);}
function resultsProgress(){let attempted=QUESTIONS.filter(q=>!!state.results[q.id]).length;let mastered=QUESTIONS.filter(q=>state.results[q.id]&&state.results[q.id].earned===state.results[q.id].total).length;let pts=QUESTIONS.reduce((s,q)=>{let r=state.results[q.id];return s+(r?r.earned/r.total:0);},0);return {attempted,mastered,pct:Math.round(attempted/QUESTIONS.length*100),accuracy:attempted?Math.round(pts/attempted*100):0};}
function start(){if(!state.started){state.started=true;state.mode='quiz';state.current=0;state.elapsedSec=0;state.startTick=Date.now();state.running=true;}else{state.mode='quiz';}save();render();}

function timerHTML(){return `<div class="timebox" aria-label="Practice timer"><span style="color:var(--mint)">\u25f7</span> <span class="time" id="clock">${formatTime(3600-elapsed())}</span><button class="smalllink" data-action="timer">${state.running?'Pause':'Resume'}</button></div>`;}

function feedbackHTML(q){const r=state.results[q.id];if(!r)return '';const cls=r.earned===r.total?'':r.earned?'partial':'wrong';const name=r.earned===r.total?'Correct. Nicely done.':r.earned?'Partially correct - check what slipped.':'Not quite - learn the method here.';let details='';if(q.type==='fields'||q.type==='table'){details=`<div class="answerreview">${expectedFields(q).map(f=>`${esc(f.label||f.id)}: <b style="color:${r.checks[f.id]?'#9de8ba':'#f0b9c0'}">${esc((r.answer||{})[f.id]||'blank')}${r.checks[f.id]?' \u2713':' \u2717'}</b>`).join(' \u00b7 ')}</div>`;}else if(q.type==='plot'){details=`<div class="answerreview">You placed ${((r.answer||{}).points||[]).length} point(s). Correct positions are shown in green on the graph.</div>`;}else{details=`<div class="answerreview">Your choice: ${r.answer&&r.answer.choice!==undefined?fancy(q.choices[r.answer.choice]||'No choice'):'none'}</div>`;}
return `<section class="solved ${cls}" aria-live="polite"><div class="feedback-head"><div><h3>${name}</h3><p>Review the reasoning below, then move to the next skill.</p></div><div class="result-score">${r.earned}/${r.total} parts</div></div>${stepHTML(q)}<div style="padding:0 20px 20px;background:#0f1e2d">${details}</div></section>`;}
function fieldHTML(q){const d=draftFor(q),r=state.results[q.id];return `<div class="input-grid">${q.fields.map(f=>{const cls=r?(r.checks[f.id]?'correct':'wrong'):'';return `<label class="field">${fancy(f.label)}<input type="text" spellcheck="false" autocomplete="off" inputmode="text" data-field="${esc(f.id)}" class="${cls}" ${r?'disabled':''} value="${esc(d[f.id]||'')}" placeholder="${esc(f.placeholder||(f.kind==='equation'?'y=...':'Enter a number'))}" /></label>`;}).join('')}</div>`;}
function tableHTML(q){const d=draftFor(q),r=state.results[q.id],xs=q.baseXs,ys=xs.map(x=>x*x);const val=(key)=>`<input type="text" data-field="${key}" value="${esc(d[key]||'')}" placeholder="?" inputmode="decimal" autocomplete="off" ${r?'disabled':''} class="${r?(r.checks[key]?'correct':'wrong'):''}" aria-label="${key}" />`;
return `<div class="table-wrap"><table class="values-table"><thead><tr><th>Row</th>${xs.map((_,i)=>`<th>Point ${i+1}</th>`).join('')}</tr></thead><tbody><tr><td>Parent x</td>${xs.map(x=>`<td class="parent">${x}</td>`).join('')}</tr><tr><td>Parent y</td>${ys.map(y=>`<td class="parent">${y}</td>`).join('')}</tr><tr><td>New x</td>${xs.map((_,i)=>`<td>${val(`x${i}`)}</td>`).join('')}</tr><tr><td>New y</td>${xs.map((_,i)=>`<td>${val(`y${i}`)}</td>`).join('')}</tr></tbody></table></div>`;}
function choiceHTML(q){const d=draftFor(q),r=state.results[q.id];return `<div class="choices">${q.choices.map((c,i)=>`<button class="choice ${d.choice===i?'sel':''} ${r&&i===q.correct?'is-right':''} ${r&&d.choice===i&&i!==q.correct?'is-wrong':''}" data-action="choice" data-choice="${i}" ${r?'disabled':''}><span class="choice-letter">${'ABCD'[i]}</span><span>${fancy(c)}</span></button>`).join('')}</div>`;}
function svgPlot(q){const cfg=q.type==='plot'?q.params:q.chart;if(!cfg)return '';const isPlot=q.type==='plot',reveal=!!state.results[q.id],d=draftFor(q);const SIZE=480,PAD=38,STEP=(SIZE-2*PAD)/14;
const sx=x=>PAD+(x+7)*STEP,sy=y=>PAD+(7-y)*STEP;
let g=`<svg viewBox="0 0 ${SIZE} ${SIZE}" role="img" aria-label="Cartesian coordinate graph${isPlot?' click to plot points':''}" ${isPlot&&!reveal?'data-action="addpoint" class="plot-interactive"':''}><defs><clipPath id="graphclip"><rect x="${PAD}" y="${PAD}" width="${SIZE-2*PAD}" height="${SIZE-2*PAD}"/></clipPath></defs><rect x="0" y="0" width="480" height="480" fill="#0b1729" rx="10"/>`;
for(let i=-7;i<=7.01;i+=.5){const x=sx(i),y=sy(i),isInt=Math.abs(i-Math.round(i))<.01,zero=Math.abs(i)<.001;g+=`<line x1="${x}" x2="${x}" y1="${PAD}" y2="${SIZE-PAD}" stroke="${zero?'#8191ad':isInt?'#34465f':'#23334a'}" stroke-width="${zero?1.7:isInt?1:.45}"/><line x1="${PAD}" x2="${SIZE-PAD}" y1="${y}" y2="${y}" stroke="${zero?'#8191ad':isInt?'#34465f':'#23334a'}" stroke-width="${zero?1.7:isInt?1:.45}"/>`;}
for(let i=-6;i<=6;i+=2){g+=`<text x="${sx(i)}" y="${sy(0)+15}" font-size="10" fill="#9fb0ce" text-anchor="middle">${i}</text><text x="${sx(0)-9}" y="${sy(i)+3}" font-size="10" fill="#9fb0ce" text-anchor="end">${i}</text>`;}
g+=`<text x="${sx(7)+8}" y="${sy(0)-8}" fill="#aac0d8" font-size="13">x</text><text x="${sx(0)+9}" y="${PAD+4}" fill="#aac0d8" font-size="13">y</text>`;
function curve(a,h,k,color,width,dash){let path='',started=false;for(let x=-7;x<=7.001;x+=.07){let y=a*(x-h)*(x-h)+k;if(y>=-7.6&&y<=7.6){path+=`${!started?'M':'L'} ${sx(x).toFixed(2)} ${sy(y).toFixed(2)} `;started=true;}else started=false;}return `<path d="${path}" fill="none" stroke="${color}" stroke-width="${width}" ${dash?'stroke-dasharray="7 7"':''} stroke-linecap="round" stroke-linejoin="round"/>`;}
g+='<g clip-path="url(#graphclip)">';if(isPlot||cfg.showParent)g+=curve(1,0,0,'#8095b6',2,true);if(!isPlot||reveal)g+=curve(cfg.a,cfg.h,cfg.k,isPlot?'#80dbb2':'#85adff',3.1,false);
if(cfg.mark&&!isPlot){const v=[cfg.h,cfg.k],ax=cfg.anchorX===undefined?cfg.h+1:cfg.anchorX,ap=[ax,cfg.a*(ax-cfg.h)**2+cfg.k];for(const [point,label] of [[v,'V'],[ap,'P']]){g+=`<circle cx="${sx(point[0])}" cy="${sy(point[1])}" r="6.3" fill="#9eecbd" stroke="#092d28" stroke-width="2"/><text x="${sx(point[0])+10}" y="${sy(point[1])-9}" fill="#b6f6d4" font-weight="700" font-size="12">${label}</text>`;}}
if(isPlot){let points=(d.points||[]);for(const [x,y] of points){g+=`<circle cx="${sx(x)}" cy="${sy(y)}" r="6.4" fill="#8eb6ff" stroke="#0d1731" stroke-width="2"/><circle cx="${sx(x)}" cy="${sy(y)}" r="11" fill="transparent"/>`;}if(reveal){for(const [x,y] of targetPoints(q))g+=`<circle cx="${sx(x)}" cy="${sy(y)}" r="4.3" fill="#9de7b4" stroke="#10382d" stroke-width="1"/>`;}}
g+='</g>';if(isPlot&&!reveal)g+=`<rect x="${PAD}" y="${PAD}" width="${SIZE-2*PAD}" height="${SIZE-2*PAD}" fill="transparent"/>`;g+='</svg>';
return `<div class="chartbox">${g}<div class="plot-notes"><span class="legend"><span class="swatch dash"></span> Parent</span>${isPlot?`<span class="legend"><span class="swatch blue"></span> Your points ${((d.points||[]).length)}/5</span>${reveal?'<span class="legend"><span class="swatch green"></span> Correct curve/points</span>':''}`:'<span class="legend"><span class="swatch blue"></span> Transformed curve</span>'}${isPlot&&!reveal?`<span class="plot-actions"><button class="tiny-btn" data-action="undo">Undo</button><button class="tiny-btn" data-action="clearplot">Clear</button></span>`:''}</div></div>`;}
function introHTML(){return `<div class="intro"><span class="eyebrow">THE 60-MINUTE QUADRATICS CHALLENGE</span><h1>Know the method.<br>Own the quiz.</h1><p>One focused practice session for Ontario Grade 10 math (MPM2D). Built from your teacher's lessons 5.1, 5.2, and 5.3, grouped under the five recommended video topics.</p><div class="intro-grid"><div class="intro-stat"><strong>24</strong><span>original questions</span></div><div class="intro-stat"><strong>60</strong><span>minute target</span></div><div class="intro-stat"><strong>5</strong><span>video sections</span></div></div><ul class="intro-list"><li>Answer using numbers, vertex-form equations, or the graph grid.</li><li>Get immediate checks on each answer part.</li><li>See the worked solution right after submitting.</li><li>Leave and return - progress is saved in this browser.</li><li>Finish with a mistake list so you can redo weak skills.</li></ul><button class="btn primary" data-action="start">Start my 60-minute practice \u2192</button><div class="intro-note">No sign-in, external libraries, or internet connection is required to run the quiz file.</div></div>`;}
function problemHTML(){const q=QUESTIONS[state.current],r=state.results[q.id],m=MODULES[q.m],hint=!!state.hints[q.id];const n=state.current+1;const expr=/^(y\s*=|Rule:|a\s*=)/.test(q.prompt);
let answerArea='';if(q.type==='fields')answerArea=fieldHTML(q);else if(q.type==='choice')answerArea=choiceHTML(q);else if(q.type==='table')answerArea=tableHTML(q);else if(q.type==='plot')answerArea=svgPlot(q);
return `${heroHTML()}<section class="problem" aria-label="Question ${n}"><div class="q-top"><span class="pill green">${esc(m.video)}</span><span class="pill">${q.time} min</span><span class="pill ${r?(r.earned===r.total?'green':'gold'):''}">${r?(r.earned===r.total?'Mastered':'Review needed'):'Unattempted'}</span><span class="q-num">${String(n).padStart(2,'0')} / ${QUESTIONS.length}</span></div><h2>${esc(q.title)}</h2>${expr?`<div class="mathbox ${q.prompt.length>55?'small':''}">${fancy(q.prompt)}</div>`:`<div class="q-description" style="font-size:15px;color:#e0eafa;margin:13px 0">${fancy(q.prompt)}</div>`}<p class="q-description">${esc(q.desc)}</p>${q.chart?svgPlot(q):''}${answerArea}${q.type==='plot'?'<p class="graph-feedback">Tap anywhere inside the grid to place a point. Only five points are needed; use Undo to fix one.</p>':''}${!r?`${hint?`<div class="hint"><strong>Hint:</strong> ${fancy(q.hint)}</div>`:''}<div class="action-row"><button class="btn primary" data-action="check">Check my answer \u2192</button><button class="btn ghost" data-action="hint">${hint?'Hide hint':'Need a hint?'}</button></div>`:''}${feedbackHTML(q)}${r?`<div class="action-row"><button class="btn ghost" data-action="retry">Retry this skill</button><button class="btn primary" data-action="next">${n===QUESTIONS.length?'See my results \u2192':'Next question \u2192'}</button></div>`:''}</section><div class="bottomnav"><button class="btn ghost" data-action="prev" ${state.current===0?'disabled':''}>\u2190 Previous</button><span class="bottomnote">Press <span class="keyboard">Enter</span> to check a typed response</span><button class="btn ghost" data-action="next">${n===QUESTIONS.length?'Results':'Skip / Next \u2192'}</button></div>`;}
function summaryHTML(){const p=resultsProgress(),bad=QUESTIONS.filter(q=>!state.results[q.id]||state.results[q.id].earned<state.results[q.id].total),allDone=p.attempted===QUESTIONS.length;return `<section class="summarybox"><span class="eyebrow">YOUR STUDY REPORT</span><h1>${allDone?'Practice complete.':'Your progress so far.'}</h1><p style="color:var(--sub);margin:0">${allDone?'You have seen all 24 worked solutions. Revisit missed skills until you can solve them unaided.':'Your report updates as you go. You can return to any question or resume where you stopped.'}</p><div class="summary-grid"><div class="summary-stat"><b>${p.attempted}/24</b><small>Attempted</small></div><div class="summary-stat"><b>${p.mastered}</b><small>Fully correct</small></div><div class="summary-stat"><b>${p.accuracy}%</b><small>Answered accuracy</small></div></div><div class="action-row" style="margin:16px 0 25px"><button class="btn primary" data-action="resume">Return to practice</button>${bad.length?'<button class="btn ghost" data-action="retrywrong">Retry first missed</button>':''}<button class="btn ghost" data-action="reset">Reset all progress</button></div><h2 style="font-size:18px;margin:25px 0 13px">Question-by-question results</h2><div class="summary-list">${QUESTIONS.map((q,i)=>{let r=state.results[q.id],isMiss=!r||r.earned<r.total;return `<button class="review-row" data-action="goto" data-index="${i}"><div><strong>${String(i+1).padStart(2,'0')}. ${esc(q.title)}</strong><span>Video ${q.m+1} \u00b7 ${esc(MODULES[q.m].name)}</span></div><span class="review-score ${isMiss?'miss':''}">${r?`${r.earned}/${r.total} parts`:'Not started'}</span></button>`;}).join('')}</div></section>`;}
function render(){const main=state.mode==='intro'?introHTML():state.mode==='results'?summaryHTML():problemHTML();const showApp=state.mode==='quiz';app.innerHTML=`<div class="shell"><header class="topbar"><div class="brand"><span class="brandmark">\u2229</span><span>VERTEX<span style="color:var(--mint)">LAB</span></span></div><div class="topright"><span class="toptext">MPM2D \u00b7 Quadratic transformations</span>${state.started?timerHTML():''}<button class="smalllink" data-action="review">My results</button></div></header><div class="layout">${sidebarHTML()}<main class="main">${main}</main>${showApp?rightbarHTML():''}</div><p class="footnote">Built for practice, not an official quiz. Problems align to supplied lessons 5.1-5.3; section labels refer to the five recommended video topics.</p></div>`;updateClock();}
function updateClock(){const el=document.getElementById('clock');if(el)el.textContent=formatTime(3600-elapsed());}
function message(str){let b=document.getElementById('messageToast');if(b)b.remove();b=document.createElement('div');b.id='messageToast';b.setAttribute('role','status');b.textContent=str;b.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff0c8;color:#302718;border-radius:11px;padding:11px 17px;font-size:13px;z-index:99;box-shadow:0 10px 30px #0008;max-width:94vw';document.body.appendChild(b);window.setTimeout(()=>b.remove(),3000);}
function submit(){if(state.mode!=='quiz')return;const q=QUESTIONS[state.current];if(state.results[q.id])return;const d=draftFor(q);let earned=0,total=0,checks={},hasAnswer=false;
if(q.type==='choice'){if(d.choice===undefined){message('Choose an answer first.');return;}hasAnswer=true;total=1;earned=d.choice===q.correct?1:0;}
else if(q.type==='fields'||q.type==='table'){const fs=expectedFields(q);total=fs.length;for(const f of fs){let raw=d[f.id]||'';if(String(raw).trim())hasAnswer=true;const correct=isCorrectField(f,raw);checks[f.id]=correct;if(correct)earned++;}}
else if(q.type==='plot'){const given=d.points||[];if(given.length)hasAnswer=true;const targets=targetPoints(q);total=targets.length;earned=targets.filter(p=>given.some(pt=>Math.abs(pt[0]-p[0])<.01&&Math.abs(pt[1]-p[1])<.01)).length;}
if(!hasAnswer){message(q.type==='plot'?'Place at least one point on the graph first.':'Enter an answer first.');return;}
state.results[q.id]={earned,total,checks,answer:JSON.parse(JSON.stringify(d)),time:Date.now()};save();render();const feedback=document.querySelector('.solved');if(feedback)feedback.scrollIntoView({behavior:'auto',block:'nearest'});}
function goTo(i){if(i<0){state.current=0;}else if(i>=QUESTIONS.length){state.mode='results';save();render();window.scrollTo(0,0);return;}else state.current=i;state.mode='quiz';save();render();window.scrollTo(0,0);}
function retry(){const q=QUESTIONS[state.current];delete state.results[q.id];state.drafts[q.id]={};delete state.hints[q.id];save();render();}
function handleClick(e){const item=e.target.closest('[data-action]');if(!item)return;const a=item.dataset.action;
if(a==='addpoint'){const q=QUESTIONS[state.current];if(q.type!=='plot'||state.results[q.id])return;const svg=item,rect=svg.getBoundingClientRect();let px=(e.clientX-rect.left)*480/rect.width,py=(e.clientY-rect.top)*480/rect.height;const PAD=38,STEP=(480-2*PAD)/14;if(px<PAD||px>480-PAD||py<PAD||py>480-PAD)return;let x=Math.round((px-PAD)/STEP*2)/2-7,y=7-Math.round((py-PAD)/STEP*2)/2;let d=draftFor(q);d.points=d.points||[];let idx=d.points.findIndex(p=>Math.abs(p[0]-x)<.01&&Math.abs(p[1]-y)<.01);if(idx>=0)d.points.splice(idx,1);else if(d.points.length<5)d.points.push([x,y]);else {message('Five points already placed. Use Undo or Clear to change one.');return;}save();render();return;}
if(a==='start'){start();return;}
if(a==='timer'){toggleTimer();return;}
if(a==='module'){const i=+item.dataset.index;let qs=QUESTIONS.map((q,j)=>q.m===i?j:null).filter(i=>i!==null),next=qs.find(j=>!state.results[QUESTIONS[j].id]);if(!state.started)start();goTo(next===undefined?qs[0]:next);return;}
if(a==='goto'){if(!state.started)start();goTo(+item.dataset.index);return;}
if(a==='review'){if(!state.started){state.mode='intro';render();return;}state.mode='results';save();render();window.scrollTo(0,0);return;}
if(a==='resume'){goTo(state.current);return;}
if(a==='choice'){const q=QUESTIONS[state.current];if(state.results[q.id])return;draftFor(q).choice=+item.dataset.choice;save();render();return;}
if(a==='hint'){const q=QUESTIONS[state.current];state.hints[q.id]=!state.hints[q.id];save();render();return;}
if(a==='check'){submit();return;}
if(a==='prev'){goTo(state.current-1);return;}
if(a==='next'){goTo(state.current+1);return;}
if(a==='retry'){retry();return;}
if(a==='undo'||a==='clearplot'){const q=QUESTIONS[state.current];if(q.type!=='plot'||state.results[q.id])return;let points=draftFor(q).points||[];if(a==='undo')points.pop();else points=[];draftFor(q).points=points;save();render();return;}
if(a==='retrywrong'){const idx=QUESTIONS.findIndex(q=>!state.results[q.id]||state.results[q.id].earned<state.results[q.id].total);if(idx>=0){state.current=idx;state.mode='quiz';retry();goTo(idx);}return;}
if(a==='reset'){if(window.confirm('Reset every question, answer, score and the timer?')){state=freshState();save();render();}return;}
}
document.addEventListener('click',handleClick);
document.addEventListener('input',e=>{const input=e.target.closest('[data-field]');if(!input||state.mode!=='quiz')return;const q=QUESTIONS[state.current];if(state.results[q.id])return;draftFor(q)[input.dataset.field]=input.value;save();});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.shiftKey||e.ctrlKey||e.altKey)return;if(e.target&&e.target.matches('input[data-field]')&&state.mode==='quiz'){e.preventDefault();submit();}});
window.addEventListener('visibilitychange',save);window.setInterval(()=>{updateClock();if(state.running)save();},1000);
render();
</script>
</body>
</html>
