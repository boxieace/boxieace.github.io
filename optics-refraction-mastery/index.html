ster n = c/v and Snell calculations, especially angles measured from the surface.</span></div></div><div class="studyline">${btn('Go to Day 1 lessons','lesson0','soft')}</div></div><div class="card"><span class="pill">Day 2 · Exam-proof it</span><div class="steps" style="margin-top:15px"><div class="step"><span class="num">1</span><span>Finish TIR, apparent depth, water/oil, and ALL five phenomena lessons.</span></div><div class="step"><span class="num">2</span><span>Use adaptive mixed practice until weak topics turn green.</span></div><div class="step"><span class="num">3</span><span>Take the 35-question mock; redo missed types; take a second mock.</span></div></div><div class="studyline">${btn('Start mixed practice','mixed','soft')}</div></div></div><div class="section-head"><div><span class="caps">VIDEO FIRST · DRILL IMMEDIATELY</span><h2>Seven stages. Every teacher-listed topic.</h2></div></div><div class="grid three">${chapters.map((ch,i)=>`<div class="card module-card" data-lesson="${i}"><div class="modtop"><span class="module-number">STAGE ${ch.num}</span><span class="module-icon">${ch.icon}</span></div><h3>${esc(ch.title)}</h3><p>${esc(ch.desc)}</p><span class="mini-meta">${ch.duration} · ${ch.tags.length} skills →</span></div>`).join('')}</div><div class="section-head"><div><span class="caps">ADAPTIVE STUDY</span><h2>${weak?'Most useful topic to review next':'Your recall engine'}</h2></div></div><div class="card"><p class="muted" style="margin-bottom:12px">${weak?`Your lowest-performing area is <b>${esc(T[weak])}</b>. Practice adds missed and weak skills more often without repeating identical stems every time.`:'As you practice, the site saves correct and incorrect attempts and prioritizes your weaker topics automatically.'}</p><div class="row">${btn('Drill weak topics','weak','primary')}${btn('Inspect complete quiz checklist','coverage','ghost')}</div></div>${foot()}`}
const lessonNotes={
bend:`<h3>What must be automatic</h3><ul><li><b>Refraction</b> is a change in light’s direction at a boundary because its speed changes. A ray striking <b>along the normal (0°)</b> changes speed without bending.</li><li><b>The normal</b> is an imaginary line at 90° to the surface. Both incidence and refraction angles are measured <b>from the normal</b>.</li><li><b>FAST = Faster → Away; Slower → Towards.</b> Air → water → glass means increasing refractive index, lower speed, and bending toward the normal (unless 0°).</li><li><b>At a boundary</b> some light can be reflected and some can be transmitted (refracted). Reflection obeys θᵢ = θᵣₑ𝒻ₗ.</li><li><b>Two parallel surfaces:</b> air → glass → air means toward the normal on entry, away on exit; the outgoing ray is parallel to the incoming ray but offset.</li></ul><div class="lesson-notes-callout"><b>Worksheet connections:</b> Q1–7, Q12–14, Q20–21; Lesson 8 slides 4–16; homework Part 1 diagrams.</div>`,
index:`<h3>Four things your calculator must do</h3><ul><li><b>Index of refraction:</b> <span class="formula">n = c / v</span>. The index <b>has no unit</b>. c = 3.00 × 10⁸ m/s.</li><li><b>Speed:</b> <span class="formula">v = c / n</span>. Example: water n=1.33 → v ≈ 2.26 × 10⁸ m/s.</li><li><b>Snell’s law, general form:</b> <span class="formula">n₁ sin θ₁ = n₂ sin θ₂</span>. For <b>air → other medium</b> only (n₁≈1): n₂ = sin θᵢ / sin θᵣ.</li><li><b>Find refracted angle:</b> <span class="formula">θ₂ = sin⁻¹[(n₁/n₂) sin θ₁]</span>. Put your calculator in <b>degree mode</b> and use inverse sine, not reciprocal sine.</li><li><b>Optical density:</b> higher n = slower light = more optically dense. It is <b>not</b> the same thing as mass density.</li><li><b>60° to the surface</b> means 30° to the normal; subtract from 90° before using Snell’s law.</li></ul><div class="formula-card"><div class="caps">Worked example: honey</div>Incident ray makes 60° with the <em>surface</em> → θᵢ = 30° to the normal. Refraction angle is 19.5°. n = sin30° ÷ sin19.5° ≈ <b>1.50</b>.</div><div class="lesson-notes-callout"><b>Worksheet connections:</b> Q8–16; Lesson 8 slides 19–28; homework Part 2 Q1–8.</div>`,
rays:`<h3>Every ray sketch in four moves</h3><ol><li>Mark the boundary and add a <b>dotted normal</b> exactly perpendicular to it.</li><li>Write <b>n₁</b> and <b>n₂</b> next to the media; compare them.</li><li>Determine <b>towards / away / straight / total internal reflection</b>.</li><li>Draw the new ray with an <b>arrow pointing in the direction light travels</b>, and label the correct angles from the normal.</li></ol><p><b>Four key pictures:</b> air→glass (toward), water→air (away, if below critical), air→glass→air (outgoing parallel), glass→air above critical (reflection only).</p><div class="lesson-notes-callout"><b>Connection:</b> Homework Part 1 includes six boundary cases and rays emerging from slabs. They are the pattern for the interactive ray drawing drills.</div>`,
tir:`<h3>The full critical-angle progression</h3><ul><li><b>Below critical angle:</b> a refracted ray leaves the denser optical medium and a reflected ray may remain.</li><li><b>At critical angle:</b> the refracted ray skims along the boundary (90° from the normal); this is the limiting case.</li><li><b>Above critical angle:</b> total internal reflection. All light is reflected in the ideal ray model.</li><li><b>Two conditions:</b> (1) travel <b>higher n → lower n</b>; (2) incidence angle <b>strictly greater than</b> the critical angle.</li><li><b>Critical angle:</b> sin θ꜀ = n₂ / n₁ (only n₁ &gt; n₂). Water→air ≈ <b>48.8°</b>; glass (n=1.50)→air ≈ <b>41.8°</b>; diamond→air ≈ <b>24.4°</b>.</li><li><b>Diamonds:</b> high n and cut facets keep many rays reflecting inside before exiting. Dispersion gives coloured flashes.</li><li><b>Optical fibres:</b> higher-n core surrounded by lower-n cladding guides light by repeated total internal reflection.</li></ul><div class="notice"><b>Source precision:</b> Some Lesson 8 slides say “equal or greater” for TIR. The exact optics distinction is <b>at = refracted ray along the surface; greater = TIR</b>. Your completed worksheet also teaches this distinction.</div><div class="lesson-notes-callout"><b>Worksheet connections:</b> Q20–25; Lesson 8 slides 29–41; homework Part 3 Q1–4.</div>`,
seeing:`<h3>Why objects appear where they aren't</h3><ul><li><b>Apparent depth:</b> light from underwater travels water→air, refracts <b>away</b> from the normal; your eye traces the outgoing ray backward in a straight line. A submerged object looks <b>shallower</b> than it really is.</li><li><b>Shorter legs:</b> submerged legs appear raised because the eye places their image closer to the water’s surface.</li><li><b>Goggles and face masks:</b> a flat water–glass–air interface makes objects appear closer and thus approximately <b>one-third larger</b> underwater.</li><li><b>Metal bar behind glass:</b> refraction at two parallel boundaries laterally shifts the emerging rays and makes the covered segment appear displaced.</li><li><b>Water/oil investigations:</b> water n≈1.33 and vegetable/corn oil n≈1.47. A ray entering oil from air bends more toward the normal than the same ray entering water, at identical incidence angles.</li></ul><div class="notice"><b>Missing source detail:</b> Your quiz sheet names an “investigation on refraction in water/oil,” but no separate investigation handout or experimental measurements were uploaded. The site covers the underlying physics and expected comparisons, not invented lab-specific observations or procedures.</div><div class="lesson-notes-callout"><b>Worksheet connections:</b> Q17–19; Lesson 8 slides 42–46; homework Part 1 Q3–4; teacher checklist (water/oil investigation).</div>`,
world:`<h3>Five phenomena the quiz explicitly names</h3><ul><li><b>Dispersion:</b> a prism separates white light into colours because the refractive index varies with wavelength; colours bend by different amounts (violet generally more than red in glass).</li><li><b>Rainbows:</b> sunlight refracts and disperses when entering droplets, reflects internally, then refracts again when leaving. The primary rainbow involves <b>internal reflection</b> and does not generally require total internal reflection.</li><li><b>Mirages:</b> hot air near a road has a different refractive index than cooler air above it. Light bends continuously through the temperature gradient so the sky may appear as a puddle.</li><li><b>Apparent sunrise / delayed sunset:</b> the atmosphere’s varying index bends sunlight into your line of sight when the actual Sun is still slightly below the horizon.</li><li><b>Apparent depth:</b> underwater objects look closer to the surface; covered again here because it is a phenomena topic on the teacher sheet.</li></ul><div class="notice"><b>Terminology note:</b> Your lesson materials link rainbows and mirages to TIR. They are definitely refraction phenomena, but a <b>primary rainbow relies on partial internal reflection</b>; atmospheric mirages are best explained by a refractive-index gradient and may involve a limiting turning path. This course distinguishes the classroom simplification from the more precise explanation.</div><div class="lesson-notes-callout"><b>Lesson 8 sources:</b> slides 42–48 show dispersion, mirage, apparent depth, sunrise, and rainbows. The teacher’s quiz sheet lists every one.</div>`,
final:`<h3>How to prove you’re ready</h3><ol><li>Score at least <b>85%</b> on one 35-question mock, then aim for <b>90%+</b> on a different mock.</li><li>Draw air→glass, water→air, glass slab, and above-critical rays without seeing the solution.</li><li>Calculate n from speed, speed from n, n from two angles, and refracted angle with degrees on.</li><li>Explain rainbow, mirage, sunrise, dispersion, apparent depth, diamond and fibre optics in one or two sentences each.</li><li>Complete weak-topic drills until every major topic turns green (three correct responses and a two-answer streak).</li></ol><div class="lesson-notes-callout">The full mock samples all teacher-listed topic categories, including phenomena and diagram interpretation.</div>`
};
function segline(x1,y1,x2,y2,color='#177bba',width=4,dash=''){let a=Math.atan2(y2-y1,x2-x1),sz=Math.min(11,width*2.5);let xx=x2-sz*Math.cos(a),yy=y2-sz*Math.sin(a);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/><polygon points="${x2},${y2} ${xx+sz*.36*Math.sin(a)},${yy-sz*.36*Math.cos(a)} ${xx-sz*.36*Math.sin(a)},${yy+sz*.36*Math.cos(a)}" fill="${color}"/>`}
function raySVG({n1=1,n2=1.33,i=40,from='top',show=true,output='actual',compact=false,interactive=false}={}){
 let m=rayMath(n1,n2,i),s=from==='top'?-1:1,x=280,y=132,len=105;
 let x0=x-len*Math.sin(i*DEG),y0=y+s*len*Math.cos(i*DEG);
 let outType=output==='actual'?m.type:output;
 let a=output==='toward'?Math.max(5,i*.52):output==='away'?Math.min(85,i+22):output==='straight'?i:output==='reflect'?i:output==='critical'?90:m.a;
 let same=outType==='tir'||outType==='reflect',x2=x+len*Math.sin(a*DEG),y2=y+(same?s:-s)*len*Math.cos(a*DEG);
 if(outType==='critical') y2=y;
 let topN=from==='top'?n1:n2,botN=from==='top'?n2:n1;
 const tag=(val,tx,ty)=>`<text x="${tx}" y="${ty}" font-size="13" fill="#4f6c81" font-weight="750">${val}</text>`;
 return `<svg ${interactive?'id="rayBoard" class="ray-play"':''} viewBox="0 0 560 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ray diagram. Top medium n ${topN}, bottom medium n ${botN}, incident ray angle ${i} degrees."><rect width="560" height="132" fill="#f3f9fd"/><rect y="132" width="560" height="138" fill="#d6eef1"/><line x1="0" y1="132" x2="560" y2="132" stroke="#3c6b86" stroke-width="2"/><line x1="280" y1="16" x2="280" y2="256" stroke="#798e9a" stroke-width="1.8" stroke-dasharray="7,6"/>${tag('top: n = '+neat(topN,2),14,24)}${tag('bottom: n = '+neat(botN,2),14,256)}<text x="293" y="24" fill="#667f8e" font-size="13">normal</text>${segline(x0,y0,x,y,'#2c75c0',3.8)}${!interactive&&show?segline(x,y,x2,y2,'#0da49c',4.5):''}${interactive&&rayPoint?segline(x,y,rayPoint.x,rayPoint.y,'#f4a13f',4.5):''}<circle cx="280" cy="132" r="4.5" fill="#1d5671"/>${tag('θᵢ = '+neat(i,0)+'°',x-98,from==='top'?90:185)}${!interactive&&show?tag(outType==='tir'?'reflection':outType==='critical'?'along boundary':'refraction',Math.min(x2+13,460),Math.max(25,Math.min(y2,249))):''}${interactive?'<text x="280" y="255" text-anchor="middle" font-size="11" fill="#627d8e">Drag from the intersection to draw the outgoing ray</text>':''}</svg>`;
}

"formula">n₁ sin θ₁ = n₂ sin θ₂</span></div>`:''}</div></div><div class="section-head"><div><span class="caps">${ch.videos.length?'03':'02'} · PROVE IT</span><h2>Checkpoint: ${ch.title}</h2><p>10 clear questions with diagrams, calculations, fill-ins and immediate explanations.</p></div></div><div class="card" style="display:flex;align-items:center;gap:15px;flex-wrap:wrap"><div style="flex:1"><h3>Can you do this without the notes?</h3><p class="muted small" style="margin:0">Missed skills return as bonus questions. Mastery needs three correct examples, including two consecutive successes.</p></div>${btn('Begin 10-question checkpoint','chapterquiz','primary')}</div>${foot()}`}
const bank=[];let qserial=0;
function addMC(tag,text,options,answer,why,figure='',source='Lesson 8'){bank.push({id:'q'+(++qserial),kind:'mc',tag,text,options,answer,why,figure,source})}
function addFill(tag,text,answer,aliases,why,source='Lesson 8'){bank.push({id:'q'+(++qserial),kind:'fill',tag,text,answer,aliases:[answer,...(aliases||[])].map(x=>x.toLowerCase()),why,source})}
function addCalc(tag,text,answer,unit,work,source='Lesson 8',tolerance=.021){bank.push({id:'q'+(++qserial),kind:'calc',tag,text,answer,unit,why:work,source,tolerance})}
function addMatch(tag,text,pairs,why,source='Lesson 8',diagram=''){bank.push({id:'q'+(++qserial),kind:'match',tag,text,pairs,why,source,diagram})}
function addRay(n1,n2,i,from,tag='raydraw'){let m=rayMath(n1,n2,i);let typ=m.type==='tir'?'a reflected ray':m.type==='critical'?'a ray along the surface':'the refracted ray';bank.push({id:'q'+(++qserial),kind:'ray',tag,text:`Light travels from n = ${neat(n1,2)} to n = ${neat(n2,2)} with incidence ${neat(i,1)}° from the normal. Drag to sketch ${typ} in the correct half-plane.`,n1,n2,i,from,why:m.type==='tir'?`The incident angle is above the ${neat(m.critical,1)}° critical angle, so total internal reflection sends the ray back into the starting medium at the same angle.`:m.type==='critical'?`At the critical angle, the refracted ray travels along the boundary at 90° from the normal.`:`Snell: θ₂ = sin⁻¹((${neat(n1,2)}/${neat(n2,2)}) × sin ${neat(i,1)}°) = ${neat(m.a,1)}°. The ray ${n2>n1?'bends toward':'bends away from'} the normal.`,source:'Lesson 8 slides 11–16, 29–38; ray-sketch homework'})}
function addChoose(n1,n2,i,from,tag='fastslow'){let m=rayMath(n1,n2,i),ans=m.type==='tir'?'reflect':m.type==='critical'?'critical':n2>n1?'toward':'away';bank.push({id:'q'+(++qserial),kind:'choose',tag,text:`Which ray diagram is correct when light goes from n = ${neat(n1,2)} into n = ${neat(n2,2)} with incidence ${neat(i,0)}°?`,n1,n2,i,from,options:['toward','away','straight','reflect'],answer:ans,why:m.type==='tir'?`Higher n → lower n, and ${neat(i,0)}° is greater than critical (${neat(m.critical,1)}°). The ray totally reflects.`:m.type==='critical'?`At the critical angle, the transmitted ray travels along the surface.`:`Because the second index is ${n2>n1?'higher':'lower'}, light ${n2>n1?'slows and bends toward':'speeds up and bends away from'} the normal.`,source:'Lesson 8 slides 12–16'})}

}

function resetQuestion(){picked=null;locked=false;showHint=false;matchState={};matchSelected=null;rayPoint=null;lastRayResult=null;if(activeQuestion){activeQuestion.uiOrder=activeQuestion.uiOrder||shuffle(activeQuestion.kind==='mc'?[0,1,2,3]:activeQuestion.kind==='choose'?['toward','away','straight','reflect']:activeQuestion.kind==='match'?activeQuestion.pairs.map((p,i)=>i):[]);activeQuestion.rightOrder=activeQuestion.rightOrder||shuffle(activeQuestion.kind==='match'?activeQuestion.pairs.map((p,i)=>i):[]);}}
function checkFeedback(q,result){let correctText='';if(q.kind==='mc')correctText=q.options[q.answer];else if(q.kind==='choose')correctText=({toward:'Bends TOWARD the normal',away:'Bends AWAY from normal',straight:'Continues straight',reflect:'Total internal reflection',critical:'Along the surface'})[q.answer];else if(q.kind==='calc')correctText=neat(q.answer,q.unit==='degrees'&&q.tolerance>.1?1:2)+' '+q.unit;else if(q.kind==='fill')correctText=q.answer;else if(q.kind==='ray')correctText='Draw the teal ray as shown below';else correctText='See the correct mapping in the explanation.';return `<div class="feedback ${result?'':'wrong'}" aria-live="polite"><strong>${result?'✓ That’s correct — keep going.':'✗ Not quite. Fix the reasoning.'}</strong><p>${!result?`<b>Expected:</b> ${esc(correctText)}.<br>`:''}${esc(q.why)}</p>${!result&&q.kind==='ray'?`<div class="visual" style="margin-bottom:0">${raySVG({n1:q.n1,n2:q.n2,i:q.i,from:q.from,show:true})}</div>`:''}</div>`}
function questionVisual(q){if(q.kind==='ray')return `<div class="visual">${raySVG({n1:q.n1,n2:q.n2,i:q.i,from:q.from,show:locked,interactive:!locked})}<div class="ray-toolbar"><span class="small muted">${locked?'Compare your amber ray to the teal solution.':'Touch or drag from the centre toward your predicted outgoing ray.'}</span><span class="numberchip">Aim within 12° of the correct direction</span></div></div>`;

 if(q.kind==='mc'&&q.figure){if(['ray','ray0','tir'].includes(q.figure))return `<div class="visual">${raySVG(q.figure==='tir'?{n1:1.5,n2:1,i:42,from:'bottom',show:false}:q.figure==='ray0'?{n1:1,n2:1.5,i:0,show:false}:{n1:1,n2:1.33,i:38,show:false})}</div>`;

function slabSVG(){return `<svg viewBox="0 0 560 200"><rect width="560" height="200" fill="#f4f9fc"/><rect x="218" y="20" width="140" height="160" fill="#d3eaf1" stroke="#abc7d4"/><line x1="180" y1="60" x2="435" y2="60" stroke="#9fb3c1" stroke-dasharray="6 5"/><line x1="180" y1="140" x2="435" y2="140" stroke="#9fb3c1" stroke-dasharray="6 5"/>${segline(87,150,218,91,'#267ab5',4)}${segline(218,91,358,57,'#267ab5',4)}${segline(358,57,488,0,'#267ab5',4)}<text x="16" y="30" font-size="13" fill="#608092">air</text><text x="253" y="30" font-size="13" fill="#608092">glass</text><text x="458" y="30" font-size="13" fill="#608092">air</text></svg>`}
function questionControls(q){if(q.kind==='mc'){return `<div class="answer-grid">${q.uiOrder.map((orig,pos)=>{let chosen=picked===orig,correct=locked&&orig===q.answer,wrong=locked&&chosen&&orig!==q.answer;return `<button class="answer ${chosen?'selected':''} ${correct?'correct':''} ${wrong?'incorrect':''}" data-mcq="${orig}" ${locked?'disabled':''}><span class="letter">${'ABCD'[pos]}</span><span>${esc(q.options[orig])}</span></button>`}).join('')}</div>`}

function renderQuiz(){if(!quiz)return '';if(quiz.ended)return renderResults();let q=activeQuestion,done=quiz.pos,percent=Math.round((done/quiz.questions.length)*100),last=quiz.results[quiz.results.length-1];return `<div class="qboard"><div class="row" style="justify-content:space-between;align-items:center"><span class="caps">${esc(quiz.title)}</span><button class="btn ghost small" data-action="leavequiz">Exit session</button></div><div class="progress-row"><span>Question ${done+1} of ${quiz.questions.length}</span><span>${percent}% complete ${quiz.mode==='mock'?'<span id="timer" style="margin-left:10px">⏱ 00:00</span>':''}</span></div><div class="progress-track" style="margin:8px 0 20px"><div class="fill" style="width:${percent}%"></div></div><div class="card"><div class="row" style="justify-content:space-between"><span class="chip">${esc(T[q.tag]||q.tag)}</span><span class="small muted">${({mc:'Multiple choice',choose:'Pick the ray',calc:'Calculate',fill:'Fill the blank',match:'Match & label',ray:'Draw the ray'})[q.kind]}</span></div><div class="quiz-question">${esc(q.text)}</div>${questionVisual(q)}${questionControls(q)}${showHint&&!locked?`<div class="hint"><b>Hint:</b> ${esc(hint(q))}</div>`:''}${locked?checkFeedback(q,last?.correct):''}<div class="qfooter"><div class="row">${!locked&&quiz.mode!=='mock'?`<button class="btn small ghost" data-action="hint">${showHint?'Hint shown':'Need a hint?'}</button>`:''}<span class="question-source">${esc(q.source)}</span></div>${locked?btn(done===quiz.questions.length-1?'Finish & see report →':'Next question →','next','primary'):btn('Check answer','check','primary')}</div></div></div>`}
function hint(q){if(q.kind==='calc')return 'Write the relationship you need first, substitute the numbers, and check that your calculator is in degrees for trigonometry.';if(q.kind==='ray'||q.kind==='choose')return 'Compare the two refractive indices before you decide how far the outgoing ray sits from the dotted normal.';if(q.tag==='tir'||q.tag==='critical')return 'Check both the starting medium and how the incidence angle compares with the limiting angle.';if(['mirages','rainbows','sunrise','dispersion'].includes(q.tag))return 'Try to identify what the light is travelling through and whether it is bending, reflecting or separating into colours.';if(q.kind==='match')return 'Start with the simplest pair you know, then eliminate those possibilities from the others.';return 'Visualize the boundary and describe which ray or material the question is about.'}
function readChoice(q){if(q.kind==='fill'||q.kind==='calc'){let x=document.querySelector('#answerinput');picked=x?x.value:picked}if(q.kind==='mc'||q.kind==='choose'){if(picked===null)return null;return picked}if(q.kind==='ray')return rayPoint;if(q.kind==='match')return Object.keys(matchState).length===q.pairs.length?matchState:null;return picked}
function check(){if(!quiz||locked)return;let q=activeQuestion,x=readChoice(q);if(x===null||x===undefined||x===''||(q.kind==='calc'&&!String(x).trim())){toast('Choose or enter an answer first.');return}let good=false;

if(q.kind==='fill'){let v=String(x).trim().toLowerCase().replace(/[.!?]/g,'').replace(/\s+/g,' ');good=q.aliases.includes(v)}

let t=state.trials[q.tag]||{correct:0,wrong:0,streak:0};if(good){t.correct++;t.streak++;t.uniqueCorrect=t.uniqueCorrect||[];if(!t.uniqueCorrect.includes(q.id))t.uniqueCorrect.push(q.id);state.retry=state.retry.filter(a=>a.id!==q.id);if(t.streak>=2){let j=state.retry.findIndex(a=>a.tag===q.tag);if(j>=0)state.retry.splice(j,1)}}else{t.wrong++;t.streak=0;if(!state.retry.some(x=>x.id===q.id))state.retry.push({id:q.id,tag:q.tag});if(quiz.mode!=='mock'&&(quiz.bonus||0)<5){let alternatives=bank.filter(item=>item.tag===q.tag&&!quiz.questions.some(other=>other.id===item.id));if(alternatives.length){quiz.questions.splice(Math.min(quiz.pos+3,quiz.questions.length),0,shuffle(alternatives)[0]);quiz.bonus=(quiz.bonus||0)+1}}}
state.trials[q.tag]=t;state.history.push({id:q.id,tag:q.tag,text:q.text,correct:good,at:Date.now()});state.history=state.history.slice(-130);save();document.querySelector('#view').innerHTML=renderQuiz();updateGlobal();if(quiz.mode==='mock')tickClock();}

function renderResults(){let n=quiz.results.length,corr=quiz.results.filter(x=>x.correct).length,score=Math.round(corr/n*100),elapsed=Math.round((Date.now()-quiz.startedAt)/60000),wrongs=quiz.results.filter(x=>!x.correct),unique=Array.from(new Set(wrongs.map(x=>x.tag)));return `<div class="qboard"><span class="caps">SESSION COMPLETE</span><h1 style="font-size:45px;margin-top:8px">${score>=90?'Strong work.':score>=75?'Good progress. Keep refining.':'Good diagnostic. Now fix the gaps.'}</h1><p class="muted">The goal isn't a single lucky score—it's reliably explaining the diagrams and getting variations right.</p><div class="grid three" style="margin:19px 0"><div class="card"><div class="metric">${score}%</div><div class="metric-label">Your score</div></div><div class="card"><div class="metric">${corr}/${n}</div><div class="metric-label">Correct answers</div></div><div class="card"><div class="metric">${elapsed} min</div><div class="metric-label">Approximate elapsed time</div></div></div><div class="card"><h3>What to study next</h3>${unique.length?`<p class="muted small">You missed one or more questions in these topics:</p><div class="row" style="margin:12px 0 19px">${unique.map(t=>`<span class="chip">${esc(T[t])}</span>`).join('')}</div>`:'<p style="color:var(--green);font-weight:700">Perfect session! Try new numeric combinations and a second mock for consistency.</p>'}<div class="row">${btn('Redo weak topics','weak','primary')}${btn('Try another mixed set','mixed','soft')}${btn('Study videos','lesson0','ghost')}</div></div><div class="section-head"><div><span class="caps">QUESTION REVIEW</span><h2>How you performed</h2></div></div><div class="card">${quiz.results.map((r,i)=>{let q=bank.find(q=>q.id===r.id);return `<div style="display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #e4edf0"><span style="font-weight:850;color:${r.correct?'#14815c':'#c45457'}">${r.correct?'✓':'✗'}</span><div style="flex:1"><b class="small">${i+1}. ${esc(T[r.tag])}</b><div class="sm
