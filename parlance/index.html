function updateChrome(){const n=completedCount();$('#side-meter').style.width=`${100*n/60}%`;$('#side-completed').textContent=`${n} / 60 lessons`;$('#side-percent').textContent=`${Math.round(n/60*100)}%`;$('#top-day').textContent=`Day ${pad(ui.lessonDay)} / 60`;$('#breadcrumb').textContent=({dashboard:'YOUR SPEAKING HOME',journey:'YOUR 60-DAY JOURNEY',lesson:'DAILY TRAINING ROOM',stories:'ORIGINAL READING LIBRARY',reader:'BILINGUAL STORY READER',sounds:'FRENCH PHONETICS LAB',sound:'SOUND COACH',arena:'SPEAKING ARENA',phrasebook:'SPACED REVIEW CARDS',progress:'YOUR LEARNING DATA',settings:'AUDIO & PRIVACY SETTINGS'})[ui.route]||'PARLANCE';$$('.side-link').forEach(b=>b.classList.toggle('active',b.dataset.route===(ui.route==='reader'?'stories':ui.route==='sound'?'sounds':ui.route)));}

function statCard(glyph,n,label){return `<div class="stat-card"><div class="stat-icon">${glyph}</div><div class="stat-number">${E(String(n).replace(/<[^>]*>/g,''))}</div><div class="stat-label">${E(label)}</div></div>`}

<div class="grid-two"><div>${sectionHead('Your next lesson',`Day ${d.day} • ${d.level} • ${d.unit}`)}<div class="featured-day"><span class="pill mint">DAY ${pad(d.day)} · 30 MINUTES</span><h2>${E(d.title)}</h2><p>${E(d.story[0].fr)}<br><span style="color:#7d907a">${E(d.story[0].en)}</span></p><div class="tag-rows"><span class="pill">${E(bySound(d.soundId).label)}</span><span class="pill">7 bilingual sentences</span><span class="pill">Speaking test</span></div><div class="btn-group" style="margin-top:19px">${button('Open training room →','open-day',{day:d.day},'btn btn-primary')}${button('Read the story','open-story',{day:d.day},'btn btn-outline')}</div></div></div><div>${sectionHead('Your 30-minute formula','Six small steps; repeat every day.')}<div class="card">${STAGES.map((x,i)=>`<div class="timeline-item"><span class="timeline-index">${pad(i+1)}</span><div style="flex:1"><strong>${E(x[0])}</strong><small>${['Mouth placement and high-frequency sounds','Hear the contrast, choose what you heard','Listen, imitate, and check the transcript','Read the story aloud with English translations','Respond to a real-life conversation','Quick understanding check and reflection'][i]}</small></div><span class="pill">${x[1]}</span></div>`).join('')}</div></div></div>

function renderJourney(){const done=completedCount();ROOT.innerHTML=`<div class="head-row"><div><div class="eyebrow">THE ROADMAP</div><h1>Every day has a destination.</h1><p>Open any lesson. Your progress is saved in this browser—no accounts, pressure, or artificial locks.</p></div><div class="pill mint">${done} of 60 complete</div></div><div class="week-list">${Array.from({length:9},(_,w)=>{const part=DAYS.slice(w*7,w*7+7);if(!part.length)return'';const hits=part.filter(d=>dayIsDone(d.day)).length;return `<section class="week-card"><div class="week-header"><div><span class="eyebrow">WEEK ${pad(w+1)}</span><strong>${E(part[0].unit)}</strong><small>Days ${part[0].day}–${part.at(-1).day} • ${part[0].level} to ${part.at(-1).level}</small></div><span class="pill mint">${hits}/${part.length} finished</span></div><div class="day-grid">${part.map(d=>`<button class="day-tile ${dayIsDone(d.day)?'complete':''} ${d.day===ui.lessonDay?'current':''}" data-action="open-day" data-day="${d.day}" aria-label="Open day ${d.day}: ${E(d.title)}"><span class="number">DAY ${pad(d.day)} ${dayIsDone(d.day)?'<span class="checkmark">✓</span>':''}</span><span class="day-title">${E(d.title)}</span><span class="tiny-level">${E(d.level)}</span></button>`).join('')}</div></section>`}).join('')}</div>`;}

 your jaw and throat relaxed.</p><div class="btn-group">${d.day>1?button('← Previous','open-day',{day:d.day-1},'btn btn-sm btn-soft'):''}${d.day<60?button('Next day →','open-day',{day:d.day+1},'btn btn-sm btn-soft'):''}</div></div></aside></div>`;renderStage();}
function stageTitle(number,title,desc){return `<div class="stage-caption">STEP ${pad(number+1)} / 06 <span class="inline-dot"></span> ${STAGES[number][1].toUpperCase()}</div><div class="stage-top"><div><h2>${E(title)}</h2><p>${E(desc)}</p></div><span class="level-mark">DAY ${pad(ui.lessonDay)}</span></div>`}

function renderStage(){const d=byDay(ui.lessonDay),s=bySound(d.soundId),container=$('#stage-slot');if(!container)return;let html='';if(ui.stage===0)html=renderWarmup(d,s);else if(ui.stage===1)html=renderDailyEar(d,s);else if(ui.stage===2)html=renderShadow(d,s);else if(ui.stage===3)html=renderDailyStory(d,s);else if(ui.stage===4)html=renderDialogue(d,s);else html=renderExit(d,s);container.innerHTML=`<div class="stage-body">${html}</div>`;$$('.stage-btn').forEach((b,i)=>b.classList.toggle('active',i===ui.stage));$$('.aside-step').forEach((b,i)=>{b.classList.toggle('active',i===ui.stage);b.classList.toggle('checked',i<ui.stage)});}
function renderWarmup(d,s){return `${stageTitle(0,'Train the mouth before the mind','Do these slowly. Accuracy and relaxed movement beat volume or speed.')}

function ensureEar(soundId,origin){if(ui.ear?.soundId===soundId&&ui.ear?.origin===origin)return;ui.ear={soundId,origin,count:0,correct:0,answer:null,question:null};newEarQuestion()}

function cardPriority(p){const data=state.cards[p.id]||{};let due= num(data.due,0)<=Date.now()?1:-2;let difficulty=num(data.wrong,0)*10;let age=!data.seen?4:0;return difficulty+due+age+(p.category==='Classroom'?2:0)}
function makeFlashQueue(){let all=accessibleCards();const due=all.filter(p=>num(state.cards[p.id]?.due,0)<=Date.now());const pool=due.length?due:all;pool.sort((a,b)=>cardPriority(b)-cardPriority(a)+(Math.random()-.5)*2);ui.flashQueue=pool.map(p=>p.id).slice(0,45);ui.flashCurrent=ui.flashQueue.shift()||null;ui.flashRevealed=false;ui.flashSessionCount=0;ui.flashSessionCorrect=0;ui.flashSeen=[];ui.flashStarted=true;}

 case 'flash-reveal':ui.flashRevealed=!ui.flashRevealed;renderPhrasebook();break;
 case 'flash-grade':{if(!ui.flashRevealed)break;const id=ui.flashCurrent;if(!id)break;const grade=ds.grade,now=Date.now(),before=state.cards[id]||{seen:0,wrong:0,streak:0,box:0,due:0};const c={...before};c.seen=num(c.seen)+1;c.last=now;ui.flashSessionCount++;if(grade==='again'){c.wrong=num(c.wrong)+1;c.streak=0;c.due=now;ui.flashQueue.splice(Math.min(3,ui.flashQueue.length),0,id)}else{ui.flashSessionCorrect++;c.streak=num(c.streak)+1;if(grade==='easy')c.streak=2;if(c.streak>=2){c.streak=0;c.box=clamp(num(c.box)+1,1,5);const gaps=[0,2,4,7,14,30];c.due=now+gaps[c.box]*86400000}else{c.due=now;ui.flashQueue.splice(Math.min(4,ui.flashQueue.length),0,id)}}state.cards[id]=c;save();ui.flashCurrent=ui.flashQueue.shift()||null;ui.flashRevealed=false;renderPhrasebook();break;}
 case 'export-progress':exportProgress();break;
 case 'import-open':importProgress();break;
 case 'reset-progress':if(confirm('Delete ALL PARLANCE progress from this browser? This cannot be undone unless you exported a backup.')){if(confirm('Confirm permanent reset of completed days, speech logs, cards and notes?')){pauseTimer();state=defaults();ui.lessonDay=1;ui.translations=true;ui.flashCurrent=null;ui.flashQueue=[];ui.flashStarted=false;save();navigate('dashboard');toast('Local progress was cleared.')}}break;
 case 'reload-voices':refreshVoices();toast('Voice list refreshed.');break;
 default:break;
}}
function onChange(e){const node=e.target;switch(node.id){
 case 'locale-setting':state.settings.locale=node.value;save();toast(`French practice language changed to ${node.value}.`);break;
 case 'french-voice':state.settings.voiceURI=node.value;save();break;
 case 'english-voice':state.settings.englishVoiceURI=node.value;save();break;
 case 'show-translations':ui.translations=node.checked;state.settings.translations=node.checked;save();break;
 case 'story-filter':ui.storyFilter=node.value;$('#library-results').innerHTML=storyCards();break;
 case 'flash-mode':ui.flashMode=node.value;renderPhrasebook();break;
 default:break;
}}
function onInput(e){const node=e.target;switch(node.id){
 case 'story-search':ui.storySearch=node.value;$('#library-results').innerHTML=storyCards();break;
 case 'sound-search':ui.soundSearch=node.value;$('#sound-results').innerHTML=soundCards();break;
 case 'speed-range':state.settings.rate=Number(node.value);const s=$('#speed-value');if(s)s.textContent=Number(node.value).toFixed(2)+'×';save();break;
 case 'daily-note':state.notes[ui.lessonDay]=node.value.slice(0,1500);save();break;
 case 'dictation-input':ui.quizDictation=node.value;ui.quizChecked=false;break;
 default:break;
}}
function init(){if(DAYS.length!==60||SOUNDS.length!==20||PHRASES.length<490){ROOT.innerHTML='<div class="micro-warning">Some lesson files are missing. Keep all the website files together and reload.</div>';return}document.addEventListener('click',action);document.addEventListener('click',e=>{if(e.target.closest('.sidebar')===null&&e.target.closest('.mobile-menu')===null&&$('#sidebar').classList.contains('open')&&innerWidth<=980)$('#sidebar').classList.remove('open')});document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('keydown',e=>{if(e.key==='Escape'){stopSpeech();stopRecognition();$('#sidebar').classList.remove('open')}});window.addEventListener('pagehide',()=>{pauseTimer();stopSpeech();stopRecording()});document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseTimer()});if(canSpeak){voices=window.speechSynthesis.getVoices()||[];if(typeof window.speechSynthesis.addEventListener==='function')window.speechSynthesis.addEventListener('voiceschanged',refreshVoices);else window.speechSynthesis.onvoiceschanged=refreshVoices;}updateChrome();render();refreshVoices();setInterval(tick,1000);if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{})}if(!canSpeak)toast('This browser cannot play text-to-speech. Try modern Chrome or Edge.');}
init();
})();
