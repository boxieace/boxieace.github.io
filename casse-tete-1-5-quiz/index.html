    '<div class="card compact-summary"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">YOUR ACTIVE RETRY DECK</div><h3 style="margin:4px 0">'+errs+' listening '+(errs===1?'mistake':'mistakes')+' to revisit</h3><p style="margin:4px 0">A missed fact leaves the deck after two later correct answers.</p></div>'+

    '<details class="tool-drawer"><summary>See all study tools and the full story</summary>'+
    '<div class="cards" style="margin-top:15px">'+NAV.slice(1).map(function(x,i){return '<div class="card"><div class="eyebrow">TOOL '+(i+1)+'</div><h3>'+esc(x[2])+'</h3><button class="btn sm secondary" onclick="navigate(\''+x[0]+'\')">Open →</button></div>';}).join('')+'</div></details>'+
    '<div class="notice"><b>From your teacher’s outline:</b> Écoute is 10 vrai/faux marks. Lecture is 10 marks with comprehension questions / possible multiple choice. Écriture is an 8–10-sentence paragraph answering two chosen comprehension questions. The three practice prompts are predictions, not the teacher’s exact questions.</div>';
  };

  // Listening: preserve speed, correct balance, replay misses until mastered.
  newListen = function(n, reviewOnly) {
    n = n || 10; reviewOnly = Boolean(reviewOnly);
    let pool = STUDY.facts.filter(q => state.listenCh === 'all' || String(q[0]) === String(state.listenCh));
    if (reviewOnly) pool = pool.filter(q => progress.mistakes[String(STUDY.facts.indexOf(q))] > 0);
    if (!pool.length) {
      if(reviewOnly) alert('Your listening mistake deck is clear. Great work!');
      else alert('No statements found for this filter.');
      return;
    }
    state.listenReviewMode = reviewOnly;
    state.listenQ = chooseBalanced(pool,n);
    state.listenIndex = 0; state.listenScore = 0;
    state.listenAnswer = null; state.listenReveal = false;
    render(); playQuestion();
  };
  answerListen = function(v) {
    if (state.listenAnswer !== null) return;
    const q = state.listenQ[state.listenIndex];
    const key = String(STUDY.facts.indexOf(q));
    state.listenAnswer = v;
    if (v === q[2]) {
      state.listenScore++;
      progress.listenCorrect = (progress.listenCorrect || 0) + 1;
      if (progress.mistakes[key]) {
        progress.mistakes[key]--;
        if (progress.mistakes[key] <= 0) delete progress.mistakes[key];
      }
    } else {
      progress.mistakes[key] = 2;
    }
    progress.listen = (progress.listen || 0) + 1;
    save(); render();
  };
  nextListen = function() {
    state.listenIndex++;
    state.listenAnswer = null;
    render(); playQuestion();
  };
  const originalListening = listening;
  listening = function() {
    let h = originalListening();
    h = h.replace('<select id="speed">','<select id="speed" onchange="CT.setSpeed(this.value)">');
    h = h.replace('value=".85" selected','value=".85"');
    h = h.replace('value="'+clampedSpeed()+'"', 'value="'+clampedSpeed()+'" selected');
    h = h.replace('<button class="btn ghost" onclick="newListen(25)">Endurance: 25</button>',
      '<button class="btn ghost" onclick="newListen(25)">Endurance: 25</button>'+
      '<button class="btn secondary" '+(missedCount()?'':'disabled')+' onclick="CT.retryMisses()">↺ Retry mistakes ('+missedCount()+')</button>');
    h = h.replace('<button class="btn secondary" onclick="newListen(10)">New 10-question set</button>',
      '<label class="check"><input type="checkbox" '+(state.autoPlayListen?'checked':'')+' onchange="CT.setAuto(this.checked)"> Auto-play next</label>'+
      '<button class="btn secondary" onclick="newListen(10)">New 10-question set</button>');
    if(state.listenReviewMode) h = h.replace('<div class="quizbig',
      '<div class="notice">Mistake review: get each fact right in two later attempts to remove it from your retry deck.</div><div class="quizbig');
    if (state.listenQ.length && state.listenIndex >= state.listenQ.length) {
      h += '<div class="card" style="margin-top:15px"><div class="row" style="justify-content:space-between"><div><h3 style="margin:4px 0">Your next best move</h3><p style="margin:5px 0">'+missedCount()+' facts still need review. Target 9/10 before moving on.</p></div>'+
      (missedCount()?'<button class="btn" onclick="CT.retryMisses()">↺ Redrill errors</button>':'<button class="btn" onclick="navigate(\'writing\')">Start writing recall →</button>')+
      '</div></div>';
    }
    return h;
  };

  // Reading: retain what the student typed even after the answer is revealed.
  const originalNewRead = newRead;
  newRead = function(n) {
    state.shortDraft=''; state._readIndexSeen=-1;
    return originalNewRead(n);
  };
  const originalReading = reading;
  reading = function() {
    if (state.readMode === 'short' && state._readIndexSeen !== state.readIndex) {
      state.shortDraft=''; state._readIndexSeen=state.readIndex;
    }
    let h=originalReading();
    if (state.readMode === 'short') {
      h=h.replace(/(<textarea class="input" rows="3" placeholder="[^"]*")><\/textarea>/,
        function(_,start){return start+' oninput="CT.shortDraft(this.value)">'+esc(state.shortDraft)+'</textarea>';});
      if (state.readAnswer === 'show' || state.readAnswer === 'graded') {
        h=h.replace('<div class="answer"><b>Réponse modèle</b>',
          '<div class="answer"><b>Your own response</b><p>'+esc(state.shortDraft||'(You left this blank.)')+'</p></div>'+
          '<div class="answer"><b>Réponse modèle</b>');
      }
    }
    return h;
  };

  // Writing: hide setup controls during recall, retain drafts and score in order.
  const originalWriting = writing;
  writing = function() {
    let h=originalWriting();
    if(state.writeMode !== 'learn') {
      const start='<div class="sectionhead"><h3>Step 1. Pick a story question</h3></div>';
      const target='<div class="sectionhead"><h3>Step 3. Learn the 5-sentence answer</h3></div>';
      const i=h.indexOf(start), j=h.indexOf(target);
      if(i>=0 && j>i) {
        const setup=h.slice(i,j);
        h=h.slice(0,i)+h.slice(j)+
        '<details class="tool-drawer"><summary>Change question, universal opening or ending</summary>'+setup+'</details>';
      }
    }
    if(state.writeMode === 'full') {
      const value = progress.writeDrafts[state.writePrompt] || '';
      h = h.replace(/(<textarea id="fulltext"[^>]*placeholder="[^"]*")><\/textarea>/,
        function(_,start){return start+' oninput="CT.writeDraft(this.value)">'+esc(value)+'</textarea>';});
      h += '<button class="btn ghost sm" style="margin-top:12px" onclick="CT.clearWriteDraft()">Clear saved full-answer draft</button>';
    }
    if(state.writeMode==='guided') {
      const k=state.writePrompt+':'+state.writeLine;
      const mastered=Math.min(2,progress.writeMastery[k]||0);
      h=h.replace('<div class="eyebrow">MEMORY ROUND · SENTENCE',
        '<div class="eyebrow">Recall: '+mastered+'/2 successful tries · SENTENCE');
    }
    return h;
  };
  checkWriting = function() {
    const el=document.getElementById('writebox');
    const own=el ? el.value : '';
    const expected=writeLines()[state.writeLine][0];
    const a=normalize(own).split(' ').filter(Boolean);
    const b=normalize(expected).split(' ').filter(Boolean);
    const dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
    for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) {
      dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
    }
    const score=Math.round(100*dp[a.length][b.length]/Math.max(a.length,b.length,1));
    const key=state.writePrompt+':'+state.writeLine;
    progress.writeMastery[key]=score>=88 ? Math.min(2,(progress.writeMastery[key]||0)+1):0;
    progress.write=(progress.write||0)+1; save();
    const level=progress.writeMastery[key];
    const html='<div class="answer"><b class="'+(score>=88?'positive':'negative')+'">'+
      (score>=88?'Solid recall':'Keep practising')+'</b> · Similarity '+score+'% · '+
      (level===2?'Mastered (2 successful recalls)':'Successful recalls: '+level+'/2')+
      '<p style="color:#fff"><b>Model:</b> '+esc(expected)+'</p>'+
      '<p class="mini">This checks word order and approximate matching, not full French grammar. Fix missing articles and accents before the real quiz.</p>'+
      '<button class="btn sm secondary" onclick="speak(writeLines()[state.writeLine][0],.8)">♫ Hear it</button></div>';
    const feedback=document.getElementById('writingfeedback');
    if(feedback) feedback.innerHTML=html;
  };

  const originalRender=render;
  render=function() {
    originalRender();
    document.body.classList.toggle('focus-on',focusOn);
    const current=NAV.find(x=>x[0]===state.page);
    const bar='<div class="focus-toolbar">'+
      '<div class="toolbar-brand"><b>CASSE-TÊTE</b><span>'+(current?esc(current[2]):'Study')+'</span></div>'+
      '<div class="row">'+
      '<select aria-label="Jump to another station" onchange="navigate(this.value)">'+
      NAV.map(x=>'<option value="'+x[0]+'" '+(x[0]===state.page?'selected':'')+'>'+esc(x[2])+'</option>').join('')+
      '</select>'+
      '<button class="btn sm ghost" aria-label="Toggle distraction-free mode" onclick="CT.toggleFocus()">'+
      (focusOn?'◧ Full menu':'◩ Focus mode')+'</button></div></div>';
    const main=document.getElementById('view');
    main.insertAdjacentHTML('afterbegin',bar);
  };
  render();
})();
</script><!-- ENGLISH_DEEP_DIVE_V1 -->

<script>/* English-only Casse-tête Chapter 1–5 detail mastery */
const ENGLISH_BANK = [
  ...(window.EN_DETAIL_Q12 || []),
  ...(window.EN_DETAIL_Q345 || [])
].map((q,i)=>({...q,id:i+1}));
const enSaveKey='casseEnglishMasteryV1';
let enStore={missed:{},seen:0,correct:0,mastery:{}};
try {const p=JSON.parse(localStorage.getItem(enSaveKey)||'{}');enStore={...enStore,...p,missed:p.missed||{},mastery:p.mastery||{}}}catch(e){}
let enState={chapter:'all',level:'all',type:'all',size:10,mode:'all',list:[],index:0,selected:null,score:0,sessionWrong:[],completed:false,showAnswers:false};
const enSave=()=>{try{localStorage.setItem(enSaveKey,JSON.stringify(enStore))}catch(e){}};
function enPool(){
 return ENGLISH_BANK.filter(x=>
 (enState.chapter==='all'||String(x.c)===enState.chapter)&&
 (enState.level==='all'||x.d===enState.level)&&
 (enState.type==='all'||x.t===enState.type)&&
 (enState.mode!=='mistakes'||enStore.missed[x.id])
 );
}
function enStart(){
 const pool=enPool();
 if(!pool.length){alert(enState.mode==='mistakes'?'No missed questions match these filters. Change the filters or start a new set.':'No questions match these filters.');return}
 const asked=Number(enState.size)||10;
 enState.list=rand(pool).slice(0,asked===1000?pool.length:Math.min(asked,pool.length));
 enState.index=0;enState.selected=null;enState.score=0;enState.sessionWrong=[];
 enState.completed=false;enState.showAnswers=false;
 render();
}
function enChoose(v){
 if(enState.selected!==null)return;
 const q=enState.list[enState.index];
 enState.selected=v;
 enStore.seen+=1;
 if(v===q.a){
   enState.score++;
   enStore.correct++;
   if(enStore.missed[q.id]){
     enStore.mastery[q.id]=Math.min(2,(enStore.mastery[q.id]||0)+1);
     if(enStore.mastery[q.id]>=2){delete enStore.missed[q.id];delete enStore.mastery[q.id]}
   }
 }else{
   enStore.missed[q.id]=1;enStore.mastery[q.id]=0;
   enState.sessionWrong.push(q.id);
 }
 enSave();render();
}
function enNext(){
 enState.index++;
 enState.selected=null;
 if(enState.index>=enState.list.length)enState.completed=true;
 render();
}
function enRevisit(){
 enState.chapter='all';enState.level='all';enState.type='all';enState.mode='mistakes';
 enState.size=1000;enStart();
}
function enRevealList(){
 enState.showAnswers=!enState.showAnswers;render();
}
function enReset(){
 if(confirm('Clear your English quiz progress and saved mistakes?')){enStore={missed:{},seen:0,correct:0,mastery:{}};enSave();enState.list=[];enState.selected=null;render()}
}
function enSetting(name,value){
 if(name==='size')enState[name]=Number(value);else enState[name]=value;
 enState.list=[];enState.selected=null;enState.completed=false;render();
}
function enEnc(x){return esc(String(x))}
function enSelector(name,label,opts,value){
 return '<label class="en-field">'+label+' <select onchange="enSetting(\''+name+'\',this.value)">'+
 opts.map(opt=>'<option value="'+enEnc(opt[0])+'" '+(String(value)===String(opt[0])?'selected':'')+'>'+enEnc(opt[1])+'</option>').join('')+
 '</select></label>';
}
function englishQuiz(){
 const missed=Object.keys(enStore.missed).filter(id=>enStore.missed[id]).length;
 const byChapter=[1,2,3,4,5].map(c=>ENGLISH_BANK.filter(q=>q.c===c).length);
 let s='<div class="eyebrow">100 FACT-CHECKED DETAIL QUESTIONS · ENGLISH ONLY</div>'+
 '<h2 style="margin:8px 0 10px">English Deep-Dive Challenge</h2>'+
 '<p>Learn the <b>tiny details</b> from all five chapters. No French comprehension required here: every question, option and explanation is in English. The traps are precise, not trick wording.</p>'+
 '<div class="en-summary-row"><div><strong>100</strong><span>Total questions</span></div>'+
 '<div><strong>5 × 20</strong><span>Questions per chapter</span></div>'+
 '<div><strong>'+missed+'</strong><span>Saved mistakes</span></div>'+
 '<div><strong>'+enStore.seen+'</strong><span>Answers submitted</span></div></div>'+
 '<div class="en-toolbar">'+
 enSelector('chapter','Chapter',[['all','All five'],...[1,2,3,4,5].map(x=>[x,'Chapter '+x])],enState.chapter)+
 enSelector('level','Difficulty',[['all','Easy + hard'],['easy','Easy'],['hard','Hard details']],enState.level)+
 enSelector('type','Question type',[['all','Mixed'],['mc','Multiple choice'],['tf','True / False']],enState.type)+
 enSelector('size','Set size',[['10','10 questions'],['20','20 questions'],['40','40 questions'],['1000','All available']],enState.size)+
 '</div>'+
 '<div class="row en-actions"><button class="btn" onclick="enState.mode=\'all\';enStart()">▶ Start selected test</button>'+
 '<button class="btn secondary" onclick="enRevisit()" '+(!missed?'disabled':'')+'>↺ Retry missed ('+missed+')</button>'+
 '<button class="btn ghost" onclick="enReset()">Reset saved progress</button></div>';
 if(enState.list.length===0){
   s+='<div class="en-intro"><h3>Try a detail-heavy English test</h3><p>These are based on the five provided chapters, including classroom behavior, exact events, dialogue, appearances, motivations, numbers, and rumours versus reality.</p>'+
   '<div class="en-tips"><span>✓ No timer</span><span>✓ No French required</span><span>✓ Answers hidden until you choose</span><span>✓ Wrong answers saved</span></div>'+
   '<button class="btn" onclick="enState.chapter=\'all\';enState.level=\'hard\';enState.size=20;enState.mode=\'all\';enStart()">Start 20 hard questions →</button></div>'+
   '<div class="en-map">'+byChapter.map((n,i)=>'<div class="en-chapter-tile"><b>CH. '+(i+1)+'</b><span>'+n+' questions</span></div>').join('')+'</div>';
   return s;
 }
 if(enState.completed){
   const score=enState.score, total=enState.list.length,pct=Math.round(score/total*100);
   s+='<div class="en-finish"><div class="eyebrow">QUIZ COMPLETED</div><h2>'+score+' / '+total+'</h2><p>'+pct+'% correct</p>'+
   '<p>'+(pct>=95?'Excellent detail mastery. Try another chapter or difficulty.':pct>=80?'Strong! Repeat the mistakes to secure the fine details.':'Review the explanations, then redrill missed facts for retention.')+'</p>'+
   '<div class="row" style="justify-content:center"><button class="btn" onclick="enStart()">Try a fresh set</button>'+
   '<button class="btn secondary" onclick="enRevisit()" '+(!missed?'disabled':'')+'>Retry saved mistakes</button>'+
   '<button class="btn ghost" onclick="enRevealList()">'+(enState.showAnswers?'Hide':'Show')+' questions & answers</button></div></div>';
   if(enState.showAnswers){
     s+='<div class="en-review">'+enState.list.map((q,i)=>'<details><summary>Question '+(i+1)+' · Chapter '+q.c+' · '+enEnc(q.q)+'</summary>'+
     '<p><b>Correct:</b> '+enEnc(q.t==='tf'?(q.a?'True':'False'):q.o[q.a])+'</p><p>'+enEnc(q.why)+'</p></details>').join('')+'</div>';
   }
   return s;
 }
 const q=enState.list[enState.index],i=enState.index;
 s+='<div class="en-question"><div class="en-question-top"><span>Question '+(i+1)+' of '+enState.list.length+'</span>'+
 '<span>Chapter '+q.c+' · '+(q.d==='hard'?'Hard detail':'Easy recall')+' · '+(q.t==='tf'?'True / False':'Multiple choice')+'</span>'+
 '<span>Score '+enState.score+'</span></div>'+
 '<div class="progress" aria-label="Quiz progress"><div style="width:'+(i/enState.list.length*100)+'%"></div></div>'+
 '<h3>'+enEnc(q.q)+'</h3><div class="en-options">'+
 (q.t==='tf'?[['True',true],['False',false]]:q.o.map((x,j)=>[String.fromCharCode(65+j)+'. '+x,j]))
 .map(([label,value])=>'<button class="option '+(enState.selected!==null?(value===q.a?'correct':value===enState.selected?'wrong':''):'')+
 '" onclick="enChoose('+(typeof value==='boolean'?value:Number(value))+')" '+(enState.selected!==null?'disabled':'')+'>'+
 enEnc(label)+'</button>').join('')+'</div>'+
 (enState.selected===null?'<p class="mini muted">Think about the actual chapter detail before answering. There are no penalties for wrong answers.</p>':
 '<div class="en-feedback"><strong class="'+(enState.selected===q.a?'positive':'negative')+'">'+
 (enState.selected===q.a?'✓ Correct!':'✕ Not quite — saved for review')+'</strong>'+
 '<div><b>Correct answer:</b> '+enEnc(q.t==='tf'?(q.a?'True':'False'):q.o[q.a])+'</div>'+
 '<p>'+enEnc(q.why)+'</p></div>'+
 '<button class="btn en-next" onclick="enNext()">'+(i===enState.list.length-1?'Finish and score →':'Next question →')+'</button>')+
 '</div>';
 return s;
}
