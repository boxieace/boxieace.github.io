 solid var(--orange);background:#3f312a77;border-radius:12px;color:#f4dfce;margin:18px 0}.question h3{font-size:21px;margin:7px 0 13px;letter-spacing:0}.option{display:block;width:100%;background:#202e47;color:#f1f5fc;border:1px solid #344969;border-radius:11px;padding:14px 16px;text-align:left;margin:9px 0;font-weight:700}.option:hover{border-color:var(--blue)}.option.correct{background:#174c45;border-color:#62e6cb}.option.wrong{background:#5a2834;border-color:#ff8a93}.answer{padding:13px 16px;border-radius:12px;background:#1b3244;border:1px solid #42657b;margin-top:14px}.answer small{color:#8cead0}.progress{height:9px;background:#24314b;border-radius:50px;overflow:hidden;margin:8px 0 20px}.progress div{height:100%;background:linear-gradient(90deg,#5ee2cd,#a6eec8);border-radius:30px;transition:width .25s}.input{background:#0c1729;border:1px solid #40526b;border-radius:12px;color:white;padding:12px 14px;width:100%}.input:focus{outline:2px solid var(--teal)}.check{display:flex;align-items:center;gap:8px;color:#c2d1e3;font-size:13px}.check input{accent-color:#75e8d1}.quizbig{background:linear-gradient(110deg,#172e43,#182339);padding:25px;border:1px solid #3a5b72;border-radius:20px}.listen-icon{height:86px;width:86px;background:linear-gradient(135deg,#5de4ca,#71a8ff);border-radius:25px;color:#052c33;font-size:39px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 10px 40px #5ae6ca2b}.center{text-align:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bar{height:5px;background:#293c57;border-radius:9px;overflow:hidden}.bar>div{background:var(--teal);height:100%} .writingline{margin:8px 0;padding:15px 18px}.writingline strong{font-size:16px}.writingline .hint{color:#91dfd2;font-size:13px}.writingline textarea{min-height:74px;resize:vertical}.writingline .grade{font-size:13px;color:var(--sub);margin:7px 0}.vocab{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #35475f;padding:9px 0}.vocab span:last-child{color:var(--teal)}.hidden{display:none!important}select{background:#182942;color:#e8f4fb;border:1px solid #3b536d;border-radius:10px;padding:9px}.mobiletop{display:none}.footer{margin-top:45px;color:#7f91aa;font-size:12px}.block{margin:22px 0}details{border:1px solid #354968;border-radius:13px;background:#18243a;margin:8px 0;padding:12px 16px}summary{cursor:pointer;font-weight:700}details p{margin:8px 0 1px}.star{color:var(--orange)}.day{border-left:3px solid #5ce5c9;padding:8px 17px;margin:15px 0;background:#13263a}.timer{font-weight:900;font-size:36px;color:var(--teal);font-family:Outfit}.fade{animation:pop .2s ease}@keyframes pop{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:850px){.layout{display:block}.nav{display:none;position:relative;height:auto}.mobiletop{display:flex;position:sticky;top:0;z-index:20;background:#0f1b30f7;border-bottom:1px solid #34445a;padding:10px 14px;gap:6px;overflow-x:auto}.mobiletop button{white-space:nowrap;border:0;border-radius:9px;padding:9px 11px;background:#23334b;color:white;font-size:12px}.main{padding:20px 15px 50px}.hero{padding:23px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.question,.card,.stat{padding:17px}}
</style></head><body><div class="mobiletop" id="mobilenav"></div><div class="layout"><aside class="nav"><div class="brand">CASSE<span>•</span>TÊTE<br><span style="font-size:12px;letter-spacing:.19em">THE QUIZ LAB</span></div><div id="desktopnav"></div><small>Built for your quiz</small><div class="card" style="padding:12px;font-size:12px;color:#b1c2d6">Chapitres 1–5<br><b>Écoute /10</b><br><b>Lecture /10</b><br><b>Écriture /10</b><br><span class="positive">8–10 writing sentences total</span></div></aside><main class="main" id="view" aria-live="polite"></main></div><script src="story.js"></script><script src="study.js"></script><script>
const NAV=[['home','⌂','Mission'],['story','▤','Bilingual story'],['notes','✎','Chapter memory'],['listening','♫','Écoute lab'],['reading','◈','Lecture quiz'],['writing','✦','Écriture trainer'],['exam','★','Mock quiz'],['schedule','◷','3-day plan']];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let state={page:'home',chapter:1,storyEnglish:true,storyMode:'all',listenCh:'all',listenQ:[],listenIndex:0,listenAnswer:null,listenReveal:false,listenScore:0,readMode:'mc',readCh:'all',readQ:[],readIndex:0,readAnswer:null,readScore:0,writePrompt:'justine',writeIntro:0,writeEnd:0,writeMode:'learn',writeLine:0,writeTry:0,writeReveal:false,mock:[],mockIndex:0,mockScore:0,mockAnswer:null,mockPart:'listen'};
let progress={};try{progress=JSON.parse(localStorage.getItem('casseQuizV1')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('casseQuizV1',JSON.stringify(progress))}catch(e){}};
const rand=a=>[...a].sort(()=>Math.random()-.5), sample=(a,n)=>rand(a).slice(0,n);
function navigate(page){speechSynthesis.cancel();state.page=page;render();window.scrollTo({top:0,behavior:'smooth'})}
function navigation(){const list=NAV.map(([id,icon,name])=>'<button class="'+(state.page===id?'active':'')+'" onclick="navigate(\''+id+'\')"><span style="font-size:18px">'+icon+'</span>'+name+'</button>').join('');$('#desktopnav').innerHTML=list;$('#mobilenav').innerHTML=NAV.map(([id,icon,name])=>'<button onclick="navigate(\''+id+'\')">'+icon+' '+name+'</button>').join('')}
function top(label,title,desc){return '<div class="eyebrow">'+label+'</div><h2 style="margin:7px 0 10px">'+title+'</h2><p style="margin-top:0">'+desc+'</p>'}
function speak(text,rate=.85){if(!('speechSynthesis'in window)){alert('Your browser does not support speech synthesis. Try Chrome or Safari.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-CA';u.rate=rate;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()==='fr-ca')||vs.find(v=>v.lang.toLowerCase().startsWith('fr'))||null;speechSynthesis.speak(u)}
function listenRate(){return Number($('#speed')?.value||.85)}
function chOptions(all=true){return (all?'<option value="all">All five chapters</option>':'')+CHAPTERS.map(c=>'<option value="'+c.id+'">Chapter '+c.id+' · '+esc(c.title)+'</option>').join('')}
function getCh(n){return CHAPTERS.find(x=>x.id==n)||CHAPTERS[0]}
function home(){const count=CHAPTERS.reduce((t,c)=>t+c.sections.reduce((n,p)=>n+p.lines.length,0),0);return '<div class="hero"><div class="eyebrow">THE THREE-DAY COMPREHENSION MISSION</div><h1>Five chapters.<br><span style="color:#68e5cf">One confident quiz.</span></h1><p>Read the actual plot in French with English underneath, hear dozens of true/false statements, practise specific facts, and build two short writing answers without memorizing ten completely different sentences.</p><div class="row"><button class="btn" onclick="navigate(\'listening\')">♫ Start listening drills</button><button class="btn secondary" onclick="navigate(\'story\')">Read the story</button></div><div style="margin-top:17px"><span class="pill">📅 Tuesday quiz</span><span class="pill">🔉 French audio drills</span><span class="pill">✎ 3 adaptable writing prompts</span></div></div>'+
'<div class="stats"><div class="stat"><strong>5</strong><span>chapters covered</span></div><div class="stat"><strong>'+count+'</strong><span>French–English story lines</span></div><div class="stat"><strong>'+STUDY.facts.length+'</strong><span>listening true/false facts</span></div><div class="stat"><strong>'+STUDY.mc.length+'</strong><span>multiple-choice questions</span></div></div>'+
'<div class="notice"><b>Actual quiz format, from your outline:</b> Écoute: 10 true/false statements. Lecture: 10 marks, short answers / possible multiple choice. Écriture: answer TWO comprehension questions in an 8–10-sentence paragraph. Your previous Travail d\'été test is a <b>format example</b>; its facts are NOT used as Casse-tête answers.</div>'+
'<div class="sectionhead"><h2>Choose your training station</h2></div><div class="cards">'+NAV.slice(1).map(([id,icon,name],i)=>'<div class="card"><div class="index">STATION '+(i+1)+'</div><h3>'+icon+' '+name+'</h3><p>'+['Every chapter, story line in French with its English meaning and audio.','Exact names, places, events, time order, facts vs rumours.','Hidden scripts and slow French voice: decide V or F before revealing.','Realistic lecture MC and short-response questions.','Universal opening/ending + 9 adaptable middle sentences.','Mixed pressure practice to simulate exam mode.','Focused study schedule for your three remaining days.'][i]+'</p><button class="btn sm secondary" onclick="navigate(\''+id+'\')">Open station</button></div>').join('')+'</div>'+
'<div class="sectionhead"><h2>What you absolutely must not mix up</h2></div><div class="two"><div class="card"><h3>Rumours ≠ facts</h3><p>Thomas has NOT been shown to be a criminal, in a cult, or tattooed. Justine <b>invents</b> the bat tattoo story.</p></div><div class="card"><h3>What we really know</h3><p>Thomas Desjardins moved from Trois-Rivières, attended Saint-Simon, lives with his mother and says his father travels often.</p></div></div>'}
function story(){const c=getCh(state.chapter);const sections=state.storyMode==='all'?c.sections:c.sections.filter(s=>s.page==Number(state.storyMode));return top('STATION 01 · FULL STORY','Read before you memorize','Each narrative/dialogue line is paired with a clear English translation. Page references match your uploaded scans. Classroom activity prompts and margin exercises are not part of the story text.')+
'<div class="tabs">'+CHAPTERS.map(ch=>'<button class="'+(ch.id===state.chapter?'selected':'')+'" onclick="state.chapter='+ch.id+';state.storyMode=\'all\';render()">Chapter '+ch.id+'</button>').join('')+'</div><div class="row"><label class="check"><input type="checkbox" '+(state.storyEnglish?'checked':'')+' onchange="state.storyEnglish=this.checked;render()"> Show translation under every line</label><select onchange="state.storyMode=this.value;render()"><option value="all">All chapter pages</option>'+c.sections.map(s=>'<option '+(String(s.page)===String(state.storyMode)?'selected':'')+' value="'+s.page+'">Page '+s.page+'</option>').join('')+'</select><button class="btn sm secondary" onclick="speak(getCh(state.chapter).sections.flatMap(s=>s.lines.map(x=>x[0])).join(\' \'),.8)">♫ Read chapter aloud</button></div>'+
'<div class="card" style="margin:17px 0"><div class="eyebrow">CHAPTER '+c.id+' · BOOK PAGES '+c.pages+'</div><h2 style="margin:5px 0">'+esc(c.title)+'</h2><p>'+esc(c.summaryEn)+'</p><button class="btn sm secondary" onclick="navigate(\'notes\')">Chapter memory notes</button></div>'+
sections.map(sec=>'<div class="sectionhead"><h3>Page '+sec.page+'</h3><span class="muted mini">'+sec.lines.length+' bilingual lines</span></div>'+sec.lines.map(([fr,en])=>'<div class="sentence"><div class="row" style="justify-content:space-between"><div class="fr" style="flex:1">'+esc(fr)+'</div><button class="btn sm ghost" title="Listen in French" onclick="speak('+JSON.stringify(fr).replaceAll('"','&quot;')+',.82)">♫</button></div>'+(state.storyEnglish?'<div class="en">'+esc(en)+'</div>':'')+'</div>').join('')).join('')+
'<div class="notice">Translations are study translations, not official published translations. Read the French first, then use English to check meaning.</div>'}
function notes(){let c=getCh(state.chapter);return top('STATION 02 · STORY MEMORY','Chapter-by-chapter mastery','Use these precise facts to defeat listening traps about people, places, reasons and sequence.')+
'<div class="tabs">'+CHAPTERS.map(ch=>'<button class="'+(ch.id===state.chapter?'selected':'')+'" onclick="state.chapter='+ch.id+';render()">Ch. '+ch.id+'</button>').join('')+'</div>'+
'<div class="card"><div class="eyebrow">CHAPTER '+c.id+'</div><h2>'+esc(c.title)+'</h2><h3>Résumé en français</h3><p style="color:white">'+esc(c.summary)+'</p><h3>English summary</h3><p>'+esc(c.summaryEn)+'</p><button class="btn secondary sm" onclick="speak('+JSON.stringify(c.summary).replaceAll('"','&quot;')+',.8)">♫ Hear summary</button></div>'+
'<div class="sectionhead"><h3>Memorize these specifics</h3></div><div class="cards">'+c.must.map(([k,v])=>'<div class="fact"><div class="eyebrow">'+esc(k)+'</div><p style="color:#ecf3ff;font-weight:600;margin-bottom:0">'+esc(v)+'</p></div>').join('')+'</div>'+
'<div class="sectionhead"><h3>Essential vocabulary</h3></div><div class="card">'+c.vocab.map(([fr,en])=>'<div class="vocab"><span><button class="btn sm ghost" onclick="speak('+JSON.stringify(fr).replaceAll('"','&quot;')+',.85)">♫</button> '+esc(fr)+'</span><span>'+esc(en)+'</span></div>').join('')+'</div><div class="row" style="margin-top:16px"><button class="btn" onclick="state.listenCh=String(state.chapter);navigate(\'listening\');newListen()">Test me on Chapter '+c.id+'</button><button class="btn secondary" onclick="navigate(\'story\')">Return to story</button></div>'}
function newListen(n=10){let arr=STUDY.facts.filter(f=>state.listenCh==='all'||String(f[0])===String(state.listenCh));state.listenQ=sample(arr,Math.min(n,arr.length));state.listenIndex=0;state.listenScore=0;state.listenAnswer=null;state.listenReveal=false;render()}
function listening(){const total=state.listenQ.length, q=state.listenQ[state.listenIndex];return top('STATION 03 · YOUR BIGGEST PRIORITY','Écoute: vrai ou faux','Hear the sentence, decide V or F, then reveal the transcript only AFTER choosing. The voice is computer-generated French, not your teacher’s recording.')+
'<div class="row"><label>Chapter <select onchange="state.listenCh=this.value;newListen()">'+chOptions() .replace('value="'+state.listenCh+'"','value="'+state.listenCh+'" selected')+'</select></label><label>Voice speed <select id="speed"><option value=".72">Slow (0.72×)</option><option value=".85" selected>Practice (0.85×)</option><option value="1">Exam (1.0×)</option><option value="1.12">Challenge (1.12×)</option></select></label><button class="btn secondary" onclick="newListen(10)">New 10-question set</button><button class="btn ghost" onclick="newListen(25)">Endurance: 25</button></div>'+
(!total?'<div class="card center" style="margin-top:22px"><h3>Ready for your first listening round?</h3><p>Each question is spoken aloud. Click V or F before seeing the words.</p><button class="btn" onclick="newListen()">Begin 10-question set</button></div>':
state.listenIndex>=total?'<div class="quizbig center" style="margin-top:20px"><h2>Listening set complete</h2><div class="timer">'+state.listenScore+' / '+total+'</div><p>'+(state.listenScore/total>=.9?'Excellent recall. Try exam-speed listening.':'Review the explanations and repeat the questions you missed.')+'</p><button class="btn" onclick="newListen(10)">Another set</button> <button class="btn secondary" onclick="navigate(\'notes\')">Review notes</button></div>':
'<div class="quizbig fade" style="margin-top:19px"><div class="row" style="justify-content:space-between"><b>Question '+(state.listenIndex+1)+' / '+total+'</b><span class="pill">Chapter '+q[0]+'</span><span class="pill">Score '+state.listenScore+'</span></div><div class="progress"><div style="width:'+100*state.listenIndex/total+'%"></div></div><div class="listen-icon">♫</div><div class="center"><h3>Listen carefully. Is the statement true?</h3><p>Replay as often as you need. The sentence is hidden until you answer.</p><button class="btn" onclick="speak(STUDY.facts.find(f=>f===state.listenQ[state.listenIndex])[1],listenRate())">▶ Play French sentence</button> <button class="btn secondary" onclick="speak(state.listenQ[state.listenIndex][1],listenRate()*.82)">◀ Slower replay</button></div>'+
'<div class="two" style="margin:21px 0"><button class="option center '+(state.listenAnswer!==null?(q[2]?'correct':state.listenAnswer===true?'wrong':''):'')+'" onclick="answerListen(true)" '+(state.listenAnswer!==null?'disabled':'')+'>V · VRAI</button><button class="option center '+(state.listenAnswer!==null?(!q[2]?'correct':state.listenAnswer===false?'wrong':''):'')+'" onclick="answerListen(false)" '+(state.listenAnswer!==null?'disabled':'')+'>F · FAUX</button></div>'+
(state.listenAnswer===null?'': '<div class="answer"><div class="'+(state.listenAnswer===q[2]?'positive':'negative')+'"><b>'+(state.listenAnswer===q[2]?'✓ Correct!':'✕ Not quite')+'</b> · The statement is '+(q[2]?'TRUE':'FALSE')+'.</div><h3 style="letter-spacing:0">'+esc(q[1])+'</h3><p>'+esc(q[3])+'</p></div><div class="row" style="margin-top:16px"><button class="btn" onclick="nextListen()">Next statement →</button><button class="btn ghost" onclick="speak(state.listenQ[state.listenIndex][1],listenRate())">♫ Replay</button></div>')+'</div>')+
'<div class="notice">Listening tactics: watch for <b>ne…pas</b>, <b>toujours/jamais</b>, exact names, <b>gauche/droite</b>, <b>avant/après</b>, and reported rumours versus facts. Your past recording used numbered one-sentence vrai/faux items, so this drill follows that pattern.</div>'}
function answerListen(x){if(state.listenAnswer!==null)return;const q=state.listenQ[state.listenIndex];state.listenAnswer=x;if(x===q[2])state.listenScore++;progress.listen=(progress.listen||0)+1;save();render()}
function nextListen(){state.listenIndex++;state.listenAnswer=null;render()}
function newRead(n=10){const base=state.readMode==='mc'?STUDY.mc:STUDY.comprehension;const a=base.filter(x=>state.readCh==='all'||String(x[0])===String(state.readCh));state.readQ=sample(a,Math.min(n,a.length));state.readIndex=0;state.readAnswer=null;state.readScore=0;render()}
function reading(){const q=state.readQ[state.readIndex];const total=state.readQ.length;let out=top('STATION 04 · LECTURE','Comprehension: reading quiz','Clear chapter-based multiple choice plus short-answer comprehension, since your outline mentions both. All answers remain hidden until you check.')+'<div class="row"><button class="btn '+(state.readMode==='mc'?'':'secondary')+'" onclick="state.readMode=\'mc\';newRead()">Multiple choice</button><button class="btn '+(state.readMode==='short'?'':'secondary')+'" onclick="state.readMode=\'short\';newRead()">Short answers</button><select onchange="state.readCh=this.value;newRead()">'+chOptions().replace('value="'+state.readCh+'"','value="'+state.readCh+'" selected')+'</select><button class="btn ghost" onclick="newRead()">Shuffle 10</button></div>';
if(!total)return out+'<div class="card"><h3>Ready for lecture practice?</h3><button class="btn" onclick="newRead()">Start 10 questions</button></div>';
if(state.readIndex>=total)return out+'<div class="card center"><h2>Reading complete!</h2><div class="timer">'+state.readScore+' / '+total+'</div><p>Short answers are marked by your self-assessment, not by automated French grading.</p><button class="btn" onclick="newRead()">Another set</button></div>';
out+='<div class="question" style="margin-top:20px"><div class="row" style="justify-content:space-between"><span class="pill">Question '+(state.readIndex+1)+' / '+total+'</span><span class="pill">Chapter '+q[0]+'</span><span>Score '+state.readScore+'</span></div><div class="progress"><div style="width:'+100*state.readIndex/total+'%"></div></div><h3>'+esc(q[1])+'</h3>';
if(state.readMode==='mc'){out+=q[2].map((v,i)=>'<button class="option '+(state.readAnswer!==null?(i===q[3]?'correct':i===state.readAnswer?'wrong':''):'')+'" onclick="answerRead('+i+')" '+(state.readAnswer!==null?'disabled':'')+'><b>'+('ABC'[i])+'.</b> '+esc(v)+'</button>').join('');if(state.readAnswer!==null)out+='<div class="answer"><b class="'+(q[3]===state.readAnswer?'positive':'negative')+'">'+(q[3]===state.readAnswer?'Correct':'Review this one')+'</b><p>'+esc(q[4])+'</p><b>Correct: '+esc(q[2][q[3]])+'</b></div>'}
else{out+='<textarea class="input" rows="3" placeholder="Answer in French before opening the model answer..."></textarea><div style="margin-top:12px"><button class="btn secondary" onclick="state.readAnswer=\'show\';render()">Reveal model answer</button></div>';if(state.readAnswer==='show')out+='<div class="answer"><b>Réponse modèle</b><p style="color:white">'+esc(q[2])+'</p><p>'+esc(q[3])+'</p><button class="btn sm" onclick="state.readScore++;state.readAnswer=\'graded\';render()">✓ I got it</button> <button class="btn sm ghost" onclick="state.readAnswer=\'graded\';render()">I missed it</button></div>'}
if(state.readAnswer!==null&&(state.readMode==='mc'||state.readAnswer==='graded'))out+='<div style="margin-top:16px"><button class="btn" onclick="state.readIndex++;state.readAnswer=null;render()">Next →</button></div>';return out+'</div>'}
function answerRead(i){if(state.readAnswer!==null)return;const q=state.readQ[state.readIndex];state.readAnswer=i;if(i===q[3])state.readScore++;progress.read=(progress.read||0)+1;save();render()}
function writeLines(){const p=STUDY.prompts.find(x=>x.id===state.writePrompt)||STUDY.prompts[0];return [STUDY.intros[state.writeIntro],...p.core,STUDY.endings[state.writeEnd]]}
function writing(){let p=STUDY.prompts.find(x=>x.id===state.writePrompt)||STUDY.prompts[0],lines=writeLines();let out=top('STATION 05 · LOW-MEMORIZATION WRITING','Écriture: build two answers','Three likely comprehension prompts, not confirmed exam questions. Learn 2 interchangeable first lines, 9 prompt-specific middle lines (3 per prompt), and 2 interchangeable final lines. Pick any two prompt answers: five sentences each = ten sentences total.')+
'<div class="notice"><b>Important:</b> Your outline says “Répondez à 2 questions de compréhension (vous avez du choix)” and “8 à 10 phrases.” The exact choices and topics have not been provided. The prompts below are predictions based on the story, not a leaked test.</div>'+
'<div class="sectionhead"><h3>Step 1. Pick a story question</h3></div><div class="cards">'+STUDY.prompts.map((x,i)=>'<div class="card" style="'+(p.id===x.id?'border-color:#59cdbd':'')+'"><div class="index">PREDICTION '+(i+1)+'</div><h3 style="font-size:17px;line-height:1.4">'+esc(x.title)+'</h3><p>'+esc(x.en)+'</p><button class="btn sm '+(p.id===x.id?'':'secondary')+'" onclick="state.writePrompt=\''+x.id+'\';state.writeLine=0;state.writeReveal=false;render()">'+(p.id===x.id?'Selected ✓':'Train this prompt')+'</button></div>').join('')+'</div>'+
'<div class="sectionhead"><h3>Step 2. Choose ONE universal start and ONE ending</h3></div><div class="two"><div class="card"><div class="eyebrow">Universal introductions — learn both</div>'+STUDY.intros.map((line,i)=>'<label class="writingline" style="display:block;margin:10px 0;cursor:pointer;border-color:'+(state.writeIntro===i?'#65d6c2':'#344b6b')+'"><input type="radio" name="intro" '+(state.writeIntro===i?'checked':'')+' onchange="state.writeIntro='+i+';render()"> <b>'+esc(line[0])+'</b><div class="hint">'+esc(line[1])+'</div></label>').join('')+'</div><div class="card"><div class="eyebrow">Universal endings — learn both</div>'+STUDY.endings.map((line,i)=>'<label class="writingline" style="display:block;margin:10px 0;cursor:pointer;border-color:'+(state.writeEnd===i?'#65d6c2':'#344b6b')+'"><input type="radio" name="ending" '+(state.writeEnd===i?'checked':'')+' onchange="state.writeEnd='+i+';render()"> <b>'+esc(line[0])+'</b><div class="hint">'+esc(line[1])+'</div></label>').join('')+'</div></div>'+
'<div class="sectionhead"><h3>Step 3. Learn the 5-sentence answer</h3></div><div class="tabs"><button class="'+(state.writeMode==='learn'?'selected':'')+'" onclick="state.writeMode=\'learn\';render()">Understand + hear</button><button class="'+(state.writeMode==='guided'?'selected':'')+'" onclick="state.writeMode=\'guided\';state.writeReveal=false;render()">Line-by-line recall</button><button class="'+(state.writeMode==='full'?'selected':'')+'" onclick="state.writeMode=\'full\';render()">Full paragraph test</button></div>';
if(state.writeMode==='learn')out+='<div class="card"><h3>'+esc(p.title)+'</h3><p>'+esc(p.en)+'</p>'+lines.map(([fr,en],i)=>'<div class="writingline"><div class="eyebrow">'+(i===0?'UNIVERSAL OPENING':i===4?'UNIVERSAL ENDING':'KEY SENTENCE '+i)+'</div><strong>'+(i+1)+'. '+esc(fr)+'</strong><div class="hint">'+esc(en)+'</div><button class="btn sm ghost" style="margin-top:9px" onclick="speak('+JSON.stringify(fr).replaceAll('"','&quot;')+',.8)">♫ Listen</button></div>').join('')+'<div class="row"><button class="btn" onclick="state.writeMode=\'guided\';state.writeLine=0;state.writeReveal=false;render()">I understand → recall each line</button><button class="btn secondary" onclick="speak(writeLines().map(x=>x[0]).join(\' \'),.8)">♫ Hear all five</button></div></div>';
if(state.writeMode==='guided'){let i=state.writeLine,ln=lines[i];out+='<div class="card"><div class="eyebrow">MEMORY ROUND · SENTENCE '+(i+1)+' / 5</div><div class="progress"><div style="width:'+(i/5*100)+'%"></div></div><h3>'+(i===0?'Universal introduction':i===4?'Universal ending':'Core sentence '+i)+'</h3><p style="color:#8ee5d3;font-size:18px">'+esc(ln[1])+'</p><p><b>Try to write the French from this English meaning without looking.</b></p><textarea id="writebox" class="input" rows="3" placeholder="Type the French sentence from memory..."></textarea><div class="row" style="margin-top:13px"><button class="btn" onclick="checkWriting()">Check my sentence</button><button class="btn secondary" onclick="speak(writeLines()[state.writeLine][0],.8)">♫ Hear it</button><button class="btn ghost" onclick="state.writeReveal=true;showWriteAnswer()">Reveal</button></div><div id="writingfeedback"></div><div class="row" style="margin-top:13px"><button class="btn secondary" onclick="state.writeLine=Math.max(0,state.writeLine-1);state.writeReveal=false;render()" '+(i===0?'disabled':'')+'>← Previous</button><button class="btn" onclick="state.writeLine=(state.writeLine+1)%5;state.writeReveal=false;render()">Next line →</button><button class="btn ghost" onclick="state.writeMode=\'full\';render()">Full test →</button></div></div>'}
if(state.writeMode==='full')out+='<div class="card"><div class="eyebrow">NO HINTS · 5 SENTENCES</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.en)+'</p><textarea id="fulltext" class="input" style="min-height:220px" placeholder="Write your full 5-sentence answer in French from memory."></textarea><div class="row" style="margin-top:12px"><button class="btn" onclick="const t=$(\'#fulltext\').value;progress.write=(progress.write||0)+1;save();$(\'#fullfeedback\').innerHTML=\'<div class=answer><b>Sentence estimate: \'+(t.match(/[.!?]+/g)||[]).length+\'</b><p>Compare your response with the model; accuracy matters more than memorizing punctuation.</p></div>\'">Check length</button><button class="btn secondary" onclick="$(\'#fullmodel\').classList.toggle(\'hidden\')">Reveal 5-sentence model</button></div><div id="fullfeedback"></div><div id="fullmodel" class="answer hidden">'+lines.map(x=>'<p style="color:#effbff">'+esc(x[0])+'</p>').join('')+'</div></div>';
out+='<div class="sectionhead"><h3>Substitution trick: reuse a sentence structure</h3></div><div class="card"><p><b>Il / Elle est ...</b> = He / She is ... → <span class="positive">Thomas est réservé. / Justine est curieuse.</span></p><p><b>Il / Elle veut ...</b> = He / She wants ... → <span class="positive">Thomas veut être seul. / Justine veut être son amie.</span></p><p><b>Parce que ...</b> = Because ... → <span class="positive">Il est furieux parce que les autres parlent de lui.</span></p><p><b>Mais ...</b> = But ... → <span class="positive">Elle lui parle, mais il refuse.</span></p><p><b>Cela montre que ...</b> = This shows that ... → <span class="positive">Cela montre que les rumeurs peuvent faire du mal.</span></p><p style="font-size:12px">For two questions, choose the closest two topic models and use one universal opening and one ending for each. That is 2 × (1 + 3 + 1) = 10 sentences.</p></div>';return out}
function normalize(s){return String(s).toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function checkWriting(){let got=$('#writebox').value,expected=writeLines()[state.writeLine][0],a=normalize(got).split(' ').filter(Boolean),b=normalize(expected).split(' ').filter(Boolean),common=a.filter(w=>b.includes(w)).length,score=Math.round(100*common/Math.max(a.length,b.length,1));$('#writingfeedback').innerHTML='<div class="answer"><b>'+(score>=85?'<span class="positive">Strong recall!':'<span class="negative">Keep practising!')+'</span></b> · Word overlap approximately '+score+'% (not a grammar grade).<p><b>Model:</b> '+esc(expected)+'</p><button class="btn sm secondary" onclick="speak(writeLines()[state.writeLine][0],.8)">♫ Replay</button></div>';progress.write=(progress.write||0)+1;save()}
function showWriteAnswer(){const el=$('#writingfeedback');el.innerHTML='<div class="answer"><b>French sentence</b><p style="color:#fff">'+esc(writeLines()[state.writeLine][0])+'</p><p>Read it, hide it, type it again. Practise until you can recall it twice consecutively.</p></div>'}
function newMock(){state.mock=sample(STUDY.facts,10);state.mockIndex=0;state.mockScore=0;state.mockAnswer=null;state.mockPart='listen';render()}
function mock(){let q=state.mock[state.mockIndex];let out=top('STATION 06 · EXAM SIMULATION','Mock: 10 listening questions','Do all ten with exam-speed audio. Every statement stays hidden until you select your answer. You can replay, but aim to need fewer replays each time.')+'<button class="btn secondary" onclick="newMock()">Start fresh simulation</button>';
if(!state.mock.length)return out+'<div class="card center" style="margin-top:20px"><h3>Mock exam ready</h3><button class="btn" onclick="newMock()">Begin</button></div>';
if(state.mockIndex>=state.mock.length)return out+'<div class="card center" style="margin-top:20px"><h2>Mock completed</h2><div class="timer">'+state.mockScore+'/10</div><p>'+(state.mockScore>=9?'Excellent — now do the two writing responses.':'Review chapter notes and retry a fresh randomized set.')+'</p><button class="btn" onclick="navigate(\'writing\')">Move to writing</button> <button class="btn secondary" onclick="newMock()">New mock</button></div>';
return out+'<div class="quizbig center" style="margin-top:20px"><span class="pill">Écoute · '+(state.mockIndex+1)+'/10</span><div class="progress"><div style="width:'+(state.mockIndex*10)+'%"></div></div><div class="listen-icon">♫</div><button class="btn" onclick="speak(state.mock[state.mockIndex][1],1)">▶ Hear exam-speed French</button><div class="two" style="margin-top:23px"><button class="option center" onclick="mockAnswer(true)" '+(state.mockAnswer!==null?'disabled':'')+'>VRAI</button><button class="option center" onclick="mockAnswer(false)" '+(state.mockAnswer!==null?'disabled':'')+'>FAUX</button></div>'+(state.mockAnswer!==null?'<div class="answer"><b class="'+(state.mockAnswer===q[2]?'positive':'negative')+'">'+(state.mockAnswer===q[2]?'Correct':'Incorrect')+'</b><p style="color:white">'+esc(q[1])+'</p><p>'+esc(q[3])+'</p></div><button class="btn" style="margin-top:18px" onclick="state.mockIndex++;state.mockAnswer=null;render()">Next →</button>':'')+'</div>'}
function mockAnswer(x){if(state.mockAnswer!==null)return;state.mockAnswer=x;if(x===state.mock[state.mockIndex][2])state.mockScore++;render()}
function schedule(){return top('STATION 07 · THREE-DAY SPRINT','A practical plan for Tuesday','Your weakest likely section is listening, so it gets the largest share of practice. Don\'t spend the full three days only reading translations.')+
'<div class="day"><div class="eyebrow">DAY 1 · Understand the plot</div><h3>Read and map every chapter</h3><p>45–60 minutes: read the French with translations; 30 minutes: learn the memory notes; 30 minutes: two 10-question écoute sets; 20 minutes: understand all three writing models.</p><div class="row"><button class="btn sm secondary" onclick="navigate(\'story\')">Story</button><button class="btn sm secondary" onclick="navigate(\'notes\')">Notes</button></div></div>'+
'<div class="day"><div class="eyebrow">DAY 2 · Intensive listening + writing</div><h3>Build reliable recall</h3><p>40 minutes: three listening sets with transcript hidden; 25 minutes: reading MC and short answers; 45 minutes: writing line-by-line until each sentence can be typed without hints; 15 minutes: revisit every listening mistake.</p><div class="row"><button class="btn sm secondary" onclick="navigate(\'listening\')">Écoute lab</button><button class="btn sm secondary" onclick="navigate(\'writing\')">Écriture trainer</button></div></div>'+
'<div class="day"><div class="eyebrow">DAY 3 · Simulate and fix weak spots</div><h3>Stop passive reading</h3><p>30 minutes: two mock listening exams at 1.0×; 30 minutes: 10 lecture questions; 30 minutes: write two five-sentence answers with no model; 25 minutes: review names, places and false-rumour traps; last 10 minutes: explain the plot aloud.</p><div class="row"><button class="btn sm secondary" onclick="navigate(\'exam\')">Mock quiz</button><button class="btn sm secondary" onclick="navigate(\'reading\')">Reading quiz</button></div></div>'+
'<div class="card"><h3>Quick listening trap checklist</h3><p>Before selecting V or F: did the sentence flip the person, change the location, use a negation, change the day, confuse a rumour with fact, or replace a precise detail such as “left shoulder” with “right shoulder”?</p><p>The practice voice uses your browser\'s French text-to-speech. It may pronounce some names differently from your teacher. Listen to meaning and key content, not its accent.</p></div>'+
'<div class="sectionhead"><h3>Your practice counters</h3></div><div class="stats"><div class="stat"><strong>'+(progress.listen||0)+'</strong><span>listening answers submitted</span></div><div class="stat"><strong>'+(progress.read||0)+'</strong><span>reading MC answers submitted</span></div><div class="stat"><strong>'+(progress.write||0)+'</strong><span>writing checks performed</span></div><div class="stat"><strong>2</strong><span>writing questions to answer on quiz</span></div></div><button class="btn ghost sm" onclick="if(confirm(\'Reset your practice counters?\')){progress={};save();render()}">Reset counters</button>'}
function render(){navigation();const map={home,story,notes,listening,reading,writing,exam:mock,schedule};$('#view').innerHTML=(map[state.page]||home)()+'<div class="footer">Casse-tête · Chapters 1–5 study companion · Based on the five supplied scans and your quiz outline. Practice questions and English translations are authored study aids, not official teacher questions. Browser voice support varies. No account or server-side progress collection; simple counters are stored on your device.</div>'}
render();
</script></body></html>
